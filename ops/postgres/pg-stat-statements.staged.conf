# STAGED ONLY — not included by docker-compose or the live PostgreSQL config.
# Applying shared_preload_libraries requires a controlled PostgreSQL restart.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = 'auto'
track_io_timing = on
pg_stat_statements.track = 'top'
pg_stat_statements.track_utility = off
pg_stat_statements.save = on
pg_stat_statements.max = 5000

# Privacy boundary: do not enable raw statement logging as a substitute.
log_statement = 'none'
log_min_duration_statement = -1
