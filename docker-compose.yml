# docker-compose.yml — production ready for self-hosted runner

services:
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mercasto-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - VITE_BUYER_NUDGE_ROLLOUT_PERCENT=${VITE_BUYER_NUDGE_ROLLOUT_PERCENT:-0}
    container_name: mercasto_frontend_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security_headers.conf:/etc/nginx/conf.d/security_headers.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
      - ./backend:/var/www:ro
    restart: unless-stopped
    depends_on:
      mercasto-backend:
        condition: service_healthy
      mercasto-reverb:
        condition: service_started
    # УЛУЧШЕНИЕ 1: реальный healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - autoheal=true
    networks:
      - default
      - automation-net

  mercasto-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: mercasto_backend_container
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "OLLAMA_TEXT_MODEL=qwen3.8:9b-local"
      - "OLLAMA_VISION_MODEL=qwen3-vl:2b-instruct"
      - "AI_MODERATION_GATEWAY_URL=http://mercasto-ai-gateway:8080"
      - "AI_MODERATION_GATEWAY_TIMEOUT=${AI_MODERATION_GATEWAY_TIMEOUT:-150}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Runtime health must prove Laravel can authenticate to PostgreSQL.
    healthcheck:
      test: ["CMD", "php", "/var/www/health-db.php"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    # УЛУЧШЕНИЕ 2: deploy policy для self-hosted
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - autoheal=true

  mercasto-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_worker_container
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-moderation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_moderation_worker_container
    command: php artisan queue:work --queue=ai-moderation --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "AI_MODERATION_GATEWAY_URL=http://mercasto-ai-gateway:8080"
      - "AI_MODERATION_GATEWAY_TIMEOUT=${AI_MODERATION_GATEWAY_TIMEOUT:-150}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercasto-ai-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_scheduler_container
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_reverb_container
    command: php artisan reverb:start --host=0.0.0.0 --port=8082
    expose:
      - "8082"
    networks:
      default:
        aliases:
          - mercasto-reverb
          - mercasto_reverb_container
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-autofill-model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:991cf50e9eb7dee4c18090849c7f909bafc5a1884cdde2dc3011df7407da09d6
    container_name: mercasto_autofill_model
    command:
      - "-hf"
      - "ggml-org/SmolVLM2-500M-Video-Instruct-GGUF:Q8_0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "4"
      - "-tb"
      - "4"
      - "-b"
      - "256"
      - "-ub"
      - "64"
      - "--parallel"
      - "1"
      - "--poll"
      - "0"
    expose:
      - "8080"
    networks:
      - autofill-private
      - autofill-egress
    cpus: "4.0"
    mem_limit: 2g
    volumes:
      - autofill_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true

  mercasto-ai-gateway:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
    container_name: mercasto_ai_gateway
    expose:
      - "8080"
    networks:
      - default
      - autofill-private
    environment:
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "OLLAMA_VISION_MODEL=qwen3-vl:2b-instruct"
      - "AUTOFILL_MODEL_BASE_URL=http://mercasto-autofill-model:8080"
      - "AUTOFILL_MODEL_NAME=smolvlm2-500m"
      - "AUTOFILL_TIMEOUT_SECONDS=${AUTOFILL_TIMEOUT_SECONDS:-18}"
      - "AUTOFILL_PREWARM_ENABLED=true"
      - "OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT:-90}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true

  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: mercasto_ollama
    expose:
      - "11434"
    cpus: "8.0"
    mem_limit: 14g
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
      - /opt/reef-models/Qwen3.8-9B-Q4_K_M.gguf:/models/Qwen3.8-9B-Q4_K_M.gguf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true

  postgres:
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: mercasto_db_container
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - track_io_timing=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - pg_stat_statements.save=on
      - -c
      - pg_stat_statements.max=5000
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mercasto}
      POSTGRES_USER: ${DB_USERNAME:-mercasto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mercasto_user} -d ${DB_DATABASE:-mercasto}"]
      interval: 60s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: mercasto_db_backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./postgres-backups:/backups
    entrypoint: >
      /bin/bash -c "
      while true; do
        FILE=/backups/backup_$$(date +%Y%m%d_%H%M).dump;
        pg_dump -h postgres -U ${DB_USERNAME:-mercasto_user} -d ${DB_DATABASE:-mercasto} -F c -f $$FILE && echo \"Backup: $$FILE\";
        find /backups -type f -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: mercasto_redis_container
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    expose:
      - "6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: cadvisor
    profiles: ["monitoring"]
    expose: ["8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.0@sha256:497fe921f22fea8535fa2bcb1c193dacc6ce98c08274257b3d18a4eaae0f9647
    container_name: prometheus
    profiles: ["monitoring"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose: ["9090"]
    depends_on: [cadvisor]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: grafana
    profiles: ["monitoring"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}"
    depends_on: [prometheus]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/dns-cloudflare:v2.10.0@sha256:d0ad4a78aaf11466780bba575dfb16ea0f8abfdca7c42dbfdcd786d50bf40dc6
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:
  autofill_model_cache:

networks:
  # This network is long-lived production infrastructure shared by the Mercasto
  # services. Compose must attach to it, never remove/recreate it during a
  # partial service rollout.
  default:
    external: true
    name: mercasto_default
  automation-net:
    external: true
    name: automation-net
  autofill-private:
    internal: true
  autofill-egress:
    driver: bridge
