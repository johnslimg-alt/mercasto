# docker-compose.yml — production ready for self-hosted runner

services:
  autoheal:
    image: willfarrell/autoheal:1.2.1
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mercasto-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - VITE_BUYER_NUDGE_ROLLOUT_PERCENT=${VITE_BUYER_NUDGE_ROLLOUT_PERCENT:-0}
    container_name: mercasto_frontend_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security_headers.conf:/etc/nginx/conf.d/security_headers.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
      - ./backend:/var/www:ro
    restart: unless-stopped
    depends_on:
      mercasto-backend:
        condition: service_healthy
      mercasto-reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null 2>&2 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - autoheal=true
    networks:
      - default
      - automation-net

  mercasto-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: mercasto_backend_container
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "OLLAMA_TEXT_MODEL=qwen3.8:9b-local"
      - "OLLAMA_VISION_MODEL=qwen3-vl:2b-instruct"
      - "AI_MODERATION_GATEWAY_URL=http://mercasto-ai-gateway:8080"
      - "AI_MODERATION_GATEWAY_TIMEOUT=${AI_MODERATION_GATEWAY_TIMEOUT:-150}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
      - "SEMANTIC_DISCOVERY_ENABLED=${SEMANTIC_DISCOVERY_ENABLED:-true}"
      - "SEMANTIC_SIMILAR_ENABLED=${SEMANTIC_SIMILAR_ENABLED:-true}"
      - "SEMANTIC_SIMILAR_LIMIT=${SEMANTIC_SIMILAR_LIMIT:-8}"
      - "SEMANTIC_SIMILAR_MAX_DISTANCE=${SEMANTIC_SIMILAR_MAX_DISTANCE:-0.45}"
      - "SEMANTIC_SIMILAR_PRICE_MIN_RATIO=${SEMANT_SIMILAR_PRICE_MIN_RATIO:-0.5}"
      - "SEMANTIC_SIMILAR_PRICE_MAX_RATIO=${SEMANTIC_SIMILAR_PRICE_MAX_RATIO:-1.75}"
      - "SEMANTIC_SIMILAR_ZERO_PRICE_MAX=${SEMANTIC_SIMILAR_ZERO_PRICE_MAX:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "/var/www/health-db.php"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - autoheal=true

  mercasto-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_worker_container
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-moderation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_moderation_worker_container
    command: php artisan queue:work --queue=ai-moderation --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "AI_MODERATION_GATEWAY_URL=http://mercasto-ai-gateway:8080"
      - "AI_MODERATION_GATEWAY_TIMEOUT=${AI_MODERATION_GATEWAY_TIMEOUT:-150}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercasto-ai-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_scheduler_container
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-reverb:
    build:
     \ context: ./backend
      dockerfile: Dockerfile
    container_name: mercasto_reverb_container
    command: php artisan reverb:start --host=0.0.0.0 --port=8082
    expose:
      - "8082"
    networks:
      default:
        aliases:
          - mercasto-reverb
          - mercasto_reverb_container
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - "DB_HOST=postgres"
      - "REDIS_HOST=redis"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=false

  mercasto-ai-gateway:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
    container_name: mercasto_ai_gateway
    expose:
      - "8080"
    environment:
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "OLLAMA_VISION_MODEL=qwen3-vl:2b-instruct"
      - "OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT:-90}"
      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true

  ollama:
    image: ollama/ollama:0.32.6
    container_name: mercasto_ollama
    expose:
      - "11434"
    cpus: "8.0"
    mem_limit: 14g
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
      - /opt/reef-models/Qwen3.8-9B-Q4_K_M.gguf:/models/Qwen3.8-9B-Q4_K_M.gguf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true

  postgres:
    image: pgvector/pgvector:pg18
    container_name: mercasto_db_container
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - track_io_timing=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - pg_stat_statements.save=on
      - -c
      - pg_stat_statements.max=5000
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mercasto}
      POSTGRES_USER: ${DB_USERNAME:-mercasto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_...