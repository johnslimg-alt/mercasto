resolver 127.0.0.11 valid=10s ipv6=off;
fastcgi_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=API_CACHE:10m max_size=50m inactive=60m use_temp_path=off;

# Hide the nginx version on HTTP redirects, HTTPS responses, and internal listeners.
server_tokens off;

# Restore the real visitor address only when the TCP peer is a Cloudflare edge.
# Direct-to-origin requests keep their socket address because untrusted peers cannot
# influence CF-Connecting-IP. Keep these CIDRs in sync with cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Origin-level abuse controls. These remain useful behind a future CDN/WAF, but
# real client IP restoration must be configured before proxying traffic.
limit_req_zone $binary_remote_addr zone=mercasto_api_per_ip:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mercasto_conn_per_ip:20m;

# Internal-only endpoint used by Laravel to decorate the current Vite shell with
# route-specific SEO metadata. Port 8081 is not published on the host.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /index.html {
        root /usr/share/nginx/html;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;
    
    # Разрешаем Certbot проверять владение доменом (HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mercasto.com www.mercasto.com api.mercasto.com;
    set $reef_crm_backend "http://reef-crm:3000";

    # SSL certificate paths (mounted from host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/mercasto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercasto.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Bound slow clients and per-IP concurrency at the origin. Application-level
    # limiters remain the authoritative controls for login, uploads, payments, etc.
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn_status 429;
    limit_conn_log_level warn;
    limit_conn mercasto_conn_per_ip 60;
    client_header_timeout 15s;
    client_body_timeout 120s;
    send_timeout 60s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Match PHP upload runtime limits and leave room for Laravel video validation.
    client_max_body_size 64m;

    # Security headers
    include /etc/nginx/conf.d/security_headers.conf;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    charset utf-8;

    # Keep common scanner/probe paths out of the SPA fallback.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* ^/(backend/)?(\.env.*|\.git|\.aws|composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|vite\.config\.(js|ts|mjs)|tailwind\.config\.(js|ts|mjs)|config\.json|js/config\.js|env)$ {
        return 404;
    }

    location ~* ^/(backend|vendor|server-status|nginx_status)(/.*)?$ {
        return 404;
    }

    location ~* ^/(horizon|vendor/horizon)(/.*)?$ {
        return 404;
    }

    # This application is not WordPress. Reject common WordPress exploit/scanner
    # paths at the edge instead of serving the SPA shell or invoking Laravel.
    location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-json)(?:/.*)?$ {
        return 404;
    }

    # Retire stale/demo URLs that were indexed before the Mexico-wide launch.
    location ~* ^/(ru|20-ninos|contact-us)(/)?$ {
        return 410;
    }

    location ~* ^/listing/ {
        return 301 /;
    }

    # llms.txt is intentionally not published; do not serve the SPA shell for it.
    location = /llms.txt { return 404; }

    # Mobile app association files must bypass the SPA fallback.
    location = /.well-known/assetlinks.json {
        root /var/www/public;
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Do not return the SPA shell for Apple's association endpoint before the
    # signed Team ID file is available. This location will start serving JSON
    # automatically once backend/public/.well-known/apple-app-site-association exists.
    location = /.well-known/apple-app-site-association {
        root /var/www/public;
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Canonical public source pages replace the older SPA-only aliases.
    location = /safety { return 301 /seguridad; }
    location = /acerca-de { return 301 /sobre-mercasto; }
    location = /terms { return 301 /terminos; }
    location = /privacy { return 301 /privacidad; }
    location = /help { return 301 /ayuda; }

    # Server-decorated SPA shells give crawlers the correct initial canonical,
    # Open Graph and JSON-LD while the browser still boots the same React app.
    location ~ ^/(como-funciona|seguridad|tarifas|sobre-mercasto|ayuda/publicar-anuncio|ayuda/comprar-y-contactar)/?$ {
        limit_req zone=mercasto_api_per_ip burst=120 nodelay;
        root /var/www/public;
        try_files $uri /index.php?$query_string;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=60, s-maxage=60" always;
    }

    # Sitemap-listed verticals/public pages and canonical aliases must reach Laravel
    # so the initial HTML has the same title/canonical/robots/schema as hydrated React.
    location ~ ^/(motor|inmuebles|servicios|empleos|electronica|hogar|moda|ocio|infantil|mascotas|negocios|boletos|productos|turismo|tiendas|terminos|privacidad|cookies|contacto|ayuda|autos|tecnologia|telefonos|informatica|telefonia|hospedaje|tours|boletos_turismo|articulos_camping|souvenirs|renta_vehiculos|guias_servicios|atracciones_exp|retiros_bienestar)/?$ {
        limit_req zone=mercasto_api_per_ip burst=120 nodelay;
        root /var/www/public;
        try_files $uri /index.php?$query_string;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=60, s-maxage=60" always;
    }

    location = /listings {
        limit_req zone=mercasto_api_per_ip burst=120 nodelay;
        root /var/www/public;
        try_files $uri /index.php?$query_string;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=60, s-maxage=60" always;
    }

    location ~ ^/ads/[0-9]+/?$ {
        limit_req zone=mercasto_api_per_ip burst=120 nodelay;
        root /var/www/public;
        try_files $uri /index.php?$query_string;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=60, s-maxage=60" always;
    }

    # === REEF COURIER VIA MERCASTO ===
    location = /courier/ { return 308 /courier; }

    location = /courier {
        proxy_pass $reef_crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/courier/ {
        proxy_pass $reef_crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /_next/ {
        proxy_pass $reef_crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /courier-manifest.webmanifest {
        proxy_pass $reef_crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache" always;
    }

    location = /courier-sw.js {
        proxy_pass $reef_crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Service-Worker-Allowed "/courier" always;
        add_header Cache-Control "no-cache" always;
    }
    # === END REEF COURIER VIA MERCASTO ===

    # 1. Frontend SPA (React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 1.5. Cache immutable frontend build assets aggressively.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @stale_frontend_asset;
    }

    # Old tabs/service workers may request deleted Vite chunks after a deploy.
    # Return a valid JS module that refreshes the app instead of HTML/immutable 404.
    location @stale_frontend_asset {
        root /usr/share/nginx/html;
        expires off;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        rewrite ^ /stale-module.js break;
    }

    location = /stale-module.js {
        root /usr/share/nginx/html;
        expires off;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        expires off;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Dynamic SEO sitemaps are generated by Laravel, not by the SPA.
    location ~ ^/sitemap(?:-(?:main|categories|states|ads))?\.xml$ {
        root /var/www/public;
        rewrite ^ /index.php last;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=1800" always;
    }

    # 2. Serve uploaded media directly (bypass PHP)
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        # Cache static assets
        expires 30d;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, no-transform" always;
    }

    # 2.5. Laravel health endpoint must bypass the SPA shell
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 2.9. Cache featured ads API endpoint to speed up initial load / LCP
    location = /api/ads/featured {
        root /var/www/public;
        fastcgi_pass mercasto-backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;

        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        fastcgi_cache API_CACHE;
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_lock on;

        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-FastCGI-Cache $upstream_cache_status;
    }

    # 3. Route API and server-rendered share pages to Laravel
    location ~ ^/(api|webhooks|broadcasting|sanctum|graphql|share) {
        # Generous burst for normal SPA startup; sustained floods are capped.
        limit_req zone=mercasto_api_per_ip burst=120 nodelay;
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 4. PHP-FPM backend handler. Only Laravel's front controller is public;
    # arbitrary *.php scanner paths must never reach PHP-FPM.
    location = /index.php {
        root /var/www/public;
        fastcgi_pass mercasto-backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;
    }

    location ~* \.php$ {
        return 404;
    }

    # 5. WebSockets (Reverb)
    location /app {
        # Prevent one address from exhausting websocket workers.
        limit_conn mercasto_conn_per_ip 10;
        proxy_pass http://mercasto-reverb:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
    }
}
