<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mercasto default Open Graph card.
  SOURCE OF TRUTH - edit this SVG, then regenerate the raster assets with
  `node scripts/rasterize-og-default.mjs` (see design/og/README.md).

  Canvas: 1200x630 (1.905:1). This is the cross-platform "large preview"
  standard, but the platforms publish slightly different ratios, so every
  element is kept inside a 96px safe margin:
      Facebook   1200x630 (1.905) - no crop
      WhatsApp   1200x630 (1.905) - no crop
      X/Twitter  1200x628 (1.911) - ~1px each side
      LinkedIn   1200x627 (1.914) - ~9px each side
  Nothing load-bearing may sit outside x=96..1104 or y=40..590.

  Legibility budget: this card is dominated by ~300x158 thumbnails in a feed.
  The wordmark (46px), headline (68px) and pills (23px) are sized to survive a
  4x downscale; nothing else is decorative. If it is not readable at 300px
  wide, it does not belong on this card.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="Mercasto - clasificados en México">
  <title>Mercasto - clasificados en México</title>

  <defs>
    <linearGradient id="pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <!-- Lime wash: brand presence without lifting the background enough to
         matter for text contrast (worst measured case 16.07:1, see README). -->
    <radialGradient id="glow" cx="16%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="96%" r="60%">
      <stop offset="0%" stop-color="#0F8F7D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F8F7D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Opaque base. Never transparent: crawlers and dark feeds composite onto
       unknown backgrounds and a transparent card renders unpredictably.
       Supplying the background also removes JPEG ringing around the type. -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 8px lime rail: the strongest "this is a card, not a photo" cue at
       thumbnail size. Full-bleed on purpose - a crop trims it symmetrically
       and it degrades gracefully. -->
  <rect x="0" y="0" width="1200" height="8" fill="#84CC16"/>

  <!-- Inner keyline: stops the card bleeding into a white feed. -->
  <rect x="48.5" y="32.5" width="1103" height="565" rx="20"
        fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Brand lockup: pin + wordmark -->
  <g transform="translate(104 74)">
    <g transform="scale(0.72)">
      <path d="M50 6C28.46 6 11 23.46 11 45c0 28.63 35.73 47.61 38.34 48.96a1.5 1.5 0 0 0 1.32 0C53.27 92.61 89 73.63 89 45 89 23.46 71.54 6 50 6Z"
            fill="url(#pin)"/>
      <path d="M29 60V34.5a2.5 2.5 0 0 1 4.11-1.92L50 47l16.89-14.42A2.5 2.5 0 0 1 71 34.5V60"
            fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
    </g>
    <text x="82" y="56" font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
          font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Mercasto</text>
  </g>

  <!-- Headline: the one line that must survive a 300px thumbnail. -->
  <text x="104" y="322" font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1.6">Compra y vende</text>
  <text x="104" y="404" font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="68" font-weight="800" fill="#84CC16" letter-spacing="-1.6">cerca de ti</text>

  <!-- Category pills: the marketplace cue. Fills only - lime never carries
       small text on a light ground (1.98:1 on white). -->
  <g font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
     font-size="23" font-weight="700">
    <rect x="104" y="462" width="146" height="46" rx="23" fill="#84CC16"/>
    <text x="177" y="492" fill="#0F172A" text-anchor="middle">Motor</text>

    <rect x="264" y="462" width="196" height="46" rx="23" fill="#1F2937" stroke="#334155"/>
    <text x="362" y="492" fill="#E2E8F0" text-anchor="middle">Inmuebles</text>

    <rect x="474" y="462" width="154" height="46" rx="23" fill="#1F2937" stroke="#334155"/>
    <text x="551" y="492" fill="#E2E8F0" text-anchor="middle">Empleos</text>

    <rect x="642" y="462" width="190" height="46" rx="23" fill="#1F2937" stroke="#334155"/>
    <text x="737" y="492" fill="#E2E8F0" text-anchor="middle">Servicios</text>
  </g>

  <!-- Footer: domain + country, kept inside the safe margin (ends at x=1104). -->
  <text x="104" y="566" font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="26" font-weight="700" fill="#84CC16">mercasto.com</text>
  <text x="1096" y="566" text-anchor="end"
        font-family="Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="24" font-weight="600" fill="#CBD5E1">Clasificados en todo México</text>
</svg>
