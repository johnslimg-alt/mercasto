name: Temporary Cabinet Login 429 Patch

on:
  push:
    branches:
      - fix/admin-report-lifecycle-ui-rebased

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-report-lifecycle-ui-rebased
      - name: Make isolated cabinet login respect rate limiting
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/authenticated-cabinet-matrix.spec.js')
          source = path.read_text()
          old = """async function authenticate(request, role) {
  const response = await request.post(`${API_BASE_URL}/login`, { data: credentials[role] });
  expect(response.ok(), `${role} login`).toBeTruthy();
  const payload = await response.json();
  return { token: payload.access_token || payload.token, user: payload.user };
}
"""
          new = """async function authenticate(request, role) {
  const maxAttempts = 6;
  let response;

  for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
    response = await request.post(`${API_BASE_URL}/login`, { data: credentials[role] });
    if (response.ok() || response.status() !== 429 || attempt === maxAttempts) break;

    const payload = await response.json().catch(() => ({}));
    const retryAfterHeader = Number(response.headers()['retry-after'] || 0);
    const retryAfterBody = Number(payload?.retry_after || 0);
    const retryAfterSeconds = Math.max(1, retryAfterHeader, retryAfterBody);
    await new Promise(resolve => setTimeout(resolve, retryAfterSeconds * 1000));
  }

  expect(response?.ok(), `${role} login status=${response?.status() ?? 'unavailable'}`).toBeTruthy();
  const payload = await response.json();
  return { token: payload.access_token || payload.token, user: payload.user };
}
"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected authenticate block once, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit cabinet QA retry fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/authenticated-cabinet-matrix.spec.js
          git diff --cached --check
          git commit -m 'test: respect login rate limit in cabinet matrix'
          git push origin HEAD:fix/admin-report-lifecycle-ui-rebased
