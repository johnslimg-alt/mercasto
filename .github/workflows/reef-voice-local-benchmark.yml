name: Reef local AI source persistence

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  persist:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Create clean Reef source branch with workflow only
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=/root/reef-crm
          FILE=ops/n8n/workflows/reef-whatsapp-workflow.json
          BR=fix/local-ai-private-inference-20260829
          WT=/tmp/reef-local-ai-worktree
          PATCH=/tmp/reef-local-ai-workflow.patch
          sudo -n git -C "$REPO" diff --binary HEAD -- "$FILE" > "$PATCH"
          test -s "$PATCH"
          sudo -n git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
          sudo -n git -C "$REPO" branch -D "$BR" >/dev/null 2>&1 || true
          sudo -n git -C "$REPO" worktree add -b "$BR" "$WT" HEAD
          sudo -n git -C "$WT" apply "$PATCH"
          CHANGED=$(sudo -n git -C "$WT" status --short | awk '{print $2}')
          echo "changed_files=$CHANGED"
          test "$CHANGED" = "$FILE"
          sudo -n git -C "$WT" add -- "$FILE"
          sudo -n git -C "$WT" -c user.name='Reef Ops' -c user.email='ops@reefmotors.com' commit -m 'Route Reef AI inference fully local'
          ORIGIN=$(sudo -n git -C "$WT" remote get-url origin | sed -E 's#https://[^/@]+@#https://***@#')
          echo "origin=$ORIGIN"
          sudo -n git -C "$WT" push -u origin "$BR"
          echo "branch=$BR"
          sudo -n git -C "$WT" show --stat --oneline --decorate -1
          sudo -n git -C "$REPO" worktree remove --force "$WT"
