name: Reef voice local benchmark

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - name: Extract one real voice sample privately
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n rm -rf /tmp/reef-voice-bench
          sudo -n mkdir -p /tmp/reef-voice-bench
          sudo -n chown -R "$(id -u):$(id -g)" /tmp/reef-voice-bench
          sudo -n python3 - <<'PY'
          import sqlite3
          db='/root/automation-stack/n8n_data/database.sqlite'
          con=sqlite3.connect(db); cur=con.cursor()
          rid=cur.execute("""
            select e.id from execution_entity e join execution_data d on d.executionId=e.id
            where e.workflowId=? and d.data like '%audioMessage%' order by e.id desc limit 1
          """,('Og5UJWua14sZ2wNx',)).fetchone()[0]
          s=cur.execute('select data from execution_data where executionId=?',(rid,)).fetchone()[0]
          open(f'/tmp/reef-voice-bench/execution-{rid}.txt','w').write(s)
          open('/tmp/reef-voice-bench/id.txt','w').write(str(rid))
          print('sample_execution_id=',rid)
          PY
          RID=$(cat /tmp/reef-voice-bench/id.txt)
          docker cp /tmp/reef-voice-bench/execution-$RID.txt n8n:/tmp/execution-$RID.txt
          docker exec -i n8n node - "$RID" <<'NODE'
          const fs=require('fs'); const id=process.argv[2];
          const {parse}=require('/usr/local/lib/node_modules/n8n/node_modules/.pnpm/flatted@3.4.2/node_modules/flatted');
          const obj=parse(fs.readFileSync(`/tmp/execution-${id}.txt`,'utf8'));
          const rd=obj?.resultData?.runData||{};
          const pick=(name)=>{const runs=rd[name]||[];for(let i=runs.length-1;i>=0;i--){const a=runs[i]?.data?.main?.[0];if(Array.isArray(a)&&a[0])return a[0];}return null};
          const gv=pick('Get Voice Base64'), vb=pick('Voice to Binary');
          const b64=gv?.json?.base64||vb?.binary?.data?.data||'';
          const mime=gv?.json?.mimetype||vb?.binary?.data?.mimeType||'audio/mp4';
          if(!b64) throw new Error('no voice payload in saved execution');
          fs.writeFileSync(`/tmp/voice-${id}.bin`,Buffer.from(b64,'base64'));
          console.log(JSON.stringify({id,mime,bytes:Buffer.byteLength(b64,'base64')}));
          NODE
          docker cp n8n:/tmp/voice-$RID.bin /tmp/reef-voice-bench/voice-$RID.bin
          file /tmp/reef-voice-bench/voice-$RID.bin || true
      - name: Build isolated faster-whisper benchmark image
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/reef-voice-bench/Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir faster-whisper==1.2.0 requests
          COPY bench.py /bench.py
          ENTRYPOINT ["python","/bench.py"]
          DOCKER
          cat >/tmp/reef-voice-bench/bench.py <<'PY'
          import os,time,json,re,unicodedata,difflib,gc
          from faster_whisper import WhisperModel
          work='/work'; audio=next(os.path.join(work,x) for x in os.listdir(work) if x.startswith('voice-') and x.endswith('.bin'))
          models=['base','small','large-v3-turbo']; results=[]; texts={}
          def norm(s):
              s=unicodedata.normalize('NFKD',s.lower()); s=''.join(c for c in s if not unicodedata.combining(c));
              return re.sub(r'[^\w\s]+',' ',s,flags=re.UNICODE).strip()
          for name in models:
              try:
                  t=time.time(); model=WhisperModel(name,device='cpu',compute_type='int8',cpu_threads=4,num_workers=1,download_root='/models'); load=time.time()-t
                  t=time.time(); segs,info=model.transcribe(audio,beam_size=5,vad_filter=True,condition_on_previous_text=False,temperature=0.0)
                  text=' '.join(s.text.strip() for s in segs).strip(); sec=time.time()-t
                  texts[name]=text; open(os.path.join(work,f'{name}.txt'),'w',encoding='utf-8').write(text)
                  results.append({'model':name,'ok':True,'load_s':round(load,2),'transcribe_s':round(sec,2),'duration_s':round(float(info.duration or 0),2),'rtf':round(sec/max(float(info.duration or 0),0.001),3),'language':info.language,'language_p':round(float(info.language_probability or 0),3),'chars':len(text)})
                  del model; gc.collect()
              except Exception as e:
                  results.append({'model':name,'ok':False,'error':type(e).__name__})
          successful=[r['model'] for r in results if r.get('ok')]
          sims=[]
          if successful:
              ref=successful[-1]; nr=norm(texts[ref])
              for m in successful[:-1]:
                  nm=norm(texts[m]); ratio=difflib.SequenceMatcher(None,nm,nr).ratio()
                  wa=set(nm.split()); wb=set(nr.split()); jac=len(wa&wb)/max(1,len(wa|wb))
                  sims.append({'model':m,'reference':ref,'char_similarity':round(ratio,3),'token_jaccard':round(jac,3)})
          print('RESULTS='+json.dumps(results,ensure_ascii=False))
          print('SIMILARITY='+json.dumps(sims,ensure_ascii=False))
          PY
          docker build -t reef-faster-whisper-bench:local /tmp/reef-voice-bench
      - name: Run CPU-isolated benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n mkdir -p /root/automation-stack/faster-whisper-cache
          START=$(date +%s)
          docker run --rm --name reef-whisper-bench --cpuset-cpus=0-3 --memory=8g --memory-swap=8g \
            -e OMP_NUM_THREADS=4 -e MKL_NUM_THREADS=4 \
            -v /tmp/reef-voice-bench:/work \
            -v /root/automation-stack/faster-whisper-cache:/models \
            reef-faster-whisper-bench:local | tee /tmp/reef-voice-bench/results.log
          END=$(date +%s)
          echo total_benchmark_s=$((END-START))
          echo crm=$(curl -fsS http://127.0.0.1:3100/api/health)
          echo n8n=$(curl -fsS http://127.0.0.1:5678/healthz)
          docker ps --filter name=reef-nemotron --format 'nemotron={{.Status}}'
