name: Reef voice local benchmark

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Extract recent voice samples privately
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n rm -rf /tmp/reef-voice-bench
          sudo -n mkdir -p /tmp/reef-voice-bench
          sudo -n chown -R "$(id -u):$(id -g)" /tmp/reef-voice-bench
          sudo -n python3 - <<'PY'
          import sqlite3, os
          db='/root/automation-stack/n8n_data/database.sqlite'
          con=sqlite3.connect(db); cur=con.cursor()
          rows=cur.execute("""
            select e.id,e.status,e.startedAt,length(d.data)
            from execution_entity e join execution_data d on d.executionId=e.id
            where e.workflowId=? and (d.data like '%audioMessage%' or d.data like '%Groq Whisper%')
            order by e.id desc limit 12
          """,('Og5UJWua14sZ2wNx',)).fetchall()
          print('voice_execution_ids=',[(r[0],r[1],r[2],r[3]) for r in rows])
          for rid,*_ in rows[:6]:
              s=cur.execute('select data from execution_data where executionId=?',(rid,)).fetchone()[0]
              open(f'/tmp/reef-voice-bench/execution-{rid}.txt','w').write(s)
          print('payloads_saved=',min(6,len(rows)))
          PY
          for f in /tmp/reef-voice-bench/execution-*.txt; do
            [ -e "$f" ] || continue
            docker cp "$f" n8n:/tmp/$(basename "$f")
          done
          docker exec n8n node - <<'NODE'
          const fs=require('fs');
          const {parse}=require('/usr/local/lib/node_modules/n8n/node_modules/.pnpm/flatted@3.4.2/node_modules/flatted');
          const files=fs.readdirSync('/tmp').filter(x=>/^execution-\d+\.txt$/.test(x)).slice(0,6);
          const pick=(rd,name)=>{
            const runs=rd?.[name]; if(!Array.isArray(runs)||!runs.length)return null;
            for(let i=runs.length-1;i>=0;i--){const a=runs[i]?.data?.main?.[0];if(Array.isArray(a)&&a[0])return {item:a[0],run:runs[i]};}
            return null;
          };
          for(const fn of files){
            const id=fn.match(/(\d+)/)[1];
            try{
              const obj=parse(fs.readFileSync('/tmp/'+fn,'utf8'));
              const rd=obj?.resultData?.runData||{};
              const gv=pick(rd,'Get Voice Base64');
              const vb=pick(rd,'Voice to Binary');
              const gw=pick(rd,'Groq Whisper');
              const b64=gv?.item?.json?.base64||vb?.item?.binary?.data?.data||'';
              const mime=gv?.item?.json?.mimetype||vb?.item?.binary?.data?.mimeType||'application/octet-stream';
              const gt=String(gw?.item?.json?.text||'').trim();
              if(b64){fs.writeFileSync(`/tmp/voice-${id}.bin`,Buffer.from(b64,'base64'));}
              if(gt){fs.writeFileSync(`/tmp/groq-${id}.txt`,gt);}
              const meta={id,hasAudio:!!b64,mime,audioBytes:b64?Buffer.byteLength(b64,'base64'):0,groqChars:gt.length,getVoiceMs:gv?.run?.executionTime||null,groqMs:gw?.run?.executionTime||null,groqError:!!gw?.run?.error};
              fs.writeFileSync(`/tmp/meta-${id}.json`,JSON.stringify(meta));
              console.log('sample_meta=',meta);
            }catch(e){console.log('sample_parse_error=',id,e.name);}
          }
          NODE
          for f in /tmp/voice-*.bin /tmp/groq-*.txt /tmp/meta-*.json; do
            docker exec n8n test -f "$f" 2>/dev/null || continue
            docker cp n8n:"$f" /tmp/reef-voice-bench/$(basename "$f")
          done
          echo 'local_samples='$(find /tmp/reef-voice-bench -maxdepth 1 -name 'voice-*.bin' | wc -l)
          for f in /tmp/reef-voice-bench/voice-*.bin; do [ -e "$f" ] && file "$f"; done
          echo 'crm='$(curl -fsS http://127.0.0.1:3100/api/health)
          echo 'n8n='$(curl -fsS http://127.0.0.1:5678/healthz)
