name: Reef local AI source rebase

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  rebase:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Recreate source branch from latest Reef main
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=/root/reef-crm
          FILE=ops/n8n/workflows/reef-whatsapp-workflow.json
          BR=fix/local-ai-private-inference-20260829
          WT=/tmp/reef-local-ai-rebase
          PATCH=/tmp/reef-local-ai-current.patch
          sudo -n git -C "$REPO" diff --binary HEAD -- "$FILE" > "$PATCH"
          test -s "$PATCH"
          sudo -n git -C "$REPO" fetch origin main
          sudo -n git -C "$REPO" worktree remove --force "$WT" >/dev/null 2>&1 || true
          sudo -n git -C "$REPO" branch -D "$BR" >/dev/null 2>&1 || true
          sudo -n git -C "$REPO" worktree add -b "$BR" "$WT" origin/main
          sudo -n git -C "$WT" apply --3way "$PATCH"
          CHANGED=$(sudo -n git -C "$WT" status --short | awk '{print $2}')
          echo "changed_files=$CHANGED"
          test "$CHANGED" = "$FILE"
          sudo -n git -C "$WT" add -- "$FILE"
          sudo -n git -C "$WT" -c user.name='Reef Ops' -c user.email='ops@reefmotors.com' commit -m 'Route Reef AI inference fully local'
          sudo -n git -C "$WT" push --force-with-lease origin "$BR"
          echo branch="$BR"
          sudo -n git -C "$WT" show --stat --oneline -1
          sudo -n git -C "$REPO" worktree remove --force "$WT"
