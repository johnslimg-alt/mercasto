name: Temporary patch state filter

on:
  push:
    branches:
      - fix/state-filter-location-fallback

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'portable state filter implementation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/state-filter-location-fallback
          fetch-depth: 0
      - name: Replace PostgreSQL-only state predicate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/Http/Controllers/Api/AdController.php')
          text = path.read_text()
          replacements = [
              ("$q->whereRaw('state ILIKE ?', [$state])", "$q->whereLike('state', $state)"),
              ("->orWhereRaw('location ILIKE ?', [$locationLike]);", "->orWhereLike('location', $locationLike);"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/temporary-patch-state-filter.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/Http/Controllers/Api/AdController.php .github/workflows/temporary-patch-state-filter.yml
          git commit -m 'fix: portable state filter implementation'
          git push origin HEAD:fix/state-filter-location-fallback