name: One-shot security log permission repair

on:
  push:
    branches:
      - ops/security-log-permission-repair-20260925
    paths:
      - .github/workflows/one-shot-security-log-permission-repair.yml

permissions:
  contents: read

concurrency:
  group: one-shot-security-log-permission-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Diagnose shared Laravel security logging
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Guard one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/ops/security-log-permission-repair-20260925"
          test -d /var/www/mercasto/.git
          cd /var/www/mercasto
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "e2285004135c919997940abfda98c91e7e08ae80"
          test -z "$(git status --porcelain --untracked-files=all)"
          docker inspect mercasto_backend_container >/dev/null

      - name: Normalize and report security log metadata
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u 0 mercasto_backend_container sh -lc '
            set -eu
            LOG_DIR=/var/www/storage/logs
            chown root:www-data "$LOG_DIR"
            chmod 2770 "$LOG_DIR"
            find "$LOG_DIR" -maxdepth 1 -type f -name "*.log" -exec chgrp www-data {} \;
            find "$LOG_DIR" -maxdepth 1 -type f -name "*.log" -exec chmod 0660 {} \;
            echo "log_dir=$(stat -c "%U:%G mode=%a" "$LOG_DIR")"
            find "$LOG_DIR" -maxdepth 1 -type f -name "security*.log" -printf "security_file=%f uid=%u gid=%g mode=%m size=%s\n" | sort
            echo "php_fpm_processes:"
            ps -eo user,pid,comm | grep "[p]hp-fpm" || true
          '

      - name: Prove direct security-channel write as www-data
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u www-data mercasto_backend_container php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\Log::channel("security")->warning(
              "security_permission_probe",
              ["event" => "permission_probe", "status" => 499, "route" => "diagnostic"]
            );
            echo "DIRECT_SECURITY_LOG_WRITE_OK\n";
          '

      - name: Probe web middleware event without exposing log contents
        shell: bash
        run: |
          set -euo pipefail
          count_events() {
            docker exec mercasto_backend_container sh -lc               "grep -h -c '\"event\":\"authentication_required\"' storage/logs/security*.log 2>/dev/null | awk '{s+=\$1} END {print s+0}'"
          }
          before="$(count_events)"
          status="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 20 https://mercasto.com/api/user)"
          sleep 2
          after="$(count_events)"
          catch_count="$(docker logs --since 2m mercasto_backend_container 2>&1 | grep -c 'Mercasto security audit logging failed' || true)"
          echo "web_status=$status"
          echo "auth_event_before=$before"
          echo "auth_event_after=$after"
          echo "security_audit_catch_count=$catch_count"
          test "$status" = 401
          if [ "$after" -gt "$before" ]; then
            echo "WEB_SECURITY_AUDIT_WRITE_OK"
          else
            echo "WEB_SECURITY_AUDIT_WRITE_MISSING"
            exit 23
          fi
