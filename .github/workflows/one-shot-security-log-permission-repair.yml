name: One-shot security log permission repair

on:
  push:
    branches:
      - ops/security-log-permission-repair-20260925
    paths:
      - .github/workflows/one-shot-security-log-permission-repair.yml

permissions:
  contents: read

jobs:
  repair:
    name: Bridge current security log ownership
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Guard one-shot scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/ops/security-log-permission-repair-20260925"
          test -d /var/www/mercasto/.git
          cd /var/www/mercasto
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "e2285004135c919997940abfda98c91e7e08ae80"
          test -z "$(git status --porcelain --untracked-files=all)"
          docker inspect mercasto_backend_container >/dev/null

      - name: Make current security log writable by PHP-FPM owner
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u 0 mercasto_backend_container sh -lc '
            set -eu
            LOG_DIR=/var/www/storage/logs
            chown root:www-data "$LOG_DIR"
            chmod 2770 "$LOG_DIR"
            current="$(find "$LOG_DIR" -maxdepth 1 -type f -name "security*.log" -printf "%T@ %p\n" | sort -n | tail -1 | cut -d" " -f2-)"
            test -n "$current"
            chown www-data:www-data "$current"
            chmod 0660 "$current"
            test "$(stat -c %U "$current")" = www-data
            test "$(stat -c %G "$current")" = www-data
            test "$(stat -c %a "$current")" = 660
            echo "SECURITY_LOG_OWNER_BRIDGE_OK file=$(basename "$current")"
          '

      - name: Verify web audit event survives old 0640 config
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          sudo -n bash scripts/security-audit-smoke.sh
          docker exec mercasto_backend_container sh -lc '
            current="$(find /var/www/storage/logs -maxdepth 1 -type f -name "security*.log" -printf "%T@ %p\n" | sort -n | tail -1 | cut -d" " -f2-)"
            echo "post_smoke=$(basename "$current") $(stat -c "user=%U group=%G mode=%a" "$current")"
            test "$(stat -c %U "$current")" = www-data
          '
          echo "SECURITY_LOG_OWNER_BRIDGE_VERIFIED"
