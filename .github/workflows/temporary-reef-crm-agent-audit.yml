name: Temporary Reef CRM Agent Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-reef-crm-agent-audit.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  audit:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.number == 1277 &&
        github.actor == 'johnslimg-alt'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 832 &&
        github.actor == 'johnslimg-alt' &&
        github.event.comment.body == 'RUN:reef_crm_agent_audit'
      )
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Sanitized read-only CRM AI audit
        shell: bash
        run: |
          set -euo pipefail
          echo 'CRM_AI_AUDIT_BEGIN'
          echo '== candidate containers =='
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' |
            grep -Ei 'reef|crm|whatsapp|n8n|bot|ai' || true

          mapfile -t containers < <(
            docker ps -a --format '{{.Names}}' |
              grep -Ei 'reef|crm|whatsapp|n8n|bot|ai' || true
          )

          if printf '%s\n' "${containers[@]:-}" | grep -qx 'reef-crm'; then
            ordered=(reef-crm)
            for c in "${containers[@]:-}"; do
              [ "$c" = 'reef-crm' ] || ordered+=("$c")
            done
            containers=("${ordered[@]}")
          fi

          for c in "${containers[@]:-}"; do
            [ -n "$c" ] || continue
            echo "== container:$c =="

            echo '-- selected AI env --'
            docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null |
              awk -F= '
                BEGIN { IGNORECASE=1 }
                {
                  key=$1
                  if (key ~ /(MODEL|AGENT|PROVIDER|LLM|ROUTER|DEEPSEEK|MIMO|OPENAI|GPT|CLAUDE|SONNET|HAIKU|QWEN|GLM|GEMINI|KIMI|MINIMAX|OLLAMA)/) {
                    if (key ~ /(KEY|TOKEN|SECRET|PASSWORD|PASS|AUTH|COOKIE|DSN|URL|URI|CREDENTIAL)/) {
                      print key "=<redacted>"
                    } else {
                      val=substr($0,index($0,"=")+1)
                      if (length(val)>180) val=substr(val,1,180) "..."
                      print key "=" val
                    }
                  }
                }' | sort -u || true

            echo '-- app code model identifiers --'
            docker exec "$c" sh -lc '
              roots=""
              for d in /app /usr/src/app /workspace /opt/app /srv/app; do
                [ -d "$d" ] && roots="$roots $d"
              done
              [ -n "$roots" ] || exit 0
              find $roots -type f \
                \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" -o -name "*.ts" -o -name "*.tsx" -o -name "*.jsx" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" -o -name "*.py" -o -name "*.php" \) \
                -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -path "*/.git/*" \
                -size -2M -print0 2>/dev/null |
              xargs -0 -r grep -hoEi "(deepseek[-_./:a-zA-Z0-9]*|mimo[-_./:a-zA-Z0-9]*|gpt[-_./:a-zA-Z0-9]*|openai|claude[-_./:a-zA-Z0-9]*|sonnet[-_./:a-zA-Z0-9]*|haiku[-_./:a-zA-Z0-9]*|qwen[-_./:a-zA-Z0-9]*|glm[-_./:a-zA-Z0-9]*|gemini[-_./:a-zA-Z0-9]*|kimi[-_./:a-zA-Z0-9]*|minimax[-_./:a-zA-Z0-9]*|ollama|openrouter)" |
              tr -d "\"'\''" | sort -fu | head -120
            ' 2>/dev/null || true

            echo '-- agent/config filenames --'
            docker exec "$c" sh -lc '
              for d in /app /usr/src/app /workspace /opt/app /srv/app; do
                [ -d "$d" ] || continue
                find "$d" -maxdepth 6 -type f \
                  \( -iname "*agent*" -o -iname "*model*" -o -iname "*llm*" -o -iname "*prompt*" -o -iname "*sales*" -o -iname "*seller*" \) \
                  -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -path "*/.git/*" \
                  -print 2>/dev/null
              done | sort -u | head -160
            ' 2>/dev/null || true
          done

          echo '== reef source model identifiers =='
          sudo -n sh -lc '
            if [ -d /root/reef-crm ]; then
              grep -RhoEi "(deepseek[-_./:a-zA-Z0-9]*|mimo[-_./:a-zA-Z0-9]*|gpt[-_./:a-zA-Z0-9]*|openai|claude[-_./:a-zA-Z0-9]*|sonnet[-_./:a-zA-Z0-9]*|haiku[-_./:a-zA-Z0-9]*|qwen[-_./:a-zA-Z0-9]*|glm[-_./:a-zA-Z0-9]*|gemini[-_./:a-zA-Z0-9]*|kimi[-_./:a-zA-Z0-9]*|minimax[-_./:a-zA-Z0-9]*|ollama|openrouter|groq)" /root/reef-crm \
                --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yaml" --include="*.yml" --include="*.py" --include="*.sh" \
                --exclude=".env" --exclude=".env.*" --exclude="*.log" --exclude="*.db" --exclude="*.sqlite*" \
                --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=backups --exclude-dir=logs --exclude-dir=data 2>/dev/null \
                | tr -d "\"'\''" | sort -fu | head -200
            fi
          ' || true

          echo '== reef agent-role filenames/role tokens =='
          sudo -n sh -lc '
            if [ -d /root/reef-crm ]; then
              find /root/reef-crm -maxdepth 7 -type f \
                \( -iname "*agent*" -o -iname "*council*" -o -iname "*model*" -o -iname "*llm*" -o -iname "*seller*" -o -iname "*sales*" -o -iname "*prompt*" -o -iname "*autonomous*" \) \
                -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/backups/*" -not -path "*/data/*" -print 2>/dev/null | sort -u | head -240
              echo "-- role tokens --"
              grep -RhoEi "(chairman|fact[ _-]?checker|red[ _-]?team|critic|analyst|engineer|seller|sales[ _-]?agent|salesperson|closer|qualifier|translator|vision[ _-]?agent|voice[ _-]?agent)" /root/reef-crm \
                --include="*.js" --include="*.mjs" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yaml" --include="*.yml" --include="*.py" --include="*.sh" \
                --exclude=".env" --exclude=".env.*" --exclude="*.log" --exclude="*.db" --exclude="*.sqlite*" \
                --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=backups --exclude-dir=logs --exclude-dir=data 2>/dev/null \
                | tr "[:upper:]" "[:lower:]" | sort -u | head -120
            fi
          ' || true

          echo '== relevant reef services =='
          for u in reef-org-autonomous.service reef-n8n-ai-guard.service reef-bot-cycle-guard.service reef-core-health.service reef-mcp-agent.service; do
            systemctl show "$u" --no-pager -p Id -p ActiveState -p SubState -p FragmentPath -p ExecStart 2>/dev/null || true
          done

          echo '== active n8n AI/agent nodes (sanitized) =='
          docker exec n8n sh -lc '
            set -eu
            tmp=/tmp/chatgpt-agent-audit-workflows.json
            rm -f "$tmp"
            n8n export:workflow --all --output="$tmp" >/dev/null 2>&1 || exit 0
            node - "$tmp" <<"NODE"
const fs=require("fs");
const p=process.argv[2];
let d=JSON.parse(fs.readFileSync(p,"utf8"));
if(!Array.isArray(d)) d=[d];
const re=/(agent|llm|openai|anthropic|claude|gemini|google.*chat|groq|ollama|deepseek|mimo|qwen|glm|chat.*model|language.*model|ai)/i;
const keyRe=/(model|provider|baseurl|endpoint)/i;
for (const w of d) {
  if (!w || !Array.isArray(w.nodes)) continue;
  const selected=[];
  for (const n of w.nodes) {
    const hay=(n.name||"")+" "+(n.type||"");
    if(!re.test(hay)) continue;
    const safe={name:n.name||"",type:n.type||""};
    const params=n.parameters||{};
    const picked={};
    for(const [k,v] of Object.entries(params)){
      if(!keyRe.test(k)) continue;
      if(/key|token|secret|password|credential|auth/i.test(k)) continue;
      if(typeof v==="string" && v.length<=160) picked[k]=v;
      else if(typeof v==="number" || typeof v==="boolean") picked[k]=v;
    }
    if(Object.keys(picked).length) safe.params=picked;
    selected.push(safe);
  }
  if(selected.length) {
    console.log(JSON.stringify({workflow:w.name||"",active:!!w.active,nodes:selected}));
  }
}
NODE
            rm -f "$tmp"
          ' 2>/dev/null | head -240 || true

          echo '== host unit names =='
          systemctl list-units --type=service --all --no-legend 2>/dev/null |
            awk '{print $1}' | grep -Ei 'reef|crm|whatsapp|n8n|bot|ai' | head -120 || true
          echo 'CRM_AI_AUDIT_END'

      - name: Report completion
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 832,
              body: [
                'REEF_CRM_AGENT_AUDIT_RESULT',
                `status=${status}`,
                `run_id=${context.runId}`,
                `run=${runUrl}`
              ].join('\n')
            });
