name: LM Studio Ornith 1.5 Import Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lmstudio-ornith15.yml'

permissions:
  contents: read

jobs:
  install:
    if: github.head_ref == 'ops/lmstudio-ornith15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 5 -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Finalize Ornith filename and verify LM Studio
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export HOME=/root
          export PATH="/root/.lmstudio/bin:$PATH"
          LMS=/root/.lmstudio/bin/lms
          DIR=/root/.lmstudio/models/ornith-ai/Ornith-1.5-9B-GGUF
          PART="$DIR/Ornith-1.5-9B-Q4_K_M.gguf.part"
          FINAL="$DIR/Ornith-1.5-9B-Q4_K_M.gguf"

          if [ -f "$PART" ] && [ ! -f "$FINAL" ]; then
            mv "$PART" "$FINAL"
          fi
          test -f "$FINAL"
          size=$(stat -c '%s' "$FINAL")
          echo "ornith_bytes=$size"
          test "$size" -eq 5780090816

          echo "=== LM STUDIO MODELS ==="
          "$LMS" ls --llm --detailed
          "$LMS" ls --llm --json > /tmp/lms-llm.json
          python3 - /tmp/lms-llm.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          text=json.dumps(d).lower()
          ok="ornith" in text and "1.5" in text
          print("ornith_visible=" + ("yes" if ok else "no"))
          if not ok: raise SystemExit(41)
          PY
          rm -f /tmp/lms-llm.json

          echo "=== MEMORY ESTIMATE ==="
          key=$("$LMS" ls --llm --json | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=d if isinstance(d,list) else d.get("models",d.get("data",[])); print(next((x.get("modelKey") or x.get("key") or x.get("path") for x in xs if "ornith" in str(x).lower()),""))')
          echo "ornith_model_key=$key"
          test -n "$key"
          "$LMS" load "$key" --context-length 8192 --gpu off --estimate-only || true
          echo ORNITH15_READY_OK
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
