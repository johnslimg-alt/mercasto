name: Cleanup Harness Diagnostic Logs

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-clean-diagnostic-logs.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete diagnostic logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 36056456757 36056542001 36056629780; do
            code="$(curl -sS -o /tmp/resp -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id/logs")"
            echo "run=$run_id delete_logs_http=$code"
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              cat /tmp/resp
              exit 1
            fi
          done
