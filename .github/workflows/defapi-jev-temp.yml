name: DefAPI Jev Temporary Benchmark

on:
  pull_request:
    types: [synchronize, edited]

permissions:
  contents: read

concurrency:
  group: defapi-jev-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  jev-benchmark:
    if: >-
      github.event.pull_request.number == 1279 &&
      github.actor == 'johnslimg-alt' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare or run one-time encrypted Jev benchmark
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BENCH_DIR=/root/.config/defapi-jev-pr1279

          payload="$(
            python3 - <<'PY'
          import os, re
          body = os.environ.get("PR_BODY", "")
          matches = re.findall(r"(?m)^DEFAPI_JEV_PAYLOAD:([a-f0-9]{24}):([A-Za-z0-9+/=]{100,2000})$", body)
          if matches:
              print(matches[-1][0] + "\t" + matches[-1][1])
          PY
          )"

          if [ -z "$payload" ]; then
            echo "== Prepare one-time encrypted channel =="
            sudo -n rm -rf "$BENCH_DIR"
            sudo -n install -d -m 0700 "$BENCH_DIR"
            transfer_id="$(openssl rand -hex 12)"
            printf '%s\n' "$transfer_id" | sudo -n tee "$BENCH_DIR/transfer-id" >/dev/null
            sudo -n openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072               -out "$BENCH_DIR/private.pem"
            sudo -n chmod 0600 "$BENCH_DIR/private.pem"
            sudo -n openssl pkey -in "$BENCH_DIR/private.pem" -pubout               -out "$BENCH_DIR/public.pem"
            public_b64="$(sudo -n base64 -w0 "$BENCH_DIR/public.pem")"
            echo "defapi_transfer_id=$transfer_id"
            echo "defapi_public_key_b64=$public_b64"
            echo "DEFAPI_JEV_PREPARE_OK"
            exit 0
          fi

          transfer_id="${payload%%$'\t'*}"
          ciphertext_b64="${payload#*$'\t'}"
          echo "::add-mask::$ciphertext_b64"
          stored_id="$(sudo -n cat "$BENCH_DIR/transfer-id")"
          test "$transfer_id" = "$stored_id"
          sudo -n test -s "$BENCH_DIR/private.pem"
          [[ "$transfer_id" =~ ^[a-f0-9]{24}$ ]]
          [[ "$ciphertext_b64" =~ ^[A-Za-z0-9+/=]{100,2000}$ ]]

          tmp="$(mktemp -d /tmp/defapi-jev-pr1279.XXXXXX)"
          cleanup() {
            unset DEFAPI_KEY || true
            rm -rf "$tmp" || true
            sudo -n rm -rf "$BENCH_DIR" || true
          }
          trap cleanup EXIT

          printf '%s' "$ciphertext_b64" | base64 -d >"$tmp/key.enc"
          DEFAPI_KEY="$(sudo -n openssl pkeyutl -decrypt             -inkey "$BENCH_DIR/private.pem"             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -pkeyopt rsa_mgf1_md:sha256             -in "$tmp/key.enc")"
          test -n "$DEFAPI_KEY"
          echo "::add-mask::$DEFAPI_KEY"
          case "$DEFAPI_KEY" in
            dk-*) ;;
            *) echo "Decrypted value does not look like a DefAPI key." >&2; exit 73 ;;
          esac

          sudo -n rm -rf "$BENCH_DIR"
          rm -f "$tmp/key.enc"
          export DEFAPI_KEY
          python3 scripts/defapi-jev-bench.py
          unset DEFAPI_KEY
          echo "DEFAPI_JEV_TEMP_WORKFLOW_OK"
