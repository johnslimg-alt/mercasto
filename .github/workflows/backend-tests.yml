name: Backend PHPUnit Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docs/route-inventory.md'
      - 'docs/route-inventory-generated.md'
      - 'docs/route-inventory-signatures.json'
      - 'scripts/check-route-inventory-artifact.sh'
      - 'scripts/export-route-inventory.sh'
      - 'scripts/normalize-route-inventory.sh'
      - 'scripts/normalize-route-inventory-json.py'
      - 'scripts/route-inventory-doc-gate.sh'
      - 'scripts/route-inventory-freshness-gate.sh'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docs/route-inventory.md'
      - 'docs/route-inventory-generated.md'
      - 'docs/route-inventory-signatures.json'
      - 'scripts/check-route-inventory-artifact.sh'
      - 'scripts/export-route-inventory.sh'
      - 'scripts/normalize-route-inventory.sh'
      - 'scripts/normalize-route-inventory-json.py'
      - 'scripts/route-inventory-doc-gate.sh'
      - 'scripts/route-inventory-freshness-gate.sh'
      - '.github/workflows/backend-tests.yml'
  schedule:
    - cron: '37 14 * * *'

permissions:
  contents: read

concurrency:
  group: backend-phpunit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify route inventory freshness
        working-directory: .
        run: bash scripts/route-inventory-freshness-gate.sh

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
