name: Reef media storage audit temp
on:
  push:
    paths:
      - '.github/workflows/reef-media-audit-temp.yml'
jobs:
  audit:
    if: github.repository == 'johnslimg-alt/mercasto'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect Drive sync implementation safely
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          echo '=== sync shell ==='
          sudo sed -n '1,180p' /root/automation-stack/scripts/reef_drive_sync.sh \
            | sed -E 's#(TOKEN|SECRET|PASSWORD|CLIENT_SECRET|REFRESH_TOKEN|ACCESS_KEY)[^=]*=.*#\1=REDACTED#Ig'
          echo '=== sync python ==='
          sudo sed -n '1,320p' /root/automation-stack/scripts/reef_drive_sync.py \
            | sed -E 's#(token|secret|password|client_secret|refresh_token|access_key)(["'"']?)[[:space:]]*[:=][[:space:]]*[^,} ]+#\1\2:REDACTED#Ig'
          echo '=== catalog summary ==='
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/root/automation-stack/reef_drive_cache/catalog.json')
          d=json.loads(p.read_text())
          print('catalog_bytes',p.stat().st_size)
          print('top_keys',list(d) if isinstance(d,dict) else type(d).__name__)
          def walk(x,path='root'):
              if isinstance(x,dict):
                  if isinstance(x.get('photos'),list):
                      print('PHOTOSET',path,'key=',x.get('key'),'label=',x.get('label'),'folderId=',x.get('folderId'),'photos=',len(x['photos']))
                      for ph in x['photos'][:3]:
                          if isinstance(ph,dict): print(' PHOTO', {k:ph.get(k) for k in ('id','name','mimeType','url')})
                  for k,v in x.items(): walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f'[{i}]')
          walk(d)
          PY
          echo '=== timers ==='
          systemctl is-enabled reef-drive-sync.timer || true
          systemctl list-timers reef-drive-sync.timer --no-pager || true
