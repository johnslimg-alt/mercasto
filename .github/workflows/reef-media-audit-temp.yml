name: Reef media storage audit temp
on:
  push:
    paths:
      - '.github/workflows/reef-media-audit-temp.yml'
jobs:
  migrate:
    if: github.repository == 'johnslimg-alt/mercasto'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Migrate working Reef catalog photos to local VPS storage
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          BASE=/root/automation-stack
          CACHE="$BASE/reef_drive_cache"
          CRED=/tmp/reef_drive_media_cred_$$.json
          CTMP=/tmp/reef_drive_media_cred.json
          success=0
          timer_was_enabled=$(systemctl is-enabled reef-drive-sync.timer 2>/dev/null || true)
          cleanup(){
            sudo rm -f "$CRED"
            docker exec n8n rm -f "$CTMP" >/dev/null 2>&1 || true
            if [ "$success" != 1 ] && [ "$timer_was_enabled" = enabled ]; then sudo systemctl enable --now reef-drive-sync.timer >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          sudo systemctl disable --now reef-drive-sync.timer
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          sudo cp "$CACHE/catalog.json" "$CACHE/catalog.json.pre-local-media-$stamp"
          docker exec -u node n8n n8n export:credentials --id=CZYUGdiuFIHvixxM --decrypted --output="$CTMP" >/dev/null
          docker cp n8n:"$CTMP" "$CRED" >/dev/null
          sudo chmod 600 "$CRED"
          sudo python3 - "$CRED" "$CACHE" <<'PY'
          import json, os, shutil, sys, time, urllib.parse, urllib.request
          from pathlib import Path
          import jwt
          cred_path=Path(sys.argv[1]); cache=Path(sys.argv[2]); catalog_path=cache/'catalog.json'
          exported=json.loads(cred_path.read_text()); rec=exported[0] if isinstance(exported,list) else exported
          data=rec['data']; email=data['email']; key=data['privateKey'].replace('\\n','\n')
          now=int(time.time())
          claim={'iss':email,'scope':'https://www.googleapis.com/auth/drive.readonly','aud':'https://oauth2.googleapis.com/token','iat':now,'exp':now+3600}
          assertion=jwt.encode(claim,key,algorithm='RS256')
          body=urllib.parse.urlencode({'grant_type':'urn:ietf:params:oauth:grant-type:jwt-bearer','assertion':assertion}).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body)
          access=json.load(urllib.request.urlopen(req,timeout=30))['access_token']
          catalog=json.loads(catalog_path.read_text())
          photos=[]
          def walk(x):
              if isinstance(x,dict):
                  ps=x.get('photos')
                  if isinstance(ps,list):
                      for p in ps:
                          if isinstance(p,dict) and p.get('id'): photos.append(p)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(catalog)
          unique={p['id']:p for p in photos}
          if not unique: raise RuntimeError('No catalog photos found')
          media=cache/'media'; stage=cache/f'.media-stage-{os.getpid()}'
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir(parents=True)
          extmap={'image/jpeg':'.jpg','image/png':'.png','image/webp':'.webp','image/gif':'.gif','image/avif':'.avif'}
          total=0; manifest={}
          for idx,(fid,p) in enumerate(unique.items(),1):
              mime=(p.get('mimeType') or 'image/jpeg').split(';')[0].lower()
              ext=extmap.get(mime) or Path(p.get('name','')).suffix.lower() or '.bin'
              url=f'https://www.googleapis.com/drive/v3/files/{urllib.parse.quote(fid,safe="")}?alt=media'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+access})
              with urllib.request.urlopen(req,timeout=90) as r:
                  blob=r.read(); ctype=(r.headers.get('Content-Type') or '').split(';')[0].lower()
              if not blob: raise RuntimeError(f'empty media {fid}')
              if ctype and not ctype.startswith('image/'): raise RuntimeError(f'non-image media {fid}: {ctype}')
              out=stage/(fid+ext); out.write_bytes(blob); total+=len(blob)
              manifest[fid]={'file':out.name,'bytes':len(blob),'mimeType':mime,'name':p.get('name','')}
              if idx%25==0 or idx==len(unique): print('downloaded',idx,'of',len(unique))
          if media.exists(): shutil.rmtree(media)
          stage.rename(media)
          for p in photos:
              m=manifest[p['id']]
              p['url']='http://reef-catalog-api:8081/media/'+m['file']
              p['localFile']=m['file']
          catalog['mediaStorage']='local-vps'
          catalog['googleDriveRuntimeDependency']=False
          tmp=catalog_path.with_suffix('.json.tmp')
          tmp.write_text(json.dumps(catalog,ensure_ascii=False,indent=2))
          os.replace(tmp,catalog_path); os.chmod(catalog_path,0o644)
          (cache/'media-manifest.json').write_text(json.dumps({'count':len(unique),'bytes':total,'files':manifest},ensure_ascii=False,indent=2))
          print('MIGRATION_OK photos=',len(unique),'bytes=',total)
          PY
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          cache=Path('/root/automation-stack/reef_drive_cache')
          m=json.loads((cache/'media-manifest.json').read_text())
          files=[p for p in (cache/'media').iterdir() if p.is_file()]
          assert len(files)==m['count'], (len(files),m['count'])
          assert sum(p.stat().st_size for p in files)==m['bytes']
          c=json.loads((cache/'catalog.json').read_text())
          assert c.get('mediaStorage')=='local-vps' and c.get('googleDriveRuntimeDependency') is False
          assert 'drive.google.com/uc?export=download' not in (cache/'catalog.json').read_text()
          print('LOCAL_FILES_OK',m['count'],m['bytes'])
          PY
          sample=$(sudo find "$CACHE/media" -maxdepth 1 -type f | head -1)
          sample_name=$(basename "$sample")
          docker exec n8n node -e "fetch('http://reef-catalog-api:8081/media/$sample_name').then(async r=>{if(!r.ok)throw Error('n8n media '+r.status);let b=await r.arrayBuffer();console.log('N8N_MEDIA_OK',r.status,b.byteLength)})"
          docker exec evolution-api node -e "fetch('http://reef-catalog-api:8081/media/$sample_name').then(async r=>{if(!r.ok)throw Error('evo media '+r.status);let b=await r.arrayBuffer();console.log('EVOLUTION_MEDIA_OK',r.status,b.byteLength)})"
          docker exec n8n node -e "fetch('http://reef-catalog-api:8081/catalog.json').then(r=>r.json()).then(j=>{if(j.mediaStorage!=='local-vps')throw Error('catalog not local');console.log('CATALOG_LOCAL_OK')})"
          curl -fsS http://127.0.0.1:3100/api/health
          curl -fsS http://127.0.0.1:5678/healthz
          test "$(systemctl is-enabled reef-drive-sync.timer 2>/dev/null || true)" = disabled
          success=1
          echo DRIVE_RUNTIME_DISABLED_OK
