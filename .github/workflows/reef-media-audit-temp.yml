name: Reef media storage audit temp
on:
  push:
    paths:
      - '.github/workflows/reef-media-audit-temp.yml'
jobs:
  inspect:
    if: github.repository == 'johnslimg-alt/mercasto'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect existing Drive sync parser without secrets
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          echo '=== reef_drive_sync.py ==='
          sudo sed -n '1,320p' /root/automation-stack/scripts/reef_drive_sync.py
          echo '=== credential shape only ==='
          CTMP=/tmp/reef_drive_shape.json
          CRED=/tmp/reef_drive_shape_host_$$.json
          cleanup(){ sudo rm -f "$CRED"; docker exec n8n rm -f "$CTMP" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker exec -u node n8n n8n export:credentials --id=CZYUGdiuFIHvixxM --decrypted --output="$CTMP" >/dev/null
          docker cp n8n:"$CTMP" "$CRED" >/dev/null
          sudo chmod 600 "$CRED"
          sudo python3 - "$CRED" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); r=x[0] if isinstance(x,list) else x
          print('top_keys',sorted(r.keys()))
          d=r.get('data',{}) if isinstance(r,dict) else {}
          print('data_keys',sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)
          for k,v in d.items() if isinstance(d,dict) else []:
              if isinstance(v,dict): print(k+'_keys',sorted(v.keys()))
              elif isinstance(v,str) and v.strip().startswith('{'):
                  try:
                      z=json.loads(v); print(k+'_json_keys',sorted(z.keys()) if isinstance(z,dict) else type(z).__name__)
                  except Exception: pass
          PY
