name: Apply Direct DeepSeek Flash

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-deepseek-direct-apply.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    steps:
      - name: Verify official DeepSeek API and switch Harness default
        shell: bash
        run: |
          set -euo pipefail

          CREDS=/root/.dsh/.credentials.yaml
          SETTINGS=/root/.dsh/settings.yaml

          KEY="$(sudo -n awk -F': *' '
            /^[[:space:]]+DEEPSEEK_API_KEY:[[:space:]]*/ {
              v=$0
              sub(/^[^:]+:[[:space:]]*/, "", v)
              gsub(/^["'\'' ]+|["'\'' ]+$/, "", v)
              print v
              exit
            }
          ' "$CREDS")"

          if [ -z "$KEY" ]; then
            echo "DIRECT_KEY_PRESENT=false"
            exit 2
          fi
          echo "DIRECT_KEY_PRESENT=true"

          models_code="$(curl -sS -o /tmp/deepseek-models.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" \
            -H "Accept: application/json" \
            https://api.deepseek.com/models)"
          echo "DIRECT_MODELS_HTTP=$models_code"
          if [ "$models_code" != "200" ]; then
            python3 - <<'PY'
import json
try:
    d=json.load(open('/tmp/deepseek-models.json'))
    print("DIRECT_MODELS_ERROR="+str(d.get("error",{}).get("message","unknown"))[:300])
except Exception:
    print("DIRECT_MODELS_ERROR=unparseable")
PY
            exit 3
          fi

          python3 - <<'PY'
import json
d=json.load(open('/tmp/deepseek-models.json'))
ids=[x.get('id') for x in d.get('data',[]) if isinstance(x,dict)]
print("DIRECT_MODEL_DEEPSEEK_FLASH="+str('deepseek-flash' in ids).lower())
print("DIRECT_MODELS="+",".join(x for x in ids if x))
if 'deepseek-flash' not in ids:
    raise SystemExit(4)
PY

          balance_code="$(curl -sS -o /tmp/deepseek-balance.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" \
            -H "Accept: application/json" \
            https://api.deepseek.com/user/balance)"
          echo "DIRECT_BALANCE_HTTP=$balance_code"
          if [ "$balance_code" = "200" ]; then
            python3 - <<'PY'
import json
from decimal import Decimal, InvalidOperation
d=json.load(open('/tmp/deepseek-balance.json'))
def pos(v):
    try: return Decimal(str(v)) > 0
    except (InvalidOperation, ValueError): return False
infos=d.get('balance_infos') or []
print("DIRECT_BALANCE_AVAILABLE="+str(bool(d.get('is_available'))).lower())
print("DIRECT_GRANTED_BALANCE_POSITIVE="+str(any(pos(x.get('granted_balance')) for x in infos if isinstance(x,dict))).lower())
print("DIRECT_TOPPED_UP_BALANCE_POSITIVE="+str(any(pos(x.get('topped_up_balance')) for x in infos if isinstance(x,dict))).lower())
PY
          fi

          chat_code="$(curl -sS -o /tmp/deepseek-chat.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            https://api.deepseek.com/chat/completions \
            --data-binary '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with exactly DIRECT_OK"}],"max_tokens":32,"stream":false}')"
          echo "DIRECT_CHAT_HTTP=$chat_code"
          if [ "$chat_code" != "200" ]; then
            python3 - <<'PY'
import json
try:
    d=json.load(open('/tmp/deepseek-chat.json'))
    print("DIRECT_CHAT_ERROR="+str(d.get("error",{}).get("message","unknown"))[:300])
except Exception:
    print("DIRECT_CHAT_ERROR=unparseable")
PY
            exit 5
          fi

          python3 - <<'PY'
import json
d=json.load(open('/tmp/deepseek-chat.json'))
print("DIRECT_RESPONSE_MODEL="+str(d.get("model","")))
choices=d.get("choices") or []
text=""
if choices and isinstance(choices[0],dict):
    text=((choices[0].get("message") or {}).get("content") or "").strip()
print("DIRECT_RESPONSE_NONEMPTY="+str(bool(text)).lower())
PY

          sudo -n cp "$SETTINGS" "$SETTINGS.bak-direct-deepseek-$(date -u +%Y%m%dT%H%M%SZ)"
          sudo -n python3 - <<'PY'
from pathlib import Path
p=Path('/root/.dsh/settings.yaml')
text=p.read_text()
lines=text.splitlines()
try:
    start=next(i for i,l in enumerate(lines) if l.strip()=='agent-default-model:' and not l.startswith((' ','\t')))
except StopIteration:
    lines += ['agent-default-model:','  provider: deepseek-official','  model: deepseek-flash']
else:
    end=len(lines)
    for i in range(start+1,len(lines)):
        if lines[i] and not lines[i].startswith((' ','\t','#')):
            end=i
            break
    have_provider=False
    have_model=False
    for i in range(start+1,end):
        s=lines[i].lstrip()
        indent=lines[i][:len(lines[i])-len(s)]
        if s.startswith('provider:'):
            lines[i]=indent+'provider: deepseek-official'
            have_provider=True
        elif s.startswith('model:'):
            lines[i]=indent+'model: deepseek-flash'
            have_model=True
    insert=start+1
    if not have_provider:
        lines.insert(insert,'  provider: deepseek-official'); insert+=1; end+=1
    if not have_model:
        lines.insert(insert,'  model: deepseek-flash')
p.write_text('\n'.join(lines)+'\n')
PY

          echo "=== APPLIED DEFAULT ==="
          sudo -n awk '
            /^agent-default-model:/{show=1}
            show{print}
            show && NR>1 && /^[^[:space:]].*:/ && $0 !~ /^agent-default-model:/ {exit}
          ' "$SETTINGS" | head -10

          echo "DIRECT_DEEPSEEK_APPLY=PASS"
