name: Apply Direct DeepSeek Flash

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-deepseek-direct-apply.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 20
    steps:
      - name: Switch to official DeepSeek and smoke test
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=/root/.dsh/settings.yaml
          BACKUP="/root/.dsh/settings.yaml.bak-direct-deepseek-$(date -u +%Y%m%dT%H%M%SZ)"

          sudo -n cp "$SETTINGS" "$BACKUP"

          rollback() {
            sudo -n cp "$BACKUP" "$SETTINGS"
            echo "DIRECT_DEEPSEEK_ROLLBACK=PASS"
          }

          sudo -n perl -0pi -e 's#^agent-default-model:\n(?:[ \t].*\n)*#agent-default-model:\n  provider: deepseek-official\n  model: deepseek-flash\n#m' "$SETTINGS"

          echo "=== CANDIDATE DEFAULT ==="
          sudo -n awk '/^agent-default-model:/{show=1} show{print} show && NR>1 && /^[^[:space:]].*:/ && $0 !~ /^agent-default-model:/ {exit}' "$SETTINGS" | head -10

          set +e
          sudo -n -H /usr/bin/node /opt/dsh-rc2/node_modules/@deepseek-ai/dsh/lib/bin.js --profile headless "Reply with exactly DIRECT_OK. Do not use tools." > /tmp/dsh-direct.out 2> /tmp/dsh-direct.err
          rc=$?
          set -e

          echo "DIRECT_HEADLESS_EXIT=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "=== DIRECT HEADLESS ERROR ==="
            tail -80 /tmp/dsh-direct.err | sed -E 's#sk-[A-Za-z0-9_-]+#<REDACTED>#g; s#nvapi-[A-Za-z0-9_-]+#<REDACTED>#g' || true
            rollback
            exit "$rc"
          fi

          if ! grep -q 'DIRECT_OK' /tmp/dsh-direct.out; then
            echo "DIRECT_HEADLESS_EXPECTED_MARKER=false"
            rollback
            exit 6
          fi
          echo "DIRECT_HEADLESS_EXPECTED_MARKER=true"

          sleep 1
          echo "=== FINAL DEFAULT ==="
          sudo -n awk '/^agent-default-model:/{show=1} show{print} show && NR>1 && /^[^[:space:]].*:/ && $0 !~ /^agent-default-model:/ {exit}' "$SETTINGS" | head -10

          systemctl is-active --quiet deepseek-harness.service
          web_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/)"
          echo "HARNESS_WEB_HTTP=$web_code"
          test "$web_code" = "200"

          echo "DIRECT_DEEPSEEK_APPLY=PASS"
