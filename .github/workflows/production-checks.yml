name: Production checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: production-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: Repository safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: npm run check:scripts

      - name: Check static safety contracts
        run: npm run check:static-safety

      - name: Check payment retention policy
        run: npm run check:payment-retention

      - name: Check cache and PWA policy
        run: npm run check:cache-policy

  compose-config:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --no-interpolate

      - name: Validate compose file with override
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --no-interpolate

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

  frontend-docker-build:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build frontend image with unreadable backend private storage
        shell: bash
        run: |
          set -euo pipefail
          grep -n '^backend/storage/app/private$' .dockerignore
          mkdir -p backend/storage/app/private/qa-unreadable
          chmod 000 backend/storage/app/private
          cleanup() {
            chmod 755 backend/storage/app/private 2>/dev/null || true
          }
          trap cleanup EXIT
          docker build -f Dockerfile .

  backend-docker-build:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
