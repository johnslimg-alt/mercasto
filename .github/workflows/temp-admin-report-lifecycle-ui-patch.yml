name: Temporary Admin Report Lifecycle UI Patch

on:
  push:
    branches:
      - fix/admin-report-lifecycle-ui-rebased

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-report-lifecycle-ui-rebased
      - name: Patch admin report lifecycle UI with exact guards
        run: |
          python3 <<'PY'
          from pathlib import Path

          admin = Path('src/components/screens/AdminScreen.jsx')
          source = admin.read_text()

          replacements = [
              (
                  "import AdminSeoMeasurement from '../admin/AdminSeoMeasurement';",
                  "import AdminSeoMeasurement from '../admin/AdminSeoMeasurement';\nimport AdminReportLifecycleActions from '../admin/AdminReportLifecycleActions';",
              ),
              (
                  ", handleDeleteCoupon, handleDeleteReport, handleDeleteUserReport, handleEditCategory,",
                  ", handleDeleteCoupon, handleEditCategory,",
              ),
              (
                  "<button onClick={() => setAdminReportTab('ads')} className=",
                  "<button type=\"button\" data-testid=\"admin-report-tab-ads\" onClick={() => setAdminReportTab('ads')} className=",
              ),
              (
                  "<button onClick={() => setAdminReportTab('users')} className=",
                  "<button type=\"button\" data-testid=\"admin-report-tab-users\" onClick={() => setAdminReportTab('users')} className=",
              ),
              (
                  "<button onClick={() => handleDeleteReport(r.id, adminCopy)} className=\"p-2 text-slate-400 hover:text-red-500 transition-colors\" title={adminCopy.admin_discard_report}><Trash2 size={16}/></button>",
                  "<AdminReportLifecycleActions kind=\"listing\" report={r} token={token} lang={lang} reload={loadAdminReports} />",
              ),
              (
                  "<button onClick={() => handleDeleteUserReport(r.id, adminCopy)} className=\"p-2 text-slate-400 hover:text-red-500 transition-colors\" title={adminCopy.admin_discard_report}><Trash2 size={16}/></button>",
                  "<AdminReportLifecycleActions kind=\"user\" report={r} token={token} lang={lang} reload={loadAdminReports} />",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'AdminScreen exact guard failed: {old[:80]!r} count={count}')
              source = source.replace(old, new, 1)
          admin.write_text(source)

          shard = Path('scripts/frontend-quality-shard.sh')
          shard_source = shard.read_text()
          old = "tests/e2e/onboarding-first-publication.spec.js tests/e2e/admin-operational-localization.spec.js \\\n"
          new = "tests/e2e/onboarding-first-publication.spec.js tests/e2e/admin-operational-localization.spec.js \\\n      tests/e2e/admin-report-lifecycle.spec.js \\\n"
          count = shard_source.count(old)
          if count != 1:
              raise SystemExit(f'frontend shard guard failed: count={count}')
          shard.write_text(shard_source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit lifecycle UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/screens/AdminScreen.jsx scripts/frontend-quality-shard.sh
          git diff --cached --check
          git commit -m 'fix: use non-destructive report lifecycle in admin UI'
          git push origin HEAD:fix/admin-report-lifecycle-ui-rebased
