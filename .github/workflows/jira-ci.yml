name: Jira CI

on:
  workflow_run:
    workflows:
      - Frontend build
      - Frontend Quality Gate
      - Production checks
      - Deploy Mercasto
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: jira-ci-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    name: Report the result to Jira Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Update the Jira issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          CI_NAME: ${{ github.event.workflow_run.name }}
          CI_STATUS: ${{ github.event.workflow_run.conclusion }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
        run: python3 scripts/jira_cloud.py ci
