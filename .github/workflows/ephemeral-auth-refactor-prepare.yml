name: Ephemeral Auth Refactor Prepare

on:
  push:
    branches:
      - ops/probe-vps-capacity-rdc

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Rebase, gate and push auth state refactor
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash -lc '
            set -euo pipefail
            repo=/var/www/mercasto
            wt=/tmp/mercasto-auth-ready
            cd "$repo"
            git fetch origin main --prune
            git worktree prune
            rm -rf "$wt"
            git worktree add "$wt" refactor/app-auth-state
            cd "$wt"
            git rebase origin/main
            ln -s "$repo/node_modules" node_modules
            node --test tests/*.test.mjs
            npm run check:static-safety
            npm run check:recovery
            bash scripts/public-ui-visual-evidence-gate.sh
            npm run build
            npx eslint src/App.jsx src/app/useAuthSessionState.js tests/app-auth-session-state-extraction.test.mjs
            rm node_modules
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BASE=$(git merge-base HEAD origin/main)"
            git status --short
            git push -u origin refactor/app-auth-state
          '
