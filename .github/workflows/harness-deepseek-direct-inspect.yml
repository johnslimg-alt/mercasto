name: Harness DeepSeek Direct Inspect

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-deepseek-direct-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 5
    steps:
      - name: Inspect NVIDIA provider catalog structure
        shell: bash
        run: |
          set -euo pipefail
          sudo -n awk '
            /^    nvidia:$/ {inside=1}
            inside {print}
            inside && /^    kimi-direct:$/ {exit}
          ' /root/.dsh/settings.yaml           | sed -E 's#(^[[:space:]]*(apiKey|token|secret|password)[A-Za-z0-9_-]*:[[:space:]]*).*#\1<REDACTED>#Ig'           | head -120
