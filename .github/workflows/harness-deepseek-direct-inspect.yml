name: Harness DeepSeek Direct Inspect

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-deepseek-direct-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    steps:
      - name: Inspect DeepSeek account route safely
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DSH VERSION ==="
          sudo -n -H node -p "require('/opt/dsh-rc2/node_modules/@deepseek-ai/dsh/package.json').version" 2>/dev/null || true

          echo "=== ACCOUNT PACKAGES ==="
          for p in             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-deepseek-account-platform             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-deepseek-account             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-llm-deepseek-account; do
            if [ -d "$p" ]; then
              echo "PRESENT $(basename "$p")"
            else
              echo "MISSING $(basename "$p")"
            fi
          done

          echo "=== ACCOUNT ROUTE REFERENCES ==="
          grep -RIl --exclude='*.map' -E 'deepseek-account|deepseekAccount'             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-base             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-llm-deepseek*             /opt/dsh-rc2/node_modules/@deepseek-ai/dsh-deepseek-account*             2>/dev/null | head -80 || true

          echo "=== USER STATE FILENAMES ONLY ==="
          sudo -n find /root/.dsh -maxdepth 4 -type f -printf '%p\n' 2>/dev/null             | grep -Ei 'account|auth|grant|credential|deepseek'             | sed 's#^/root/.dsh/#~/.dsh/#'             | head -80 || true

          echo "=== SETTINGS ROUTE NAMES ONLY ==="
          sudo -n grep -E '^[[:space:]]*(provider:|[A-Za-z0-9_-]+:)$' /root/.dsh/settings.yaml 2>/dev/null             | grep -Ei 'deepseek|provider'             | head -120 || true
