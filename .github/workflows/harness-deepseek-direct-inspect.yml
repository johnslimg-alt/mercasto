name: Harness DeepSeek Direct Inspect

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-deepseek-direct-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    steps:
      - name: Verify direct DeepSeek readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "=== VERSION ==="
          node -p "require('/opt/dsh-rc2/node_modules/@deepseek-ai/dsh/package.json').version" || true

          echo "=== DIRECT CONFIG ==="
          sudo -n awk '
            BEGIN{show=0}
            /^llm-deepseek:/{show=1}
            show{print}
            show && /^[^[:space:]].*:/ && $0 !~ /^llm-deepseek:/ {exit}
          ' /root/.dsh/settings.yaml 2>/dev/null | head -120 || true

          echo "=== DEFAULT MODEL ==="
          sudo -n awk '
            BEGIN{show=0}
            /^agent-default-model:/{show=1}
            show{print}
            show && NR>1 && /^[^[:space:]].*:/ && $0 !~ /^agent-default-model:/ {exit}
          ' /root/.dsh/settings.yaml 2>/dev/null | head -20 || true

          echo "=== DEEPSEEK CREDENTIAL REFS (SECRET REDACTED) ==="
          sudo -n grep -n -C 4 'DEEPSEEK_API_KEY' /root/.dsh/.credentials.yaml 2>/dev/null \
            | sed -E 's#(^[[:space:]-]*value:[[:space:]]*).*#\1<REDACTED>#; s#(^[[:space:]-]*(secret|token|key):[[:space:]]*).*#\1<REDACTED>#I' \
            || true

          echo "=== LISTEN SOCKETS ==="
          pid="$(pgrep -f '/opt/dsh-rc2/node_modules/@deepseek-ai/dsh/lib/bin.js web' | head -1 || true)"
          if [ -n "$pid" ]; then
            sudo -n ss -ltnp 2>/dev/null | grep "pid=$pid," || true
          fi

          echo "=== CLI HELP ==="
          node /opt/dsh-rc2/node_modules/@deepseek-ai/dsh/lib/bin.js --help 2>&1 | head -100 || true
