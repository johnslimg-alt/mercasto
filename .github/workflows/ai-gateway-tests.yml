name: AI Gateway Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/ai-gateway-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/ai-gateway-tests.yml'

permissions:
  contents: read

concurrency:
  group: ai-gateway-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test private AI gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai-gateway/pyproject.toml
      - name: Install gateway and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Lint gateway
        run: ruff check mercasto_ai tests
      - name: Run gateway tests
        run: pytest -q
