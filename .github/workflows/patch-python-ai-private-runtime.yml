name: Patch Python AI private runtime

on:
  push:
    branches:
      - feat/python-ai-private-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add private Python AI service and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docker-compose.yml')
          text = path.read_text()
          marker = '  ollama:\n'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one ollama service marker')

          service = '''  mercasto-ai-gateway:\n    build:\n      context: ./services/ai-gateway\n      dockerfile: Dockerfile\n    container_name: mercasto_ai_gateway\n    expose:\n      - "8080"\n    environment:\n      - "OLLAMA_BASE_URL=http://ollama:11434"\n      - "OLLAMA_VISION_MODEL=${OLLAMA_CHAT_MODEL:-qwen3-vl:4b-instruct}"\n      - "OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT:-90}"\n      - "MERCASTO_AI_INTERNAL_TOKEN=${MERCASTO_AI_INTERNAL_TOKEN:-}"\n    depends_on:\n      ollama:\n        condition: service_healthy\n    restart: unless-stopped\n    deploy:\n      resources:\n        limits:\n          cpus: '0.50'\n          memory: 256M\n    logging:\n      driver: "json-file"\n      options:\n        max-size: "10m"\n        max-file: "3"\n    labels:\n      - autoheal=true\n\n'''
          path.write_text(text.replace(marker, service + marker, 1))
          Path('.github/workflows/patch-python-ai-private-runtime.yml').unlink()
          PY
      - name: Commit private runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docker-compose.yml .github/workflows/patch-python-ai-private-runtime.yml
          git commit -m "feat: run Python AI gateway on private Docker network"
          git push origin HEAD:feat/python-ai-private-runtime
