name: Dependabot Automerge Candidates

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: dependabot-automerge-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify-safe-dependabot-update:
    name: Classify safe Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide automerge eligibility
        id: decision
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          set -euo pipefail

          eligible=false
          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              case "${PACKAGE_ECOSYSTEM}" in
                npm|npm_and_yarn|github-actions|docker)
                  eligible=true
                  ;;
              esac
              ;;
          esac

          echo "update_type=${UPDATE_TYPE}"
          echo "package_ecosystem=${PACKAGE_ECOSYSTEM}"
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

      - name: Write trusted classification artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ELIGIBLE: ${{ steps.decision.outputs.eligible }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg eligible "$ELIGIBLE" \
            --arg update_type "$UPDATE_TYPE" \
            --arg package_ecosystem "$PACKAGE_ECOSYSTEM" \
            '{pr:$pr,head:$head,eligible:($eligible == "true"),update_type:$update_type,package_ecosystem:$package_ecosystem}' \
            > candidate/classification.json

      - name: Upload trusted classification artifact
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-candidate
          path: candidate/classification.json
          if-no-files-found: error
          retention-days: 1
