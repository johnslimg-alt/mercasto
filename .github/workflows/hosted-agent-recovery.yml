name: Hosted Server Agent Recovery

# Out-of-band recovery only: fixed service names, no arbitrary command input.
on:
  workflow_dispatch:
  push:
    branches:
      - ops/hermes-publish-ssh
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-server-agent-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover VPS control agents out of band
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 832 &&
       github.actor == 'johnslimg-alt' &&
       github.event.comment.body == 'RUN:hosted_agent_recovery:MERCASTO')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate recovery secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/mercasto_recovery_key
          chmod 600 ~/.ssh/mercasto_recovery_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Restart self-hosted runners
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mercasto_recovery_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          units=(
            actions.runner.johnslimg-alt-mercasto.srv1526037.service
            actions.runner.johnslimg-alt-mercasto-mobile.srv1526037-mobile.service
          )
          for unit in "${units[@]}"; do
            if systemctl list-unit-files --type=service --no-legend "$unit" 2>/dev/null | grep -q .; then
              systemctl restart "$unit"
            fi
          done
          REMOTE

      - name: Repair Remote Desktop Commander
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mercasto_recovery_key "root@$SERVER_HOST" 'bash -s' < scripts/repair-rdc-agent.sh

      - name: Verify recovered services
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mercasto_recovery_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet remote-desktop-commander.service
          for unit in \
            actions.runner.johnslimg-alt-mercasto.srv1526037.service \
            actions.runner.johnslimg-alt-mercasto-mobile.srv1526037-mobile.service; do
            if systemctl list-unit-files --type=service --no-legend "$unit" 2>/dev/null | grep -q .; then
              systemctl is-active --quiet "$unit"
            fi
          done
          systemctl show remote-desktop-commander.service --no-pager \
            -p ActiveState -p SubState -p MainPID -p NRestarts
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/mercasto_recovery_key

      - name: Report recovery result
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(printf 'HOSTED_AGENT_RECOVERY_RESULT\nstatus=%s\nrun_id=%s\nrun=%s' \
            "$JOB_STATUS" "$GITHUB_RUN_ID" "$RUN_URL")"
          gh api "repos/$REPO/issues/832/comments" -f body="$body"

  hermes_publish:
    name: Publish Hermes out of band
    if: >-
      (github.event_name == 'push' && github.ref_name == 'ops/hermes-publish-ssh') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 832 &&
       github.actor == 'johnslimg-alt' &&
       github.event.comment.body == 'RUN:hermes_publish_ssh:MERCASTO')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate SSH secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/hermes_publish_key
          chmod 600 ~/.ssh/hermes_publish_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Execute guarded Hermes publish
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hermes_publish_key "root@$SERVER_HOST" \
            'cd /var/www/mercasto && OPERATION=hermes_publish CONFIRM=MERCASTO TAIL_LINES=220 bash scripts/server-operator.sh hermes_publish MERCASTO'

      - name: Diagnose Hermes publish failure
        if: failure()
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hermes_publish_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for file in /tmp/hermes-glm-smoke /tmp/hermes-deepseek-smoke /tmp/hermes-web-sync.log; do
            if [ -s "$file" ]; then
              echo "=== $(basename "$file") ==="
              tail -120 "$file" \
                | sed -E 's/(api[_-]?key|authorization|bearer|token|secret|password)([=: ]+)[^ ]+/\1\2***REDACTED***/Ig' \
                | sed -E 's/sk-[A-Za-z0-9_-]{16,}/***REDACTED***/g'
            fi
          done
          echo "=== hermes-dashboard active ==="
          systemctl is-active hermes-dashboard.service 2>/dev/null || true
          echo "=== hermes-dashboard status ==="
          systemctl status hermes-dashboard.service --no-pager -l 2>&1 \
            | sed -E 's/(api[_-]?key|authorization|bearer|token|secret|password)([=: ]+)[^ ]+/\1\2***REDACTED***/Ig' \
            | tail -80 || true
          echo "=== hermes-dashboard journal ==="
          journalctl -u hermes-dashboard.service -n 120 --no-pager 2>&1 \
            | sed -E 's/(api[_-]?key|authorization|bearer|token|secret|password)([=: ]+)[^ ]+/\1\2***REDACTED***/Ig' \
            | tail -120 || true
          echo "=== hermes dashboard --status ==="
          HOME=/root /usr/local/bin/hermes dashboard --status 2>&1 | tail -80 || true
          echo "=== listener 9119 ==="
          ss -ltnp 2>/dev/null | grep ':9119' || true
          echo "=== harness edge config ==="
          if [ -s /etc/mercasto-edge/harness.conf ]; then
            sed -E 's/(auth_basic_user_file[[:space:]]+)[^;]+;/\1<AUTH_FILE_REDACTED>;/g' /etc/mercasto-edge/harness.conf | tail -160
          else
            echo "missing:/etc/mercasto-edge/harness.conf"
          fi
          echo "=== reef edge auth directives ==="
          if [ -s /etc/mercasto-edge/reef-crm.conf ]; then
            grep -E '^[[:space:]]*auth_basic(_user_file)?[[:space:]]' /etc/mercasto-edge/reef-crm.conf | tail -20 || true
          else
            echo "missing:/etc/mercasto-edge/reef-crm.conf"
          fi
          echo "=== DNS authority ==="
          (command -v dig >/dev/null 2>&1 && dig +short NS flyaicrm.com) || true
          echo "=== harness A ==="
          (command -v dig >/dev/null 2>&1 && dig +short A harness.flyaicrm.com) || getent ahostsv4 harness.flyaicrm.com | awk '{print $1}' | sort -u || true
          echo "=== hermes A ==="
          (command -v dig >/dev/null 2>&1 && dig +short A hermes.flyaicrm.com) || getent ahostsv4 hermes.flyaicrm.com | awk '{print $1}' | sort -u || true
          echo "=== DNS credential refs ==="
          python3 - <<'PY'
from pathlib import Path
import yaml
p=Path('/root/.dsh/.credentials.yaml')
if p.exists():
    data=yaml.safe_load(p.read_text()) or {}
    refs=data.get('refs') or {}
    for k in sorted(refs):
        ku=str(k).upper()
        if any(s in ku for s in ('HOSTINGER','CLOUDFLARE','CF_','DNS','HAPI')):
            print(k)
PY
          echo "=== likely DNS config files ==="
          find /root /etc -maxdepth 3 -type f \
            \( -iname '*hostinger*' -o -iname '*cloudflare*' -o -iname '*dns*' \) \
            -printf '%p\n' 2>/dev/null | head -80 || true
          echo "=== edge mounts ==="
          docker inspect mercasto_frontend_container --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' 2>/dev/null \
            | grep -E 'mercasto-edge|letsencrypt|nginx|cert' \
            | tail -120 || true
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hermes_publish_key

      - name: Report Hermes publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(printf 'HERMES_PUBLISH_SSH_RESULT\nstatus=%s\nrun_id=%s\nrun=%s' \
            "$JOB_STATUS" "$GITHUB_RUN_ID" "$RUN_URL")"
          gh api "repos/$REPO/issues/832/comments" -f body="$body"

