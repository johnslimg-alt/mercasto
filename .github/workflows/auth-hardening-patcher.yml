name: Auth hardening one-shot patcher

on:
  push:
    branches:
      - security/auth-rbac-otp-hardening
    paths:
      - .github/workflows/auth-hardening-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'johnslimg-alt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/auth-rbac-otp-hardening
      - name: Apply exact AuthController OTP patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "security/auth-rbac-otp-hardening"
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/Http/Controllers/Api/AuthController.php')
          text = path.read_text()
          marker = "use App\\Support\\PrivacyFingerprint;\n"
          if text.count(marker) != 1:
              raise SystemExit('unexpected PrivacyFingerprint import count')
          text = text.replace(marker, marker + "use App\\Support\\SecureOneTimeCode;\n", 1)

          request_method = r'''    public function requestPhoneCode\(Request \$request\)\n    \{.*?\n    \}\n\n    /\*\*\n     \* Вход или регистрация по SMS коду \(Phone Auth\)\n     \*/'''
          request_replacement = '''    public function requestPhoneCode(Request $request)\n    {\n        $request->validate(['phone_number' => 'required|string|min:10|max:20']);\n\n        $phoneNumber = preg_replace('/[^0-9+]/', '', $request->phone_number);\n        $code = (string) random_int(100000, 999999);\n\n        $twilioSid = config('services.twilio.sid');\n        $twilioToken = config('services.twilio.token');\n        $twilioFrom = config('services.twilio.from');\n\n        if (! $twilioSid || ! $twilioToken || ! $twilioFrom) {\n            Log::warning('Phone auth SMS provider is not configured', [\n                'phone_hash' => hash('sha256', $phoneNumber),\n            ]);\n\n            return response()->json(['message' => 'La autenticación por SMS no está disponible en este momento.'], 503);\n        }\n\n        try {\n            $client = new \\Twilio\\Rest\\Client($twilioSid, $twilioToken);\n            $client->messages->create($phoneNumber, [\n                'from' => $twilioFrom,\n                'body' => "Tu código de acceso de Mercasto es: {$code}. Válido por 10 minutos.",\n            ]);\n        } catch (\\Throwable $e) {\n            Log::error('Phone auth SMS delivery failed', [\n                'phone_hash' => hash('sha256', $phoneNumber),\n                'error' => $e->getMessage(),\n            ]);\n\n            return response()->json(['message' => 'No pudimos enviar el SMS. Intenta de nuevo más tarde.'], 503);\n        }\n\n        $cacheKey = SecureOneTimeCode::cacheKey('phone-auth', $phoneNumber);\n        Cache::put(\n            $cacheKey,\n            SecureOneTimeCode::hash($code, 'phone-auth'),\n            now()->addMinutes(10),\n        );\n\n        return response()->json(['message' => 'Código SMS enviado.']);\n    }\n\n    /**\n     * Вход или регистрация по SMS коду (Phone Auth)\n     */'''
          text, count = re.subn(request_method, lambda _: request_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'unexpected requestPhoneCode replacement count: {count}')

          verify_method = r'''    public function verifyPhoneCode\(Request \$request\)\n    \{.*?\n    \}\n\n    /\*\*\n     \* Отправка ссылки для восстановления пароля\n     \*/'''
          verify_replacement = '''    public function verifyPhoneCode(Request $request)\n    {\n        $request->validate(['phone_number' => 'required|string|min:10|max:20', 'code' => 'required|string|size:6']);\n\n        $phoneNumber = preg_replace('/[^0-9+]/', '', $request->phone_number);\n        $cacheKey = SecureOneTimeCode::cacheKey('phone-auth', $phoneNumber);\n        $cachedHash = Cache::get($cacheKey);\n\n        if (! SecureOneTimeCode::verify((string) $request->code, $cachedHash, 'phone-auth')) {\n            throw ValidationException::withMessages(['code' => ['Código SMS inválido o expirado.']]);\n        }\n\n        $user = User::where('phone_number', $phoneNumber)->first();\n        $isNewUser = $user === null;\n        if (! $user) {\n            $registrationConsent = $this->validateRegistrationConsent($request);\n            $user = DB::transaction(function () use ($phoneNumber, $request, $registrationConsent) {\n                $user = new User();\n                $user->phone_number = $phoneNumber;\n                $user->name = 'Usuario '.substr($phoneNumber, -4);\n                $user->email = $phoneNumber.'@mercasto.local';\n                $user->password = Hash::make(Str::random(16));\n                $user->role = 'individual';\n                $user->ip_address = PrivacyFingerprint::ip($request->ip(), 'registration-account', 45);\n                $user->save();\n                $this->recordRegistrationConsents($user, $request, $registrationConsent);\n\n                return $user;\n            });\n        }\n\n        Cache::forget($cacheKey);\n\n        return response()->json([\n            'message' => 'Inicio de sesión exitoso',\n            'access_token' => $user->createToken('auth_token')->plainTextToken,\n            'token_type' => 'Bearer',\n            'user' => $user->makeHidden(['two_factor_secret', 'two_factor_recovery_codes', 'email_verification_token', 'password']),\n            'is_new_user' => $isNewUser,\n            'registration_event_id' => $isNewUser ? $request->input('meta_event_id') : null,\n            'registration_method' => $isNewUser ? 'phone' : null,\n        ]);\n    }\n\n    /**\n     * Отправка ссылки для восстановления пароля\n     */'''
          text, count = re.subn(verify_method, lambda _: verify_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'unexpected verifyPhoneCode replacement count: {count}')

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/auth-hardening-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/Http/Controllers/Api/AuthController.php .github/workflows/auth-hardening-patcher.yml
          git diff --cached --check
          git commit -m "security: hash phone-auth OTP cache values"
          git push origin HEAD:security/auth-rbac-otp-hardening
