name: ChatGPT Server Operator

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  operate:
    name: Run allowlisted server operation
    if: >-
      github.event.issue.number == 832 &&
      github.actor == 'johnslimg-alt' &&
      (
        github.event.comment.body == 'RUN:status' ||
        github.event.comment.body == 'RUN:mcp_status' ||
        github.event.comment.body == 'RUN:harness_proxy_status' ||
        github.event.comment.body == 'RUN:ghost_access_probe' ||
        github.event.comment.body == 'RUN:harness_upload_fix:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_bootstrap:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_tls_issue:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_publish:MERCASTO' ||
        github.event.comment.body == 'RUN:verify_quick' ||
        github.event.comment.body == 'RUN:security_smoke' ||
        github.event.comment.body == 'RUN:seo_aeo_smoke' ||
        github.event.comment.body == 'RUN:content_quality_audit' ||
        github.event.comment.body == 'RUN:runner_health' ||
        github.event.comment.body == 'RUN:logs_frontend' ||
        github.event.comment.body == 'RUN:logs_backend' ||
        github.event.comment.body == 'RUN:deploy_main:MERCASTO' ||
        github.event.comment.body == 'RUN:restart_frontend:MERCASTO' ||
        github.event.comment.body == 'RUN:restart_stack:MERCASTO' ||
        github.event.comment.body == 'RUN:align_media_caps:MERCASTO' ||
        github.event.comment.body == 'RUN:hermes_install:MERCASTO' ||
        github.event.comment.body == 'RUN:hermes_publish:MERCASTO' ||
        github.event.comment.body == 'RUN:cleanup_build_cache:MERCASTO' ||
        github.event.comment.body == 'RUN:cleanup_docker:MERCASTO' ||
        github.event.comment.body == 'RUN:maintenance_reboot:MERCASTO'
      )
    runs-on: [self-hosted]
    timeout-minutes: 60
    concurrency:
      group: chatgpt-server-operator
      cancel-in-progress: false
    steps:
      - name: Validate exact command
        id: request
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const commands = {
              'RUN:status': ['status', '', '160'],
              'RUN:mcp_status': ['mcp_status', '', '220'],
              'RUN:harness_proxy_status': ['harness_proxy_status', '', '220'],
              'RUN:ghost_access_probe': ['ghost_access_probe', '', '260'],
              'RUN:harness_upload_fix:MERCASTO': ['harness_upload_fix', 'MERCASTO', '260'],
              'RUN:mcp_plugin_bootstrap:MERCASTO': ['mcp_plugin_bootstrap', 'MERCASTO', '220'],
              'RUN:mcp_plugin_tls_issue:MERCASTO': ['mcp_plugin_tls_issue', 'MERCASTO', '220'],
              'RUN:mcp_plugin_publish:MERCASTO': ['mcp_plugin_publish', 'MERCASTO', '260'],
              'RUN:verify_quick': ['verify_quick', '', '160'],
              'RUN:security_smoke': ['security_smoke', '', '160'],
              'RUN:seo_aeo_smoke': ['seo_aeo_smoke', '', '160'],
              'RUN:content_quality_audit': ['content_quality_audit', '', '160'],
              'RUN:runner_health': ['runner_health', '', '160'],
              'RUN:logs_frontend': ['logs_frontend', '', '200'],
              'RUN:logs_backend': ['logs_backend', '', '200'],
              'RUN:deploy_main:MERCASTO': ['deploy_main', 'MERCASTO', '160'],
              'RUN:restart_frontend:MERCASTO': ['restart_frontend', 'MERCASTO', '160'],
              'RUN:restart_stack:MERCASTO': ['restart_stack', 'MERCASTO', '160'],
              'RUN:align_media_caps:MERCASTO': ['align_media_caps', 'MERCASTO', '160'],
              'RUN:hermes_install:MERCASTO': ['hermes_install', 'MERCASTO', '220'],
              'RUN:hermes_publish:MERCASTO': ['hermes_publish', 'MERCASTO', '220'],
              'RUN:cleanup_build_cache:MERCASTO': ['cleanup_build_cache', 'MERCASTO', '160'],
              'RUN:cleanup_docker:MERCASTO': ['cleanup_docker', 'MERCASTO', '160'],
              'RUN:maintenance_reboot:MERCASTO': ['maintenance_reboot', 'MERCASTO', '220'],
            };
            const selected = commands[body];
            if (!selected) {
              core.setFailed(`Unsupported operator command: ${body}`);
              return;
            }
            core.setOutput('operation', selected[0]);
            core.setOutput('confirm', selected[1]);
            core.setOutput('tail_lines', selected[2]);
            core.info(`Validated allowlisted operation: ${selected[0]}`);

      - name: Verify production operator boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d /var/www/mercasto/.git
          test -f /var/www/mercasto/scripts/server-operator.sh
          test -f /var/www/mercasto/scripts/server-status-safe.sh
          bash -n /var/www/mercasto/scripts/server-operator.sh
          bash -n /var/www/mercasto/scripts/server-status-safe.sh

      - name: Execute allowlisted production operation
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          CONFIRM: ${{ steps.request.outputs.confirm }}
          TAIL_LINES: ${{ steps.request.outputs.tail_lines }}
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          if [ "$OPERATION" = "status" ]; then
            bash scripts/server-status-safe.sh
          elif [ "$OPERATION" = "mcp_status" ]; then
            echo "== MCP systemd =="
            for unit in mercasto-ssh-mcp.service mercasto-ssh-mcp-stdio.service desktop-commander.service remote-desktop-commander.service; do
              echo "-- $unit"
              printf 'enabled='; systemctl is-enabled "$unit" 2>/dev/null || true
              printf 'active='; systemctl is-active "$unit" 2>/dev/null || true
              systemctl show "$unit" --no-pager -p FragmentPath -p ActiveState -p SubState -p MainPID -p User 2>/dev/null || true
            done
            echo
            echo "== MCP local listeners =="
            ss -lntpH 2>/dev/null | grep -E '127\.0\.0\.1|\[::1\]' | grep -Ei 'mcp|ssh|node|:8001|:8765|:300[0-9]|:30[0-9]{2}' || true
          elif [ "$OPERATION" = "ghost_access_probe" ]; then
            echo "== Ghost deleted-branch GitHub events =="
            curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/MShneur/ghost-in-the-loop/events?per_page=100' \
              > /tmp/ghost-events.json
            python3 - /tmp/ghost-events.json <<'PY'
          import json, sys
          events = json.load(open(sys.argv[1]))
          target = "tooling/chatgpt-nonstop-loop"
          matches = []
          for e in events:
              p = e.get("payload") or {}
              ref = p.get("ref")
              if ref in (target, "refs/heads/" + target):
                  matches.append({
                      "type": e.get("type"),
                      "created_at": e.get("created_at"),
                      "ref": ref,
                      "before": p.get("before"),
                      "head": p.get("head"),
                      "ref_type": p.get("ref_type"),
                      "size": p.get("size"),
                      "distinct_size": p.get("distinct_size"),
                      "commits": p.get("commits"),
                  })
          print("matching_events=" + str(len(matches)))
          for m in matches:
              print(json.dumps(m, sort_keys=True))
          PY
            rm -f /tmp/ghost-events.json
            echo
            echo "== Remote nonstop branch now =="
            git ls-remote https://github.com/MShneur/ghost-in-the-loop.git \
              'refs/heads/tooling/chatgpt-nonstop-loop' 2>/dev/null || true
            echo
            echo "== Server GitHub permission =="
            if command -v gh >/dev/null 2>&1; then
              gh auth status 2>&1 | sed -E 's/(Token:).*/\1 ***REDACTED***/' || true
              gh api repos/MShneur/ghost-in-the-loop --jq '.permissions // {}' 2>/dev/null || true
            else
              echo "gh_not_installed=true"
            fi
          else
            OPERATION="$OPERATION" CONFIRM="$CONFIRM" TAIL_LINES="$TAIL_LINES" \
              bash scripts/server-operator.sh "$OPERATION" "$CONFIRM"
          fi

      - name: Report result
        if: always()
        uses: actions/github-script@v9
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const operation = process.env.OPERATION || 'validation-failed';
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'CHATGPT_SERVER_OPERATOR_RESULT',
              `operation=${operation}`,
              `status=${status}`,
              `run_id=${context.runId}`,
              `run=${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 832,
              body
            });
