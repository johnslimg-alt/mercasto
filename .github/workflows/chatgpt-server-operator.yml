name: ChatGPT Server Operator

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  operate:
    name: Run allowlisted server operation
    if: >-
      github.event.issue.number == 832 &&
      github.actor == 'johnslimg-alt' &&
      (
        github.event.comment.body == 'RUN:status' ||
        github.event.comment.body == 'RUN:mcp_status' ||
        github.event.comment.body == 'RUN:harness_proxy_status' ||
        github.event.comment.body == 'RUN:harness_upload_diag' ||
        github.event.comment.body == 'RUN:harness_workspace_audit' ||
        github.event.comment.body == 'RUN:ghost_access_probe' ||
        github.event.comment.body == 'RUN:harness_upload_fix:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_bootstrap:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_tls_issue:MERCASTO' ||
        github.event.comment.body == 'RUN:mcp_plugin_publish:MERCASTO' ||
        github.event.comment.body == 'RUN:verify_quick' ||
        github.event.comment.body == 'RUN:security_smoke' ||
        github.event.comment.body == 'RUN:seo_aeo_smoke' ||
        github.event.comment.body == 'RUN:content_quality_audit' ||
        github.event.comment.body == 'RUN:runner_health' ||
        github.event.comment.body == 'RUN:defapi_jev_prepare:MERCASTO' ||
        github.event.comment.body == 'RUN:defapi_jev_bench:MERCASTO' ||
        github.event.comment.body == 'RUN:logs_frontend' ||
        github.event.comment.body == 'RUN:logs_backend' ||
        github.event.comment.body == 'RUN:deploy_main:MERCASTO' ||
        github.event.comment.body == 'RUN:restart_frontend:MERCASTO' ||
        github.event.comment.body == 'RUN:restart_stack:MERCASTO' ||
        github.event.comment.body == 'RUN:align_media_caps:MERCASTO' ||
        github.event.comment.body == 'RUN:hermes_install:MERCASTO' ||
        github.event.comment.body == 'RUN:hermes_publish:MERCASTO' ||
        github.event.comment.body == 'RUN:cleanup_build_cache:MERCASTO' ||
        github.event.comment.body == 'RUN:cleanup_docker:MERCASTO' ||
        github.event.comment.body == 'RUN:maintenance_reboot:MERCASTO'
      )
    runs-on: [self-hosted]
    timeout-minutes: 60
    concurrency:
      group: chatgpt-server-operator
      cancel-in-progress: false
    steps:
      - name: Validate exact command
        id: request
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const commands = {
              'RUN:status': ['status', '', '160'],
              'RUN:mcp_status': ['mcp_status', '', '220'],
              'RUN:harness_proxy_status': ['harness_proxy_status', '', '220'],
              'RUN:harness_upload_diag': ['harness_upload_diag', '', '360'],
              'RUN:harness_workspace_audit': ['harness_workspace_audit', '', '400'],
              'RUN:ghost_access_probe': ['ghost_access_probe', '', '260'],
              'RUN:harness_upload_fix:MERCASTO': ['harness_upload_fix', 'MERCASTO', '260'],
              'RUN:mcp_plugin_bootstrap:MERCASTO': ['mcp_plugin_bootstrap', 'MERCASTO', '220'],
              'RUN:mcp_plugin_tls_issue:MERCASTO': ['mcp_plugin_tls_issue', 'MERCASTO', '220'],
              'RUN:mcp_plugin_publish:MERCASTO': ['mcp_plugin_publish', 'MERCASTO', '260'],
              'RUN:verify_quick': ['verify_quick', '', '160'],
              'RUN:security_smoke': ['security_smoke', '', '160'],
              'RUN:seo_aeo_smoke': ['seo_aeo_smoke', '', '160'],
              'RUN:content_quality_audit': ['content_quality_audit', '', '160'],
              'RUN:runner_health': ['runner_health', '', '160'],
              'RUN:defapi_jev_prepare:MERCASTO': ['defapi_jev_prepare', 'MERCASTO', '220'],
              'RUN:defapi_jev_bench:MERCASTO': ['defapi_jev_bench', 'MERCASTO', '500'],
              'RUN:logs_frontend': ['logs_frontend', '', '200'],
              'RUN:logs_backend': ['logs_backend', '', '200'],
              'RUN:deploy_main:MERCASTO': ['deploy_main', 'MERCASTO', '160'],
              'RUN:restart_frontend:MERCASTO': ['restart_frontend', 'MERCASTO', '160'],
              'RUN:restart_stack:MERCASTO': ['restart_stack', 'MERCASTO', '160'],
              'RUN:align_media_caps:MERCASTO': ['align_media_caps', 'MERCASTO', '160'],
              'RUN:hermes_install:MERCASTO': ['hermes_install', 'MERCASTO', '220'],
              'RUN:hermes_publish:MERCASTO': ['hermes_publish', 'MERCASTO', '220'],
              'RUN:cleanup_build_cache:MERCASTO': ['cleanup_build_cache', 'MERCASTO', '160'],
              'RUN:cleanup_docker:MERCASTO': ['cleanup_docker', 'MERCASTO', '160'],
              'RUN:maintenance_reboot:MERCASTO': ['maintenance_reboot', 'MERCASTO', '220'],
            };
            const selected = commands[body];
            if (!selected) {
              core.setFailed(`Unsupported operator command: ${body}`);
              return;
            }
            core.setOutput('operation', selected[0]);
            core.setOutput('confirm', selected[1]);
            core.setOutput('tail_lines', selected[2]);
            core.info(`Validated allowlisted operation: ${selected[0]}`);

      - name: Verify production operator boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d /var/www/mercasto/.git
          test -f /var/www/mercasto/scripts/server-operator.sh
          test -f /var/www/mercasto/scripts/server-status-safe.sh
          bash -n /var/www/mercasto/scripts/server-operator.sh
          bash -n /var/www/mercasto/scripts/server-status-safe.sh

      - name: Execute allowlisted production operation
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          CONFIRM: ${{ steps.request.outputs.confirm }}
          TAIL_LINES: ${{ steps.request.outputs.tail_lines }}
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          if [ "$OPERATION" = "status" ]; then
            bash scripts/server-status-safe.sh
          elif [ "$OPERATION" = "mcp_status" ]; then
            echo "== MCP systemd =="
            for unit in mercasto-ssh-mcp.service mercasto-ssh-mcp-stdio.service desktop-commander.service remote-desktop-commander.service; do
              echo "-- $unit"
              printf 'enabled='; systemctl is-enabled "$unit" 2>/dev/null || true
              printf 'active='; systemctl is-active "$unit" 2>/dev/null || true
              systemctl show "$unit" --no-pager -p FragmentPath -p ActiveState -p SubState -p MainPID -p User 2>/dev/null || true
            done
            echo
            echo "== MCP local listeners =="
            ss -lntpH 2>/dev/null | grep -E '127\.0\.0\.1|\[::1\]' | grep -Ei 'mcp|ssh|node|:8001|:8765|:300[0-9]|:30[0-9]{2}' || true
          elif [ "$OPERATION" = "harness_upload_diag" ]; then
            echo "== Harness units =="
            for unit in deepseek-harness.service deepseek-harness-proxy.service; do
              echo "-- $unit"
              systemctl show "$unit" --no-pager \
                -p FragmentPath -p ActiveState -p SubState -p MainPID -p User -p ExecStart 2>/dev/null || true
            done
            echo
            echo "== Harness listeners =="
            sudo -n ss -lntpH 2>/dev/null | grep -E ':3080|:3081|:13080' || true
            echo
            echo "== dsh-full-remote config hints =="
            sudo -n grep -RsnE 'dsh-full-remote|maxRequestBytes|requestTimeoutMs|listenPort|backendHost|backendPort' \
              /root/.dsh/profiles/web /root/.dsh/settings.yaml 2>/dev/null | head -120 || true
            echo
            echo "== dsh-full-remote package versions =="
            sudo -n python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          roots = ['/root/.npm/_npx', '/opt', '/usr/local/lib']
          proc = subprocess.run(
              ['find', *roots, '-type', 'f', '-path', '*dsh-full-remote*/package.json', '-print'],
              text=True,
              capture_output=True,
              check=False,
          )
          seen = set()
          for raw in proc.stdout.splitlines()[:40]:
              p = Path(raw)
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              item = (str(p), data.get('name'), data.get('version'))
              if item in seen:
                  continue
              seen.add(item)
              print(json.dumps({'path': item[0], 'name': item[1], 'version': item[2]}, sort_keys=True))
          PY
            echo
            echo "== 2 MiB upload path codes =="
            smoke_file="$(mktemp /tmp/harness-upload-diag.XXXXXX)"
            trap 'rm -f "$smoke_file" /tmp/harness-upload-diag-headers.*' EXIT
            dd if=/dev/zero of="$smoke_file" bs=1M count=2 status=none

            probe_upload() {
              label="$1"
              shift
              headers="$(mktemp /tmp/harness-upload-diag-headers.XXXXXX)"
              code="$(
                curl -ksS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 30 \
                  -X POST \
                  -H 'Content-Type: application/octet-stream' \
                  --data-binary @"$smoke_file" \
                  "$@" || true
              )"
              server="$(awk 'BEGIN{IGNORECASE=1} /^server:/{sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\\r/, ""); print; exit}' "$headers")"
              echo "$label -> $code server=${server:-<none>}"
              rm -f "$headers"
            }

            probe_upload "app_3081" \
              http://127.0.0.1:3081/api/session/uploadFileBinary
            probe_upload "app_3080" \
              http://127.0.0.1:3080/api/session/uploadFileBinary
            probe_upload "internal_13080" \
              -H 'Host: harness.flyaicrm.com' \
              http://172.19.0.1:13080/api/session/uploadFileBinary
            probe_upload "edge_local_443" \
              --resolve harness.flyaicrm.com:443:127.0.0.1 \
              https://harness.flyaicrm.com/api/session/uploadFileBinary
            probe_upload "public_443" \
              https://harness.flyaicrm.com/api/session/uploadFileBinary

            rm -f "$smoke_file"
            trap - EXIT
          elif [ "$OPERATION" = "harness_workspace_audit" ]; then
            # Read-only audit: session directory names and workspace membership only.
            echo "== Harness workspace audit =="
            sudo -n python3 - <<'PY'
          import json
          from pathlib import Path

          workspace_path = Path('/root/.dsh/storages/workspace.json')
          sessions_root = Path('/root/.dsh/sessions')
          data = json.loads(workspace_path.read_text())
          workspaces = data.get('tables', {}).get('workspaces', {})
          order = data.get('global', {}).get('workspaceIds', [])

          sid_to_bucket = {}
          for journal in sessions_root.rglob('session.v3.jsonl.zstd'):
              sid = journal.parent.name
              if not sid.startswith('session-'):
                  continue
              sid_to_bucket.setdefault(sid, journal.parent.parent.name)

          assigned = {}
          bucket_owners = {}
          print('WORKSPACE_AUDIT_BEGIN')
          print('visible_session_journals=' + str(len(sid_to_bucket)))

          for wid in order:
              ws = workspaces.get(wid) or {}
              ids = [x for x in ws.get('sessionIds', []) if isinstance(x, str)]
              for sid in ids:
                  assigned[sid] = wid
              buckets = sorted({sid_to_bucket[sid] for sid in ids if sid in sid_to_bucket})
              for bucket in buckets:
                  bucket_owners.setdefault(bucket, []).append(wid)
              print('workspace=' + json.dumps({
                  'id': wid,
                  'title': ws.get('title') or wid,
                  'path': ws.get('path') or '',
                  'registered_sessions': len(ids),
                  'existing_visible_sessions': sum(1 for sid in ids if sid in sid_to_bucket),
                  'buckets': buckets,
              }, ensure_ascii=False, sort_keys=True))

          all_visible = set(sid_to_bucket)
          assigned_visible = all_visible & set(assigned)
          ungrouped = sorted(all_visible - assigned_visible)
          safe_candidates = {}
          ambiguous = []
          unmatched = []

          for sid in ungrouped:
              bucket = sid_to_bucket[sid]
              owners = bucket_owners.get(bucket, [])
              if len(owners) == 1:
                  safe_candidates.setdefault(owners[0], []).append(sid)
              elif len(owners) > 1:
                  ambiguous.append((sid, bucket))
              else:
                  unmatched.append((sid, bucket))

          print('assigned_visible=' + str(len(assigned_visible)))
          print('ungrouped_visible=' + str(len(ungrouped)))
          print('safe_exact_bucket_candidates=' + str(sum(len(v) for v in safe_candidates.values())))
          print('ambiguous_exact_bucket=' + str(len(ambiguous)))
          print('no_exact_bucket=' + str(len(unmatched)))

          for wid in order:
              ws = workspaces.get(wid) or {}
              print('candidate=' + json.dumps({
                  'id': wid,
                  'title': ws.get('title') or wid,
                  'count': len(safe_candidates.get(wid, [])),
              }, ensure_ascii=False, sort_keys=True))

          counts = {}
          for _, bucket in unmatched:
              counts[bucket] = counts.get(bucket, 0) + 1
          for bucket, count in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:80]:
              print('unmatched_bucket=' + json.dumps({'bucket': bucket, 'count': count}, ensure_ascii=False, sort_keys=True))
          print('WORKSPACE_AUDIT_END')
          PY
          elif [ "$OPERATION" = "ghost_access_probe" ]; then
            echo "== Ghost deleted-branch GitHub events =="
            curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/MShneur/ghost-in-the-loop/events?per_page=100' \
              > /tmp/ghost-events.json
            python3 - /tmp/ghost-events.json <<'PY'
          import json, sys
          events = json.load(open(sys.argv[1]))
          target = "tooling/chatgpt-nonstop-loop"
          matches = []
          for e in events:
              p = e.get("payload") or {}
              ref = p.get("ref")
              if ref in (target, "refs/heads/" + target):
                  matches.append({
                      "type": e.get("type"),
                      "created_at": e.get("created_at"),
                      "ref": ref,
                      "before": p.get("before"),
                      "head": p.get("head"),
                      "ref_type": p.get("ref_type"),
                      "size": p.get("size"),
                      "distinct_size": p.get("distinct_size"),
                      "commits": p.get("commits"),
                  })
          print("matching_events=" + str(len(matches)))
          for m in matches:
              print(json.dumps(m, sort_keys=True))
          PY
            rm -f /tmp/ghost-events.json
            echo
            echo "== Remote nonstop branch now =="
            git ls-remote https://github.com/MShneur/ghost-in-the-loop.git \
              'refs/heads/tooling/chatgpt-nonstop-loop' 2>/dev/null || true
            echo
            echo "== Server GitHub permission =="
            if command -v gh >/dev/null 2>&1; then
              gh auth status 2>&1 | sed -E 's/(Token:).*/\1 ***REDACTED***/' || true
              gh api repos/MShneur/ghost-in-the-loop --jq '.permissions // {}' 2>/dev/null || true
            else
              echo "gh_not_installed=true"
            fi
          elif [ "$OPERATION" = "defapi_jev_prepare" ]; then
            test "$CONFIRM" = "MERCASTO"
            BENCH_DIR=/root/.config/defapi-jev-bench
            echo "== Prepare one-time encrypted DefAPI Jev benchmark channel =="
            sudo -n rm -rf "$BENCH_DIR"
            sudo -n install -d -m 0700 "$BENCH_DIR"
            transfer_id="$(openssl rand -hex 12)"
            printf '%s\n' "$transfer_id" | sudo -n tee "$BENCH_DIR/transfer-id" >/dev/null
            sudo -n openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
              -out "$BENCH_DIR/private.pem"
            sudo -n chmod 0600 "$BENCH_DIR/private.pem"
            sudo -n openssl pkey -in "$BENCH_DIR/private.pem" -pubout \
              -out "$BENCH_DIR/public.pem"
            sudo -n chmod 0644 "$BENCH_DIR/public.pem"
            public_b64="$(sudo -n base64 -w0 "$BENCH_DIR/public.pem")"
            echo "defapi_transfer_id=$transfer_id"
            echo "defapi_public_key_b64=$public_b64"
            echo "DEFAPI_JEV_PREPARE_OK"
          elif [ "$OPERATION" = "defapi_jev_bench" ]; then
            test "$CONFIRM" = "MERCASTO"
            BENCH_DIR=/root/.config/defapi-jev-bench
            sudo -n test -s "$BENCH_DIR/private.pem"
            stored_id="$(sudo -n cat "$BENCH_DIR/transfer-id")"

            bench_tmp="$(mktemp -d /tmp/defapi-jev-bench.XXXXXX)"
            cleanup_defapi_bench() {
              unset DEFAPI_KEY || true
              rm -rf "$bench_tmp" || true
              sudo -n rm -rf "$BENCH_DIR" || true
            }
            trap cleanup_defapi_bench EXIT

            echo "== Fetch benchmark script from protected main =="
            sudo -n git -C /var/www/mercasto fetch origin main --prune
            sudo -n git -C /var/www/mercasto show origin/main:scripts/defapi-jev-bench.py \
              >"$bench_tmp/defapi-jev-bench.py"
            python3 -m py_compile "$bench_tmp/defapi-jev-bench.py"

            echo "== Read latest encrypted payload from operator issue =="
            payload="$(gh api --paginate 'repos/johnslimg-alt/mercasto/issues/832/comments?per_page=100' \
              --jq '.[] | select(.user.login == "johnslimg-alt") | select(.body | startswith("DEFAPI_JEV_PAYLOAD:")) | .body' \
              | tail -1)"
            case "$payload" in
              DEFAPI_JEV_PAYLOAD:*) ;;
              *) echo "No encrypted DefAPI payload found." >&2; exit 72 ;;
            esac
            payload_rest="${payload#DEFAPI_JEV_PAYLOAD:}"
            transfer_id="${payload_rest%%:*}"
            ciphertext_b64="${payload_rest#*:}"
            test "$transfer_id" = "$stored_id"
            [[ "$transfer_id" =~ ^[a-f0-9]{24}$ ]]
            [[ "$ciphertext_b64" =~ ^[A-Za-z0-9+/=]{100,2000}$ ]]
            echo "::add-mask::$ciphertext_b64"

            printf '%s' "$ciphertext_b64" | base64 -d >"$bench_tmp/key.enc"
            DEFAPI_KEY="$(sudo -n openssl pkeyutl -decrypt \
              -inkey "$BENCH_DIR/private.pem" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -in "$bench_tmp/key.enc")"
            test -n "$DEFAPI_KEY"
            echo "::add-mask::$DEFAPI_KEY"
            case "$DEFAPI_KEY" in
              dk-*) ;;
              *) echo "Decrypted value does not look like a DefAPI key." >&2; exit 73 ;;
            esac

            sudo -n rm -rf "$BENCH_DIR"
            rm -f "$bench_tmp/key.enc"
            export DEFAPI_KEY
            echo "== Run bounded Jev quality + load benchmark =="
            python3 "$bench_tmp/defapi-jev-bench.py"
            unset DEFAPI_KEY
            echo "DEFAPI_JEV_BENCH_RUN_OK"
          else
            OPERATION="$OPERATION" CONFIRM="$CONFIRM" TAIL_LINES="$TAIL_LINES" \
              bash scripts/server-operator.sh "$OPERATION" "$CONFIRM"
          fi

      - name: Report result
        if: always()
        uses: actions/github-script@v9
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const operation = process.env.OPERATION || 'validation-failed';
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'CHATGPT_SERVER_OPERATOR_RESULT',
              `operation=${operation}`,
              `status=${status}`,
              `run_id=${context.runId}`,
              `run=${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 832,
              body
            });
