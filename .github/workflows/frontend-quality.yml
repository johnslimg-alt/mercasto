name: Frontend Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '11 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - '.github/workflows/frontend-quality.yml'
      - 'tests/e2e/notifications-localization.spec.js'
      - 'scripts/i18n-audit.mjs'
      - 'scripts/check-recovery-guards.mjs'
      - 'scripts/public-copy-scan.sh'
      - 'scripts/fix-public-copy-fallbacks.sh'
      - 'scripts/apply-production-hotfixes.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - '.github/workflows/frontend-quality.yml'
      - 'tests/e2e/notifications-localization.spec.js'
      - 'scripts/i18n-audit.mjs'
      - 'scripts/check-recovery-guards.mjs'
      - 'scripts/public-copy-scan.sh'
      - 'scripts/fix-public-copy-fallbacks.sh'
      - 'scripts/apply-production-hotfixes.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run recovery guards
        run: npm run check:recovery
      - name: Audit translations
        run: npm run i18n:audit
      - name: Run frontend lint gate
        run: npm run lint:ci
      - name: Run public copy scan
        run: bash scripts/public-copy-scan.sh
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for localized UI regression
        run: npx playwright install --with-deps chromium
      - name: Run localized notifications shell and referral UI regression
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mercasto-localization-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 CI=1 npx playwright test tests/e2e/notifications-localization.spec.js tests/e2e/shell-localization.spec.js tests/e2e/referral-localization.spec.js --project=chromium-desktop --workers=1 --retries=1 --reporter=list
