name: Frontend Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '11 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'playwright.config.*'
      - '.github/workflows/frontend-quality.yml'
      - 'tests/**'
      - 'scripts/i18n-audit.mjs'
      - 'scripts/check-recovery-guards.mjs'
      - 'scripts/frontend-quality-shard.sh'
      - 'scripts/public-copy-scan.sh'
      - 'scripts/fix-public-copy-fallbacks.sh'
      - 'scripts/apply-production-hotfixes.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'playwright.config.*'
      - '.github/workflows/frontend-quality.yml'
      - 'tests/**'
      - 'scripts/i18n-audit.mjs'
      - 'scripts/check-recovery-guards.mjs'
      - 'scripts/frontend-quality-shard.sh'
      - 'scripts/public-copy-scan.sh'
      - 'scripts/fix-public-copy-fallbacks.sh'
      - 'scripts/apply-production-hotfixes.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static:
    name: Static build checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run recovery guards
        run: npm run check:recovery
      - name: Audit translations
        run: npm run i18n:audit
      - name: Run frontend unit contracts
        run: node --test tests/*.test.mjs
      - name: Run frontend lint gate
        run: npm run lint:ci
      - name: Run public copy scan
        run: bash scripts/public-copy-scan.sh
      - name: Build frontend
        run: npm run build

  browser:
    name: Browser shard (${{ matrix.shard }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: localized-dashboard
            port: 4173
          - shard: localized-public
            port: 4174
          - shard: journey
            port: 4175
          - shard: critical
            port: 4176
          - shard: catalog
            port: 4177
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.shard }} regression
        run: bash scripts/frontend-quality-shard.sh '${{ matrix.shard }}' '${{ matrix.port }}'

  webkit:
    name: WebKit public smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run WebKit public smoke
        run: bash scripts/frontend-quality-shard.sh webkit-public 4178

  frontend:
    name: Build and recovery checks
    if: ${{ always() }}
    needs:
      - static
      - browser
      - webkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all frontend quality shards
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          test "${STATIC_RESULT}" = 'success'
          test "${BROWSER_RESULT}" = 'success'
          test "${WEBKIT_RESULT}" = 'success'
