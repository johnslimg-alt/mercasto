name: Frontend Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '11 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'playwright.config.*'
      - '.github/workflows/frontend-quality.yml'
      - 'tests/**'
      - 'scripts/i18n-audit.mjs'
      - 'scripts/check-recovery-guards.mjs'
      - 'scripts/frontend-quality-shard.sh'
      - 'scripts/public-ui-route-policy.mjs'
      - 'scripts/public-ui-route-coverage-gate.mjs'
      - 'scripts/client-spa-route-policy.mjs'
      - 'scripts/client-spa-route-coverage-gate.mjs'
      - 'scripts/public-ui-visual-evidence-gate.sh'
      - 'scripts/public-copy-scan.sh'
      - 'scripts/fix-public-copy-fallbacks.sh'
      - 'scripts/apply-production-hotfixes.sh'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    name: Frontend quality scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect frontend-relevant changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"

          if printf '%s\n' "$files" | grep -Eq '^(index\.html$|src/|public/|package\.json$|package-lock\.json$|vite\.config\.|tailwind\.config\.|playwright\.config\.|tests/|\.github/workflows/frontend-quality\.yml$|scripts/(i18n-audit\.mjs|check-recovery-guards\.mjs|frontend-quality-shard\.sh|public-ui-route-policy\.mjs|public-ui-route-coverage-gate\.mjs|client-spa-route-policy\.mjs|client-spa-route-coverage-gate\.mjs|public-ui-visual-evidence-gate\.sh|public-copy-scan\.sh|fix-public-copy-fallbacks\.sh|apply-production-hotfixes\.sh)$)'; then
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Static build checks
    needs: scope
    if: needs.scope.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run recovery guards
        run: npm run check:recovery
      - name: Audit translations
        run: npm run i18n:audit
      - name: Verify public UI route coverage
        run: bash scripts/public-ui-visual-evidence-gate.sh
      - name: Run frontend unit contracts
        run: node --test tests/*.test.mjs
      - name: Run frontend lint gate
        run: npm run lint:ci
      - name: Run public copy scan
        run: bash scripts/public-copy-scan.sh
      - name: Build frontend
        run: npm run build

  browser:
    name: Browser shard (${{ matrix.shard }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: localized-dashboard
            port: 4173
          - shard: localized-public
            port: 4174
          - shard: journey
            port: 4175
          - shard: critical
            port: 4176
          - shard: catalog
            port: 4177
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.shard }} regression
        run: bash scripts/frontend-quality-shard.sh '${{ matrix.shard }}' '${{ matrix.port }}'

  webkit:
    name: WebKit public smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Stabilize Ubuntu apt mirror
        run: |
          for source_file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${source_file}" ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "${source_file}"
            fi
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99mercasto-ci-network >/dev/null
      - name: Install WebKit
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps webkit
      - name: Run WebKit public smoke
        run: bash scripts/frontend-quality-shard.sh webkit-public 4178

  frontend:
    name: Build and recovery checks
    if: ${{ always() }}
    needs:
      - scope
      - static
      - browser
      - webkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify frontend scope and quality shards
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FRONTEND: ${{ needs.scope.outputs.run_frontend }}
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = 'success'

          if [ "${RUN_FRONTEND}" = 'true' ]; then
            test "${STATIC_RESULT}" = 'success'
            test "${BROWSER_RESULT}" = 'success'
            test "${WEBKIT_RESULT}" = 'success'
          else
            test "${RUN_FRONTEND}" = 'false'
            test "${STATIC_RESULT}" = 'skipped'
            test "${BROWSER_RESULT}" = 'skipped'
            test "${WEBKIT_RESULT}" = 'skipped'
          fi
