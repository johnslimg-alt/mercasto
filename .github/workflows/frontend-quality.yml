      - 'scripts/apply-production-hotfixes.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and recovery checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run recovery guards
        run: npm run check:recovery
      - name: Audit translations
        run: npm run i18n:audit
      - name: Check vertical localization coverage
        run: node --test tests/vertical-copy-localization.test.mjs tests/autos-landing-copy.test.mjs tests/empleos-landing-copy.test.mjs tests/inmuebles-landing-copy.test.mjs tests/servicios-landing-copy.test.mjs tests/category-landing-subcategory-localization.test.mjs tests/storefront-review-locale.test.mjs tests/ad-detail-localization.test.mjs tests/seller-profile-localization.test.mjs tests/storefront-public-copy.test.mjs tests/stores-directory-localization.test.mjs tests/runtime-seo-localization.test.mjs tests/runtime-schema-localization.test.mjs tests/contact-page-localization.test.mjs tests/help-center-localization.test.mjs tests/email-verification-localization.test.mjs
      - name: Run frontend lint gate
        run: npm run lint:ci
      - name: Run public copy scan
        run: bash scripts/public-copy-scan.sh
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for localized UI regression
        run: npx playwright install --with-deps chromium
      - name: Run localized UI and dashboard locale regression
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mercasto-localization-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 CI=1 npx playwright test tests/e2e/notifications-localization.spec.js tests/e2e/shell-localization.spec.js tests/e2e/referral-localization.spec.js tests/e2e/profile-edit-localization.spec.js tests/e2e/chat-localization.spec.js tests/e2e/saved-searches-localization.spec.js tests/e2e/dashboard-locale-format.spec.js tests/e2e/post-edit-localization.spec.js --project=chromium-desktop --workers=1 --retries=1 --reporter=list
          BASE_URL=http://127.0.0.1:4173 CI=1 npx playwright test tests/e2e/vertical-landing-localization.spec.js tests/e2e/autos-landing-localization.spec.js tests/e2e/empleos-landing-localization.spec.js tests/e2e/inmuebles-landing-localization.spec.js tests/e2e/servicios-landing-localization.spec.js tests/e2e/category-landing-subcategory-localization.spec.js tests/e2e/ad-detail-localization.spec.js tests/e2e/seller-profile-localization.spec.js tests/e2e/storefront-public-copy.spec.js tests/e2e/stores-directory-localization.spec.js tests/e2e/runtime-seo-localization.spec.js tests/e2e/runtime-schema-localization.spec.js tests/e2e/contact-page-localization.spec.js tests/e2e/help-center-localization.spec.js tests/e2e/email-verification-localization.spec.js --project=chromium-desktop --project=chromium-mobile --workers=2 --retries=1 --reporter=list
      - name: Run catalog filter state regression
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/mercasto-catalog-filter-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4174 CI=1 npx playwright test tests/e2e/catalog-filter-state.spec.js tests/e2e/catalog-request-race.spec.js tests/e2e/catalog-map-filter-state.spec.js tests/e2e/catalog-map-responsive.spec.js tests/e2e/map-shell-localization.spec.js tests/e2e/archived-language-fallback.spec.js tests/e2e/category-filter-option-localization.spec.js --project=chromium-desktop --project=chromium-mobile --workers=1 --retries=1 --reporter=list
