name: Apply new seller publish fix

on:
  push:
    branches:
      - fix/new-seller-publish-location
    paths:
      - .github/workflows/apply-new-seller-publish-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/new-seller-publish-location
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused publication fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/App.jsx",
              """    if (form.latitude === '' || form.longitude === '') {
                showToast('Selecciona la ubicación exacta tocando el mapa.', 'error');
                return;
              }

              setPostLoading(true);""",
              """    // Exact map coordinates improve accuracy, but they must not block publishing.
              // The backend can derive a safe approximate position from the selected city and state.
              setPostLoading(true);""",
          )

          replace_once(
              "src/App.jsx",
              """        const errorData = await res.json();
                const validationError = Object.values(errorData.errors || {}).flat().find(Boolean);
                showToast(`Error: ${validationError || errorData.message || 'No se pudo guardar el anuncio.'}`, 'error');
              }
            } catch (err) { console.error(\"Post error\"); }
            finally { setPostLoading(false); }""",
              """        const errorData = await res.json().catch(() => ({}));
                const validationError = Object.values(errorData.errors || {}).flat().find(Boolean);
                showToast(`Error: ${validationError || errorData.message || 'No se pudo guardar el anuncio.'}`, 'error');
              }
            } catch (err) {
              console.error(\"Post error\", err);
              showToast('No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.', 'error');
            }
            finally { setPostLoading(false); }""",
          )

          replace_once(
              "src/components/screens/PostScreen.jsx",
              """  const step3Valid = !!form.state && !!form.location && contactMethods.length > 0""",
              """  const step3Valid = !!form.state && !!form.city && !!form.location && contactMethods.length > 0""",
          )

          replace_once(
              "src/components/screens/PostScreen.jsx",
              """{t.tap_map_hint || 'Toca el mapa para marcar la ubicación exacta de tu anuncio.'}""",
              """{t.tap_map_hint || 'Puedes tocar el mapa para precisar la ubicación; si no, usaremos la ciudad seleccionada.'}""",
          )

          replace_once(
              "backend/app/Http/Controllers/Api/AdController.php",
              """            'latitude' => 'required|numeric|between:14,33',
                          'longitude' => 'required|numeric|between:-118,-86',""",
              """            'latitude' => 'nullable|numeric|between:14,33',
                          'longitude' => 'nullable|numeric|between:-118,-86',""",
          )

          app = Path("src/App.jsx").read_text()
          post = Path("src/components/screens/PostScreen.jsx").read_text()
          backend = Path("backend/app/Http/Controllers/Api/AdController.php").read_text()
          assert "Selecciona la ubicación exacta tocando el mapa." not in app
          assert "!!form.state && !!form.city && !!form.location" in post
          assert "'latitude' => 'nullable|numeric|between:14,33'" in backend
          assert "'longitude' => 'nullable|numeric|between:-118,-86'" in backend
          PY

      - name: Verify PHP syntax
        run: php -l backend/app/Http/Controllers/Api/AdController.php

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:ci

      - name: Build frontend
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-new-seller-publish-fix.yml
          git add src/App.jsx src/components/screens/PostScreen.jsx backend/app/Http/Controllers/Api/AdController.php
          git commit -m "Fix new seller publication without map coordinates"
          git push origin HEAD:fix/new-seller-publish-location
