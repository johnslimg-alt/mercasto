name: DSH OpenRouter Finalize PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-sudo-probe-pr.yml'
      - 'scripts/dsh_openrouter_finalize.py'

permissions:
  contents: read

jobs:
  finalize:
    if: github.head_ref == 'ops/dsh-openrouter-finalize'
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Finalize DSH rotation as root
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/dsh_openrouter_finalize.py
          sudo -n python3 scripts/dsh_openrouter_finalize.py
