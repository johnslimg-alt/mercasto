name: DSH Sudo Probe PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-sudo-probe-pr.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'ops/dsh-openrouter-finalize'
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Probe non-interactive root access
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(id -un)"
          if sudo -n true; then
            echo "sudo_noninteractive=yes"
          else
            echo "sudo_noninteractive=no"
            exit 1
          fi
          sudo -n test -r /root/.dsh/settings.yaml
          echo "dsh_settings_root_read=yes"
