name: LM Studio Qwen3-VL 2B vision benchmark

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Mercasto"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lmstudio-qwen3-vl-2b-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark LM Studio vision path
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[lmstudio-benchmark]')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Verify deployed main
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          fi

      - name: Run isolated synthetic LM Studio benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/lmstudio-sdk-benchmark-wrapper.sh
