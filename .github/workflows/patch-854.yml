name: Apply #854 production checkout patch

on:
  push:
    branches: [fix/854-server-operator-root-checkout]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/854-server-operator-root-checkout
          fetch-depth: 0
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          operator_path = Path('scripts/server-operator.sh')
          s = operator_path.read_text()

          anchor = '''compose_ps() {
            "${COMPOSE_PROD[@]}" ps
          }

          clear_laravel_bootstrap_caches() {
          '''
          replacement = '''compose_ps() {
            "${COMPOSE_PROD[@]}" ps
          }

          is_production_checkout() {
            [ "$PROJECT_DIR" = "/var/www/mercasto" ]
          }

          clear_laravel_bootstrap_caches() {
          '''
          assert s.count(anchor) == 1, f'compose helper anchor count={s.count(anchor)}'
          s = s.replace(anchor, replacement, 1)

          old_cache = '''  print_header "Clear stale Laravel bootstrap caches"
            rm -f "$cache_dir/config.php" "$cache_dir/events.php"
            find "$cache_dir" -maxdepth 1 -type f -name 'routes-*.php' -delete
          }
          '''
          new_cache = '''  print_header "Clear stale Laravel bootstrap caches"
            if is_production_checkout; then
              sudo -n rm -f backend/bootstrap/cache/*.php
              return
            fi

            rm -f "$cache_dir/config.php" "$cache_dir/events.php"
            find "$cache_dir" -maxdepth 1 -type f -name 'routes-*.php' -delete
          }
          '''
          assert s.count(old_cache) == 1, f'cache block count={s.count(old_cache)}'
          s = s.replace(old_cache, new_cache, 1)

          old_sync = '''  print_header "Sync main"
            git fetch origin main --prune
            git reset --hard origin/main
            git clean -fd -e runners/data1 -e runners/data2 -e runners/data3 -e runners/.env
            clear_laravel_bootstrap_caches
          '''
          new_sync = '''  print_header "Sync main"
            if is_production_checkout; then
              sudo -n git fetch origin
              sudo -n git reset --hard origin/main
              sudo -n git clean -fd -e runners/data1 -e runners/data2 -e runners/data3 -e runners/.env
            else
              git fetch origin main --prune
              git reset --hard origin/main
              git clean -fd -e runners/data1 -e runners/data2 -e runners/data3 -e runners/.env
            fi
            clear_laravel_bootstrap_caches
          '''
          assert s.count(old_sync) == 1, f'deploy sync block count={s.count(old_sync)}'
          s = s.replace(old_sync, new_sync, 1)
          operator_path.write_text(s)

          test_path = Path('scripts/server-operator-deploy-cache.test.mjs')
          t = test_path.read_text()
          marker = '''test('deploy refreshes Laravel caches after migrations and before verification', () => {
          '''
          contract = r'''test('production deploy uses the existing narrow sudo boundary for root-owned checkout mutation', () => {
            assert.match(operator, /is_production_checkout\(\)/);
            assert.match(operator, /\[ "\$PROJECT_DIR" = "\/var\/www\/mercasto" \]/);

            const deploy = deployMainBlock();
            assert.match(deploy, /sudo -n git fetch origin/);
            assert.match(deploy, /sudo -n git reset --hard origin\/main/);
            assert.match(deploy, /sudo -n git clean -fd -e runners\/data1 -e runners\/data2 -e runners\/data3 -e runners\/\.env/);
            assert.match(operator, /sudo -n rm -f backend\/bootstrap\/cache\/\*\.php/);
            assert.match(deploy, /else\n\s+git fetch origin main --prune/);
            assert.doesNotMatch(operator, /chown\s+-R|chmod\s+-R/);
          });

          '''
          assert t.count(marker) == 1, f'test insertion marker count={t.count(marker)}'
          t = t.replace(marker, contract + marker, 1)
          test_path.write_text(t)
          PY

          bash -n scripts/server-operator.sh
          node --test scripts/server-operator-deploy-cache.test.mjs
          git diff --check

      - name: Commit only final target files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-854.yml
          git status --short
          changed="$(git diff --name-only | sort)"
          expected=$'scripts/server-operator-deploy-cache.test.mjs\nscripts/server-operator.sh'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/server-operator.sh scripts/server-operator-deploy-cache.test.mjs .github/workflows/patch-854.yml
          git commit -m 'fix: allow operator deploy on root-owned checkout'
          git push origin HEAD:fix/854-server-operator-root-checkout
