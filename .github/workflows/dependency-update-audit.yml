name: Dependency Update Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-update-audit.yml'
      - 'scripts/dependency-update-audit.sh'

permissions:
  contents: read

concurrency:
  group: dependency-update-audit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  audit:
    name: Audit npm, Composer, and Docker dependencies
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v7

      - name: Prepare audit paths
        run: |
          set -euo pipefail
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "AUDIT_DIR=/tmp/mercasto-dependency-audit-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "Using isolated Actions workspace: $GITHUB_WORKSPACE"

      - name: Run dependency update audit
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x scripts/dependency-update-audit.sh
          scripts/dependency-update-audit.sh "$AUDIT_DIR"

      - name: Print concise audit pointers
        if: always()
        run: |
          set -euo pipefail
          echo "Audit directory: ${AUDIT_DIR:-unset}"
          if [ -d "${AUDIT_DIR:-}" ]; then
            find "$AUDIT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          fi

      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mercasto-dependency-update-audit
          path: ${{ env.AUDIT_DIR }}
          if-no-files-found: warn
          retention-days: 14
