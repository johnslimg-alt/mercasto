name: DSH Adapter Profile Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-openrouter-probe-pr.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/dsh_profile_probe_key
          chmod 600 ~/.ssh/dsh_profile_probe_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Compare web and headless LLM adapters
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dsh_profile_probe_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for profile in web headless; do
            echo "=== PROFILE $profile ==="
            npx --yes @deepseek-ai/dsh@0.1.5-rc.1 --profile "$profile" --dump-config >"/tmp/dsh-$profile-config.txt"
            grep -nE 'id: (llm|llm-pi-ai|llm-deepseek)|dsh-llm-pi-ai|dsh-llm-deepseek|agent-default-model|openrouter|glm-5.3-flash' "/tmp/dsh-$profile-config.txt" | head -100 || true
          done
          echo "=== HARNESS HEALTH ==="
          systemctl is-active deepseek-harness.service
          systemctl is-active deepseek-harness-proxy.service
          curl -skSI --max-time 15 https://harness.flyaicrm.com/ | head -8
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/dsh_profile_probe_key
