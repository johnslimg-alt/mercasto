name: Locate Duplicate llm-pi-ai

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-openrouter-probe-pr.yml'

permissions:
  contents: read

jobs:
  locate:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/harness_locate_key
          chmod 600 ~/.ssh/harness_locate_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Locate duplicate
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/harness_locate_key "root@$SERVER_HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          roots=[Path("/root/.dsh/profiles/web"),Path("/root/.dsh")]
          seen=set()
          for root in roots:
              for p in root.rglob("*"):
                  if not p.is_file() or p in seen: continue
                  seen.add(p)
                  try:
                      text=p.read_text(errors="ignore")
                  except Exception:
                      continue
                  if "llm-pi-ai" not in text:
                      continue
                  print(f"FILE {p}")
                  lines=text.splitlines()
                  for i,line in enumerate(lines,1):
                      if "llm-pi-ai" in line:
                          lo=max(1,i-3); hi=min(len(lines),i+4)
                          for n in range(lo,hi+1):
                              s=lines[n-1]
                              low=s.lower()
                              if any(x in low for x in ("api_key:","apikey:","token:","secret:","password:")):
                                  s=s.split(":",1)[0]+": <redacted>"
                              print(f"{n:04d}: {s}")
                          print("---")
          PY'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/harness_locate_key
