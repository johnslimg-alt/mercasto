name: Emergency Harness Status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-openrouter-probe-pr.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/harness_status_key
          chmod 600 ~/.ssh/harness_status_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose Harness
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/harness_status_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set +e
          red='s/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g'
          echo "=== SYSTEMD ==="
          systemctl show deepseek-harness.service --no-pager -p ActiveState -p SubState -p Result -p NRestarts -p ExecMainStatus -p ExecStart
          systemctl cat deepseek-harness.service
          echo "=== PORTS ==="
          ss -lntp | grep -E ':(3080|3081)\b' || true
          echo "=== CREDENTIAL REFS ==="
          python3 - <<'PY'
          import yaml
          p="/root/.dsh/.credentials.yaml"
          try:
              d=yaml.safe_load(open(p)) or {}
              print(sorted((d.get("refs") or {}).keys()))
          except Exception as e:
              print("credentials_parse_error",type(e).__name__,str(e))
          PY
          echo "=== DEFAULT MODEL ==="
          python3 - <<'PY'
          import yaml
          p="/root/.dsh/settings.yaml"
          try:
              d=yaml.safe_load(open(p)) or {}
              print(d.get("agent-default-model"))
              print("llm-pi-ai providers=",sorted(((d.get("llm-pi-ai") or {}).get("providers") or {}).keys()))
          except Exception as e:
              print("settings_parse_error",type(e).__name__,str(e))
          PY
          echo "=== DUMP CONFIG ==="
          timeout 60s npx --yes @deepseek-ai/dsh@0.1.5-rc.1 --profile web --dump-config >/tmp/dsh-status-dump.out 2>/tmp/dsh-status-dump.err
          echo "dump_rc=$?"
          tail -80 /tmp/dsh-status-dump.err | sed -E "$red"
          echo "=== JOURNAL ==="
          journalctl -u deepseek-harness.service -n 160 --no-pager 2>&1 | sed -E "$red" | tail -160
          echo "=== PROXY ==="
          systemctl show deepseek-harness-proxy.service --no-pager -p ActiveState -p SubState -p Result
          curl -sSI --max-time 10 http://127.0.0.1:3080/ | head -12 || true
          curl -skSI --max-time 10 https://127.0.0.1:8443/ | head -12 || true
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/harness_status_key
