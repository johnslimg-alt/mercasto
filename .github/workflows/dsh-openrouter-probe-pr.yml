name: DSH OpenRouter Probe PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-openrouter-probe-pr.yml'
      - '.github/workflows/dsh-model-rotation-recovery.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH recovery secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install temporary SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/dsh_probe_key
          chmod 600 ~/.ssh/dsh_probe_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Probe DSH credential schema and prepare one-time public key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dsh_probe_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=/root/.dsh/.credentials.yaml
          S=/root/.dsh/settings.yaml
          echo "=== HARNESS ==="
          systemctl is-active deepseek-harness.service
          systemctl show deepseek-harness.service --no-pager -p ExecStart -p EnvironmentFiles -p Environment | sed -E 's/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g'
          echo "=== CREDENTIAL STRUCTURE ==="
          python3 - "$C" <<'PY'
          import sys, yaml
          from pathlib import Path
          p=Path(sys.argv[1])
          d=yaml.safe_load(p.read_text()) if p.exists() else {}
          def shape(x, depth=0):
              if isinstance(x, dict):
                  return {str(k): shape(v, depth+1) for k,v in x.items()}
              if isinstance(x, list):
                  return [shape(v, depth+1) for v in x[:4]]
              if isinstance(x, str):
                  if len(x) > 20:
                      return f"<string:{len(x)}>"
                  return x if x in ("DEEPSEEK_API_KEY","OPENROUTER_API_KEY") else "<string>"
              if x is None: return None
              return f"<{type(x).__name__}>"
          print(yaml.safe_dump(shape(d), sort_keys=False))
          PY
          echo "=== DSH CREDENTIAL HELP ==="
          (npx --yes @deepseek-ai/dsh@0.1.5-rc.1 credentials --help || true) 2>&1 | head -120
          echo "=== PI-AI CONFIG (SANITIZED) ==="
          python3 - "$S" <<'PY'
          import sys, yaml
          from pathlib import Path
          p=Path(sys.argv[1]); d=yaml.safe_load(p.read_text()) or {}
          x=d.get("llm-pi-ai")
          print(yaml.safe_dump(x, sort_keys=False) if x is not None else "llm-pi-ai: <unset>")
          PY
          echo "=== ONE-TIME RSA PUBLIC KEY ==="
          PRIV=/root/.dsh/.openrouter-install-private.pem
          PUB=/root/.dsh/.openrouter-install-public.pem
          rm -f "$PRIV" "$PUB"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$PRIV" >/dev/null 2>&1
          chmod 0600 "$PRIV"
          openssl pkey -in "$PRIV" -pubout -out "$PUB" >/dev/null 2>&1
          chmod 0644 "$PUB"
          cat "$PUB"
          echo "DSH_OPENROUTER_SCHEMA_PROBE_OK"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/dsh_probe_key
