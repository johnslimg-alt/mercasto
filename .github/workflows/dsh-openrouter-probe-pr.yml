name: Emergency Harness 502 Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-openrouter-probe-pr.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate SSH recovery secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install temporary SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/harness_repair_key
          chmod 600 ~/.ssh/harness_repair_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Repair Harness 502
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/harness_repair_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== BEFORE ==="
          systemctl show deepseek-harness.service --no-pager -p ActiveState -p SubState -p Result -p NRestarts -p ExecMainStatus || true
          journalctl -u deepseek-harness.service -n 100 --no-pager 2>&1 \
            | sed -E 's/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g' \
            | tail -100 || true

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          B=/root/.dsh/backups/emergency-502
          install -d -m 0700 "$B"
          cp -a /root/.dsh/settings.yaml "$B/settings.yaml.$STAMP"
          cp -a /root/.dsh/.credentials.yaml "$B/credentials.yaml.$STAMP"
          chmod 0600 "$B/"*".$STAMP"

          echo "=== DISABLE LEGACY PAUSE GUARD ==="
          systemctl disable --now dsh-pause.timer dsh-resume.timer 2>/dev/null || true
          if [ -x /usr/local/sbin/dsh-deepseek-credential-gate ]; then
            /usr/local/sbin/dsh-deepseek-credential-gate resume || true
          fi
          rm -f /etc/systemd/system/deepseek-harness.service.d/20-ai-window-guard.conf

          echo "=== FORCE KNOWN-GOOD DEFAULT ==="
          python3 - /root/.dsh/settings.yaml <<'PY'
          import os,re,sys,tempfile
          from pathlib import Path
          p=Path(sys.argv[1]); text=p.read_text()
          block="agent-default-model:\n  provider: deepseek-official\n  model: deepseek-flash\n"
          lines=text.splitlines(keepends=True)
          start=None
          for i,line in enumerate(lines):
              if re.match(r"^agent-default-model:\s*(?:#.*)?$",line.rstrip("\n")):
                  start=i; break
          if start is None:
              new=text.rstrip()+"\n\n"+block
          else:
              end=len(lines)
              for i in range(start+1,len(lines)):
                  if re.match(r"^[A-Za-z0-9_.-]+:\s*",lines[i]):
                      end=i; break
              new="".join(lines[:start])+block+"".join(lines[end:])
          fd,tmp=tempfile.mkstemp(dir=str(p.parent),prefix=".settings.repair.",text=True)
          with os.fdopen(fd,"w") as h:
              h.write(new); h.flush(); os.fsync(h.fileno())
          os.chmod(tmp,p.stat().st_mode & 0o777); os.replace(tmp,p)
          PY

          echo "=== VALIDATE CONFIG ==="
          npx --yes @deepseek-ai/dsh@0.1.5-rc.1 --profile web --dump-config >/tmp/dsh-dump.txt 2>/tmp/dsh-dump.err
          echo "dump_config_rc=$?"
          tail -40 /tmp/dsh-dump.err | sed -E 's/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g' || true

          echo "=== RESTART ==="
          systemctl daemon-reload
          systemctl reset-failed deepseek-harness.service || true
          systemctl restart deepseek-harness.service
          systemctl restart deepseek-harness-proxy.service

          ok=0
          for i in $(seq 1 45); do
            if systemctl is-active --quiet deepseek-harness.service && ss -lnt | grep -q '127.0.0.1:3080'; then
              ok=1; break
            fi
            sleep 2
          done

          echo "=== AFTER ==="
          systemctl show deepseek-harness.service --no-pager -p ActiveState -p SubState -p Result -p NRestarts -p ExecMainStatus || true
          systemctl show deepseek-harness-proxy.service --no-pager -p ActiveState -p SubState -p Result || true
          ss -lntp | grep -E ':(3080|3081)\b' || true
          curl -sSI --max-time 20 https://harness.flyaicrm.com/ | head -12 || true

          if [ "$ok" != 1 ]; then
            echo "=== FAILURE JOURNAL ==="
            journalctl -u deepseek-harness.service -n 120 --no-pager 2>&1 \
              | sed -E 's/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g' \
              | tail -120
            exit 42
          fi
          echo HARNESS_502_REPAIR_OK
          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/harness_repair_key
