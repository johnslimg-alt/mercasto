name: Temporary Route Inventory Refresh

on:
  push:
    branches:
      - feat/report-lifecycle-admin-transitions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/report-lifecycle-admin-transitions
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, pcntl
          coverage: none
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Export authoritative route inventory
        run: bash scripts/export-route-inventory.sh
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/route-inventory-generated.md docs/route-inventory-signatures.json
          if git diff --cached --quiet; then
            echo 'Route inventory already fresh.'
            exit 0
          fi
          git commit -m 'docs: refresh route inventory for report lifecycle'
          git push origin HEAD:feat/report-lifecycle-admin-transitions
