name: PR872 fresh review fix

on:
  push:
    branches:
      - feat/748-python-listing-moderation-contract
    paths:
      - .github/workflows/pr872-fresh-review-fix.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/748-python-listing-moderation-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-gateway/pyproject.toml
      - name: Apply deterministic fresh-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          contracts_path = Path('services/ai-gateway/mercasto_ai/contracts.py')
          contracts = contracts_path.read_text()
          contracts = replace_once(
              contracts,
              '''    source_description_chars: int | None = Field(default=None, ge=0)\n    images_base64: list[ListingImageBase64] = Field(default_factory=list, max_length=2)\n    source_image_count: int | None = Field(default=None, ge=0, le=10)\n''',
              '''    source_description_chars: int = Field(ge=0)\n    images_base64: list[ListingImageBase64] = Field(default_factory=list, max_length=2)\n    source_image_count: int = Field(ge=0, le=10)\n''',
              'required provenance fields',
          )
          contracts = replace_once(
              contracts,
              '''        if (\n            self.source_description_chars is not None\n            and self.source_description_chars < len(self.description)\n        ):\n''',
              '''        if self.source_description_chars < len(self.description):\n''',
              'description provenance validator',
          )
          contracts = replace_once(
              contracts,
              '''        if self.source_image_count is not None and self.source_image_count < len(self.images_base64):\n''',
              '''        if self.source_image_count < len(self.images_base64):\n''',
              'image provenance validator',
          )
          contracts = replace_once(
              contracts,
              '''    def effective_source_description_chars(self) -> int:\n        return self.source_description_chars or len(self.description)\n\n    @property\n    def effective_source_image_count(self) -> int:\n        return self.source_image_count if self.source_image_count is not None else len(self.images_base64)\n''',
              '''    def effective_source_description_chars(self) -> int:\n        return self.source_description_chars\n\n    @property\n    def effective_source_image_count(self) -> int:\n        return self.source_image_count\n''',
              'provenance accessors',
          )
          contracts_path.write_text(contracts)

          ollama_path = Path('services/ai-gateway/mercasto_ai/ollama.py')
          ollama = ollama_path.read_text()
          ollama = replace_once(
              ollama,
              '_LISTING_IMAGE_TOKEN_RESERVE = 2048\n',
              '''# Qwen3-VL visual tokens depend on decoded dimensions. Until preprocessing\n# supplies a proven visual-token cap, any image deliberately overflows the\n# estimator so the fitter omits it and the endpoint forces human review.\n_LISTING_UNPROVEN_IMAGE_TOKEN_RESERVE = _LISTING_NUM_CTX + 1\n''',
              'unproven visual token reserve',
          )
          ollama = replace_once(
              ollama,
              '        + len(images_base64) * _LISTING_IMAGE_TOKEN_RESERVE\n',
              '        + (_LISTING_UNPROVEN_IMAGE_TOKEN_RESERVE if images_base64 else 0)\n',
              'visual token estimate',
          )
          ollama_path.write_text(ollama)

          main_path = Path('services/ai-gateway/mercasto_ai/main.py')
          main = main_path.read_text()
          old_unicode = '''            if escape == ord("u"):\n                if index + 6 > len(body):\n                    raise _ListingJsonShapeError("incomplete unicode escape")\n                if any(chr(value) not in "0123456789abcdefABCDEF" for value in body[index + 2:index + 6]):\n                    raise _ListingJsonShapeError("invalid unicode escape")\n                index += 6\n                continue\n'''
          new_unicode = '''            if escape == ord("u"):\n                if index + 6 > len(body):\n                    raise _ListingJsonShapeError("incomplete unicode escape")\n                hex_digits = body[index + 2:index + 6]\n                if any(chr(value) not in "0123456789abcdefABCDEF" for value in hex_digits):\n                    raise _ListingJsonShapeError("invalid unicode escape")\n                code_unit = int(hex_digits.decode("ascii"), 16)\n                if 0xD800 <= code_unit <= 0xDBFF:\n                    pair_index = index + 6\n                    if pair_index + 6 > len(body) or body[pair_index:pair_index + 2] != b"\\\\u":\n                        raise _ListingJsonShapeError("unpaired high unicode surrogate")\n                    low_digits = body[pair_index + 2:pair_index + 6]\n                    if any(chr(value) not in "0123456789abcdefABCDEF" for value in low_digits):\n                        raise _ListingJsonShapeError("invalid unicode surrogate escape")\n                    low_unit = int(low_digits.decode("ascii"), 16)\n                    if not 0xDC00 <= low_unit <= 0xDFFF:\n                        raise _ListingJsonShapeError("unpaired high unicode surrogate")\n                    index = pair_index + 6\n                    continue\n                if 0xDC00 <= code_unit <= 0xDFFF:\n                    raise _ListingJsonShapeError("unpaired low unicode surrogate")\n                index += 6\n                continue\n'''
          main = replace_once(main, old_unicode, new_unicode, 'unicode surrogate validation')
          main = replace_once(
              main,
              '''    while model_policy_signals and not fits(""):\n        model_policy_signals.pop()\n    while model_images and not fits(""):\n        model_images.pop()\n''',
              '''    # Images are removed first while visual-token cost is unproven; their\n    # omission is surfaced below and always forces manual_review.\n    while model_images and not fits(""):\n        model_images.pop()\n    while model_policy_signals and not fits(""):\n        model_policy_signals.pop()\n''',
              'fail-closed image fitting order',
          )
          main_path.write_text(main)

          gateway_test_path = Path('services/ai-gateway/tests/test_listing_gateway.py')
          gateway_test = gateway_test_path.read_text()
          old_helper = '''def listing_payload(**overrides: object) -> dict[str, object]:\n    payload: dict[str, object] = {\n        "title": "Artículo de prueba",\n        "description": "Descripción sintética para contrato de moderación.",\n        "images_base64": [encoded_image("one"), encoded_image("two")],\n        "policy_signals": CANONICAL_SIGNALS,\n    }\n    payload.update(overrides)\n    return payload\n'''
          new_helper = '''def listing_payload(**overrides: object) -> dict[str, object]:\n    title = overrides.pop("title", "Artículo de prueba")\n    description = overrides.pop(\n        "description", "Descripción sintética para contrato de moderación."\n    )\n    images = overrides.pop("images_base64", [])\n    payload: dict[str, object] = {\n        "title": title,\n        "description": description,\n        "source_description_chars": len(description) if isinstance(description, str) else 0,\n        "images_base64": images,\n        "source_image_count": len(images) if isinstance(images, list) else 0,\n        "policy_signals": CANONICAL_SIGNALS,\n    }\n    payload.update(overrides)\n    return payload\n'''
          gateway_test = replace_once(gateway_test, old_helper, new_helper, 'test payload provenance helper')
          gateway_test = replace_once(
              gateway_test,
              'def test_listing_gateway_passes_text_multiple_images_and_canonical_policy_vocabulary(\n',
              'def test_listing_gateway_accepts_images_but_defers_unbounded_visual_context_to_human(\n',
              'image behavior test name',
          )
          gateway_test = replace_once(
              gateway_test,
              '''    assert body["decision"] == "approved"\n    assert body["flags"] == ["weapon"]\n''',
              '''    assert body["decision"] == "manual_review"\n    assert body["approved"] is False\n    assert body["flags"] == ["weapon"]\n''',
              'image behavior decision',
          )
          gateway_test = replace_once(
              gateway_test,
              '''    assert body["input_image_count"] == 2\n    assert body["model_image_count"] == 2\n    assert body["images_omitted"] == 0\n''',
              '''    assert body["input_image_count"] == 2\n    assert body["model_image_count"] == 0\n    assert body["images_omitted"] == 2\n''',
              'image behavior metadata',
          )
          gateway_test = replace_once(
              gateway_test,
              '''    assert fake.calls == [\n        ("Producto permitido", "Texto del anuncio.", images, ["weapon", "fraud"])\n    ]\n''',
              '''    assert fake.calls == [\n        ("Producto permitido", "Texto del anuncio.", [], ["weapon", "fraud"])\n    ]\n''',
              'image behavior model call',
          )
          gateway_test = replace_once(
              gateway_test,
              '''    assert body["model_image_count"] <= 2\n    assert body["images_omitted"] == 10 - body["model_image_count"]\n''',
              '''    assert body["model_image_count"] == 0\n    assert body["images_omitted"] == 10\n''',
              'full listing image metadata',
          )
          gateway_test = replace_once(
              gateway_test,
              '''    assert fake.calls[0][2] == images[: body["model_image_count"]]\n''',
              '''    assert fake.calls[0][2] == []\n''',
              'full listing model images',
          )
          gateway_test += '''\n\ndef test_listing_gateway_requires_explicit_source_provenance(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    client, fake = authenticated_client(\n        monkeypatch,\n        ModelVerdict(decision="approved", reason="unused", confidence=0.99, flags=[]),\n    )\n    payload = listing_payload()\n    payload.pop("source_description_chars")\n    payload.pop("source_image_count")\n\n    response = client.post(\n        "/v1/moderation/listing",\n        headers=auth_headers(),\n        json=payload,\n    )\n\n    assert response.status_code == 422\n    assert fake.calls == []\n\n\ndef test_listing_context_estimator_never_treats_unbounded_images_as_complete() -> None:\n    assert (\n        estimate_listing_context_tokens(\n            "fixture",\n            "safe",\n            [encoded_image("visual")],\n            ["fraud"],\n        )\n        > 8192\n    )\n'''
          gateway_test_path.write_text(gateway_test)

          boundary_path = Path('services/ai-gateway/tests/test_listing_request_boundary.py')
          boundary = boundary_path.read_text()
          boundary = replace_once(
              boundary,
              '''        "description": "safe",\n        "images_base64": [],\n        "policy_signals": [{} for _ in range(10_000)],\n''',
              '''        "description": "safe",\n        "source_description_chars": 4,\n        "images_base64": [],\n        "source_image_count": 0,\n        "policy_signals": [{} for _ in range(10_000)],\n''',
              'expansive shape provenance',
          )
          boundary += '''\n\n@pytest.mark.parametrize("escaped_surrogate", [b"\\\\ud800", b"\\\\udc00"])\ndef test_real_app_rejects_unpaired_unicode_surrogates_before_utf8_estimation(\n    monkeypatch: pytest.MonkeyPatch,\n    escaped_surrogate: bytes,\n) -> None:\n    monkeypatch.setenv("MERCASTO_AI_INTERNAL_TOKEN", "contract-secret")\n    client = TestClient(app)\n    encoded = (\n        b'{"title":"fixture","description":"'\n        + escaped_surrogate\n        + b'","source_description_chars":1,"images_base64":[],"source_image_count":0,'\n        + b'"policy_signals":["fraud"]}'\n    )\n\n    response = client.post(\n        "/v1/moderation/listing",\n        content=encoded,\n        headers={\n            "X-Mercasto-Internal-Token": "contract-secret",\n            "Content-Type": "application/json",\n        },\n    )\n\n    assert response.status_code == 422\n    assert response.json()["detail"] == "Listing moderation request has invalid JSON structure."\n'''
          boundary_path.write_text(boundary)
          PY
      - name: Install
        run: python -m pip install -e 'services/ai-gateway[test]'
      - name: Compile
        run: python -m compileall -q services/ai-gateway/mercasto_ai
      - name: Lint
        run: ruff check services/ai-gateway
      - name: Test
        run: pytest -q services/ai-gateway/tests
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'johnslimg-alt'
          git config user.email 'johnslimg@gmail.com'
          git add services/ai-gateway/mercasto_ai/contracts.py \
                  services/ai-gateway/mercasto_ai/main.py \
                  services/ai-gateway/mercasto_ai/ollama.py \
                  services/ai-gateway/tests/test_listing_gateway.py \
                  services/ai-gateway/tests/test_listing_request_boundary.py
          git commit -m 'fix: fail closed on incomplete listing moderation context'
          git push origin HEAD:feat/748-python-listing-moderation-contract
