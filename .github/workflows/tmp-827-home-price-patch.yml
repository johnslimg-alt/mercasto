name: Temporary 827 Home Price Patch

on:
  push:
    branches:
      - fix/827-home-price-locale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'johnslimg-alt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact HomeScreen locale formatting patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/screens/HomeScreen.jsx')
          source = path.read_text()
          replacements = [
              (
                  "import { formatNumber } from '../../utils/localeFormat';",
                  "import { formatMXN, formatNumber } from '../../utils/localeFormat';",
              ),
              (
                  "const price = Number(ad.price || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });",
                  "const price = formatMXN(ad.price || 0, lang, { minimumFractionDigits: 0, maximumFractionDigits: 0 });",
              ),
              (
                  "${Number(job.price || 0).toLocaleString()} MXN",
                  "${formatNumber(job.price || 0, lang)} MXN",
              ),
              (
                  "${Number(srv.price || 0).toLocaleString()} MXN",
                  "${formatNumber(srv.price || 0, lang)} MXN",
              ),
              (
                  "${Number(car.price || 0).toLocaleString()} MXN",
                  "${formatNumber(car.price || 0, lang)} MXN",
              ),
              (
                  "${Number(ad.price || 0).toLocaleString()} <span",
                  "${formatNumber(ad.price || 0, lang)} <span",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Run targeted regression contract
        run: node --test tests/home-screen-price-localization.test.mjs
      - name: Commit exact product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/screens/HomeScreen.jsx
          git diff --cached --check
          git commit -m 'fix: format HomeScreen prices with active locale'
          git push origin HEAD:fix/827-home-price-locale
