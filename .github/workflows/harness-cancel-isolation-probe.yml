name: Cancel Harness Isolation Probe

on:
  push:
    branches:
      - ops/harness-deepseek-direct-20260924
    paths:
      - .github/workflows/harness-cancel-isolation-probe.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stalled isolated probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/resp -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/36057261871/cancel")"
          echo "CANCEL_HTTP=$code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            cat /tmp/resp
            exit 1
          fi
