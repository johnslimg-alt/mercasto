name: Reef MCP Agent Push Install

on:
  push:
    branches:
      - ops/reef-mcp-install-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: reef-mcp-agent-push-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install private Reef MCP agent
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/reef-mcp-agent/install.sh
          bash -n ops/reef-mcp-agent/reef-mcp-gate
          node --check ops/reef-mcp-agent/server.mjs
          bash ops/reef-mcp-agent/install.sh
      - name: Report result
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 832,
              body: `REEF_MCP_PUSH_INSTALL_RESULT\nstatus=${status}\nrun_id=${context.runId}\nrun=${runUrl}`
            });
