name: RDC Recovery Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  diagnose:
    if: >-
      github.actor == 'johnslimg-alt' &&
      github.event.issue.title == 'RDC_RECOVERY_DIAGNOSTIC'
    name: Diagnose Desktop Commander on VPS
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 5
    steps:
      - name: Inspect RDC without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/rdc-diagnostic.txt
          : > "$report"
          echo "HOST=$(hostname)" >> "$report"
          echo "RUNNER_USER=$(whoami)" >> "$report"

          unit=""
          for candidate in desktop-commander.service desktop-commander-remote.service; do
            if systemctl cat "$candidate" >/dev/null 2>&1; then
              unit="$candidate"
              break
            fi
          done

          if [ -n "$unit" ]; then
            echo "UNIT=$unit" >> "$report"
            systemctl show "$unit" --no-pager \
              -p LoadState -p ActiveState -p SubState -p MainPID -p NRestarts -p User >> "$report" || true
            log="$(journalctl -u "$unit" -n 500 --no-pager 2>/dev/null || true)"
            printf 'ERR_NOT_CONNECTED=%s\n' "$(printf '%s' "$log" | grep -icF 'Not connected' || true)" >> "$report"
            printf 'ERR_TERMINATED=%s\n' "$(printf '%s' "$log" | grep -icF 'terminated' || true)" >> "$report"
            printf 'ERR_FETCH_FAILED=%s\n' "$(printf '%s' "$log" | grep -icF 'fetch failed' || true)" >> "$report"
            printf 'ERR_SUBSCRIPTION_TIMEOUT=%s\n' "$(printf '%s' "$log" | grep -icF 'subscription timed out' || true)" >> "$report"
            printf 'ERR_PRESENCE_TIMEOUT=%s\n' "$(printf '%s' "$log" | grep -icF 'Presence track not acknowledged' || true)" >> "$report"
            printf 'ERR_CHANNEL=%s\n' "$(printf '%s' "$log" | grep -icF 'Channel error' || true)" >> "$report"
            printf 'READY_MARKERS=%s\n' "$(printf '%s' "$log" | grep -icE 'Device ready|Channel subscribed' || true)" >> "$report"
          else
            echo "UNIT=none" >> "$report"
          fi

          pid_count="$(pgrep -fc '@wonderwhy-er/desktop-commander.*remote|desktop-commander.*remote' || true)"
          echo "REMOTE_PROCESS_COUNT=$pid_count" >> "$report"

          config_count=0
          for home in /root /home/*; do
            if [ -f "$home/.desktop-commander-device/device.json" ]; then
              config_count=$((config_count + 1))
            fi
          done
          echo "PERSISTED_DEVICE_CONFIGS=$config_count" >> "$report"

          cat "$report"

      - name: Return safe diagnostic result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = 'RDC diagnostic did not produce a report.';
            try {
              body = fs.readFileSync('/tmp/rdc-diagnostic.txt', 'utf8');
            } catch (_) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `RDC_DIAGNOSTIC_RESULT\n\n\`\`\`text\n${body}\n\`\`\``
            });
