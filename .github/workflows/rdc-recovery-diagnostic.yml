name: RDC Recovery Diagnostic

on:
  workflow_run:
    workflows:
      - Autonomous Server Live Gate
    types:
      - completed

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: rdc-recovery-one-shot
  cancel-in-progress: false

jobs:
  recover:
    name: Recover Desktop Commander on VPS
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 5
    steps:
      - name: Inspect and restart exact RDC systemd service
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/rdc-recovery-report.txt
          : > "$report"
          echo "HOST=$(hostname)" >> "$report"
          echo "RUNNER_USER=$(whoami)" >> "$report"

          mapfile -t units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null \
              | awk '{print $1}' \
              | grep -Ei 'desktop[-_.]?commander|desktop.*commander|commander.*desktop' \
              || true
          )
          echo "MATCHING_UNITS=${#units[@]}" >> "$report"
          for unit in "${units[@]}"; do
            echo "UNIT=$unit" >> "$report"
            systemctl show "$unit" --no-pager -p LoadState -p ActiveState -p SubState -p MainPID -p NRestarts -p User >> "$report" || true
          done

          if [ "${#units[@]}" -eq 1 ]; then
            unit="${units[0]}"
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart "$unit"
              restart_result=success-root
            elif sudo -n systemctl restart "$unit" >/dev/null 2>&1; then
              restart_result=success-sudo
            else
              restart_result=permission-denied
            fi
            echo "RESTART_RESULT=$restart_result" >> "$report"
            sleep 3
            systemctl show "$unit" --no-pager -p ActiveState -p SubState -p MainPID -p NRestarts >> "$report" || true
          elif [ "${#units[@]}" -eq 0 ]; then
            echo "RESTART_RESULT=no-exact-systemd-unit" >> "$report"
          else
            echo "RESTART_RESULT=ambiguous-units-not-touched" >> "$report"
          fi

          remote_count="$(pgrep -fc '@wonderwhy-er/desktop-commander.*remote|desktop-commander.*remote' || true)"
          echo "REMOTE_PROCESS_COUNT=$remote_count" >> "$report"
          cat "$report"

      - name: Report fixed recovery result
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = 'RDC recovery did not produce a report.';
            try { body = fs.readFileSync('/tmp/rdc-recovery-report.txt', 'utf8'); } catch (_) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 831,
              body: `RDC_RECOVERY_RESULT\n\n\`\`\`text\n${body}\n\`\`\``
            });
