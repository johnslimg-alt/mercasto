name: Hosted Storage Attribution

# Out-of-band, read-only filesystem attribution for shared-host pressure.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-storage-attribution
  cancel-in-progress: false

jobs:
  diagnose:
    name: Attribute VPS storage out of band
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1038 &&
       github.actor == 'johnslimg-alt' &&
       github.event.comment.body == 'RUN:hosted_storage_status')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate diagnostics secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/mercasto_storage_status_key
          chmod 600 ~/.ssh/mercasto_storage_status_key
          scan_file="$(mktemp)"
          trap 'rm -f "$scan_file"' EXIT
          for attempt in 1 2 3 4; do
            : > "$scan_file"
            if ssh-keyscan -T 5 -H "$SERVER_HOST" > "$scan_file" 2>/dev/null && [ -s "$scan_file" ]; then
              cat "$scan_file" >> ~/.ssh/known_hosts
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Unable to read the VPS SSH host key after $attempt attempts." >&2
              exit 1
            fi
            sleep 2
          done

      - name: Read storage attribution
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mercasto_storage_status_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -u

          lowio_timeout() {
            local limit="$1"
            shift
            if command -v ionice >/dev/null 2>&1; then
              timeout "${limit}s" ionice -c3 nice -n 19 "$@" 2>/dev/null
            else
              timeout "${limit}s" nice -n 19 "$@" 2>/dev/null
            fi
          }

          probe_du() {
            local label="$1"
            local limit="$2"
            shift 2
            local tmp rc
            tmp="$(mktemp)"
            echo "--- ${label} ---"
            lowio_timeout "$limit" du -x -B1M "$@" >"$tmp"
            rc=$?
            cat "$tmp"
            rm -f "$tmp"
            case "$rc" in
              0) echo 'probe_status=success' ;;
              124|137) echo "probe_status=timeout limit=${limit}s" ;;
              *) echo "probe_status=error rc=${rc}" ;;
            esac
            return 0
          }

          probe_existing_du() {
            local path="$1"
            local limit="$2"
            if [ -e "$path" ]; then
              probe_du "$path" "$limit" -s "$path"
            else
              echo "--- ${path} ---"
              echo 'probe_status=absent'
            fi
          }

          echo '=== HOST ==='
          hostname
          uptime

          echo '=== ROOT FILESYSTEM ==='
          df -hP /
          df -Pk /
          if [ -f /var/www/mercasto/scripts/host-storage-headroom-gate.sh ]; then
            bash /var/www/mercasto/scripts/host-storage-headroom-gate.sh || true
          fi

          # Keep each expensive tree independent. A slow Docker tree must not hide
          # sizes from unrelated top-level paths, and partial output survives a timeout.
          echo '=== ROOT CHILDREN (MiB) ==='
          probe_du '/root depth=1' 90 -d1 /root

          echo '=== VAR CHILDREN (MiB) ==='
          probe_du '/var depth=1' 90 -d1 /var

          echo '=== FOCUSED SAME-FILESYSTEM PROBES (MiB) ==='
          probe_existing_du /var/lib/docker 60
          probe_existing_du /var/lib/docker/buildkit 45
          probe_existing_du /var/lib/docker/overlay2 45
          probe_existing_du /var/lib/docker/volumes 45
          probe_existing_du /var/www 45
          probe_existing_du /var/log 30
          probe_existing_du /var/cache 30
          probe_existing_du /usr 45
          probe_existing_du /opt 30
          probe_existing_du /srv 30
          probe_existing_du /home 30
          probe_existing_du /tmp 30
          probe_existing_du /root/.cache 30
          probe_existing_du /root/.local 30
          probe_existing_du /root/.npm 30
          probe_existing_du /root/.ollama 30

          echo '=== AUTOMATION STACK (MiB, same filesystem) ==='
          if [ -d /root/automation-stack ]; then
            probe_du '/root/automation-stack depth=1' 60 -d1 /root/automation-stack
          else
            echo '/root/automation-stack is absent'
          fi

          echo '=== AUTOMATION BACKUPS (MiB, depth 2) ==='
          if [ -d /root/automation-stack/backups ]; then
            probe_du '/root/automation-stack/backups depth=2' 60 -d2 /root/automation-stack/backups
          else
            echo '/root/automation-stack/backups is absent'
          fi

          echo '=== DOCKER STORAGE SUMMARY ==='
          timeout 30s docker system df || echo 'docker_system_df_status=timeout_or_error'

          echo '=== DOCKER BUILDER SUMMARY ==='
          timeout 60s docker builder du 2>/dev/null | tail -80 || echo 'docker_builder_du_status=timeout_or_error'
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/mercasto_storage_status_key

      - name: Report diagnostics result
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(printf 'HOSTED_STORAGE_STATUS_RESULT\nstatus=%s\nrun_id=%s\nrun=%s' \
            "$JOB_STATUS" "$GITHUB_RUN_ID" "$RUN_URL")"
          gh api "repos/$REPO/issues/1038/comments" -f body="$body"
