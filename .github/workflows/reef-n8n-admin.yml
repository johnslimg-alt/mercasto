name: Reef n8n admin diagnostic

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Check admin channel
        shell: bash
        run: |
          set +e
          echo '=== ID ==='
          whoami
          id
          echo '=== SUDO ==='
          sudo -n true; echo "sudo_noninteractive=$?"
          echo '=== DOCKER ==='
          docker ps --format '{{.Names}} {{.Status}}' | head -20
          echo '=== REEF ACCESS ==='
          sudo -n test -r /root/reef-crm/ops/n8n/workflows/reef-whatsapp-workflow.json; echo "reef_read=$?"
          sudo -n test -r /root/automation-stack/n8n_data/database.sqlite; echo "n8n_db_read=$?"
          echo '=== HEALTH ==='
          curl -fsS http://127.0.0.1:3100/api/health || true
          echo
          curl -fsS http://127.0.0.1:5678/healthz || true
          echo
