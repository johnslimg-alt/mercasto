name: Reef n8n admin diagnostic

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect n8n network
        shell: bash
        run: |
          set -e
          echo '=== N8N NETWORKS ==='
          docker inspect n8n --format '{{json .NetworkSettings.Networks}}'
          echo '=== HOST ROUTES ==='
          ip -4 addr show | grep -E '^[0-9]+:|inet ' | head -80
          echo '=== N8N ROUTE ==='
          docker exec n8n sh -lc 'ip route 2>/dev/null || cat /proc/net/route'
          echo '=== CURRENT NEMOTRON LISTENER ==='
          ss -lntp 2>/dev/null | grep 11435 || true
          echo '=== NEMOTRON HEALTH HOST ==='
          curl -fsS --max-time 3 http://127.0.0.1:11435/health || true
          echo
