name: Reef source persistence

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  persist:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Commit only Reef workflow source
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=/root/reef-crm
          FILE=ops/n8n/workflows/reef-whatsapp-workflow.json
          cd "$REPO"
          echo '=== STATUS BEFORE ==='
          sudo -n git status --short | head -80
          sudo -n git diff -- "$FILE" | grep -E '^[-+].*(reef-nemotron|nemotron-local|generativelanguage|gpt-oss|glm-5)' | head -80 || true
          BASE=$(sudo -n git rev-parse --abbrev-ref HEAD)
          BR=fix/local-nemotron-ai-20260829
          if sudo -n git show-ref --verify --quiet "refs/heads/$BR"; then
            sudo -n git checkout "$BR"
          else
            sudo -n git checkout -b "$BR"
          fi
          sudo -n git add -- "$FILE"
          if sudo -n git diff --cached --quiet; then
            echo 'nothing_to_commit=yes'
          else
            sudo -n git -c user.name='Reef Ops' -c user.email='ops@reefmotors.com' commit -m 'Route Reef text AI to local Nemotron'
          fi
          sudo -n git push -u origin "$BR"
          echo "base_branch=$BASE"
          echo "pushed_branch=$BR"
          echo '=== COMMITTED FILES ==='
          sudo -n git show --name-only --format='%H %s' HEAD | head -20
