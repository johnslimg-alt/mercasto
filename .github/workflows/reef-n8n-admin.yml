name: Reef n8n admin diagnostic

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Verify local AI and n8n workflow CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== NEMOTRON CONTAINER ==='
          docker ps --filter name=reef-nemotron --format '{{.Names}} {{.Status}}'
          echo '=== CHAT ==='
          docker exec n8n node -e "(async()=>{const body={model:'nemotron-local',messages:[{role:'system',content:'Return JSON only with key ok boolean.'},{role:'user',content:'Respond true.'}],temperature:0,max_tokens:40,response_format:{type:'json_object'}};const r=await fetch('http://reef-nemotron:8080/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});console.log('status='+r.status);console.log(await r.text());if(!r.ok)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)})"
          echo '=== N8N VERSION ==='
          docker exec n8n n8n --version
          echo '=== N8N COMMANDS ==='
          docker exec n8n n8n --help | grep -E 'export:workflow|import:workflow|publish|update:workflow' || true
          echo '=== EXPORT HELP ==='
          docker exec n8n n8n export:workflow --help | head -80
          echo '=== IMPORT HELP ==='
          docker exec n8n n8n import:workflow --help | head -80
