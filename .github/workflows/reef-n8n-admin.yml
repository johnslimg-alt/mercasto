name: Reef n8n admin diagnostic

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Allow internal n8n to Nemotron and test
        shell: bash
        run: |
          set -e
          echo '=== UFW BEFORE ==='
          sudo -n ufw status verbose || true
          sudo -n ufw allow in on br-7c8bb24f2178 from 172.19.0.0/16 to 172.19.0.1 port 11435 proto tcp || true
          echo '=== TEST HEALTH ==='
          docker exec n8n node -e "fetch('http://172.19.0.1:11435/health').then(async r=>{console.log(r.status);console.log(await r.text())}).catch(e=>{console.error(e);process.exit(1)})"
          echo '=== TEST JSON CHAT ==='
          docker exec n8n node - <<'NODE'
          const body={model:'nemotron-local',messages:[{role:'system',content:'Return JSON only with key ok boolean.'},{role:'user',content:'Respond true.'}],temperature:0,max_tokens:40,response_format:{type:'json_object'}};
          fetch('http://172.19.0.1:11435/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
            .then(async r=>{console.log('status='+r.status); console.log(await r.text())})
            .catch(e=>{console.error(e);process.exit(1)});
          NODE
