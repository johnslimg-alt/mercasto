name: Ephemeral Transient Refactor Prepare

on:
  push:
    branches:
      - ops/prepare-transient-921
    paths:
      - .github/workflows/ephemeral-prepare-transient-921.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rebase prepared transient slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0672ac590119a30c79eb71466d20f10bc5a74402"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch /var/www/mercasto refs/heads/refactor/app-transient-modal-state:refs/remotes/local/transient
          git switch -c refactor/app-transient-modal-state-v2
          git cherry-pick feafa573275e4079e24c6dd5422bda74faa75675

      - name: Verify transient slice
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tests/*.test.mjs
          npm run check:static-safety
          npm run check:recovery
          npm run build
          npx eslint src/App.jsx src/app/useTransientModalState.js tests/app-transient-modal-state-extraction.test.mjs

      - name: Push review branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/refactor/app-transient-modal-state-v2
          echo "TRANSIENT_REBASE_PREP=PASS head=$(git rev-parse HEAD)"
