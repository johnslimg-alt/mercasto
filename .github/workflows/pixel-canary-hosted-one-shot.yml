name: One-shot Pixel Canary cleanup verify

on:
  push:
    branches:
      - ops/pixel-canary-ssh-20260926

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate SSH secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"

      - name: Install SSH key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/pixel_canary_cleanup_key
          chmod 600 ~/.ssh/pixel_canary_cleanup_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Remove ephemeral handoff keys and verify Harness config
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pixel_canary_cleanup_key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          HANDOFF_DIR=/root/.dsh/.chatgpt-pixel-canary
          rm -f \
            "$HANDOFF_DIR/ephemeral-rsa.pem" \
            "$HANDOFF_DIR/ephemeral-rsa.pub.pem" \
            "$HANDOFF_DIR/pixel-canary.cipher" \
            "$HANDOFF_DIR/pixel-canary.key"

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          home = Path('/root/.dsh')
          settings = yaml.safe_load((home / 'settings.yaml').read_text()) or {}
          creds = yaml.safe_load((home / '.credentials.yaml').read_text()) or {}

          refs = creds.get('refs') or {}
          assert bool(refs.get('AI_GATEWAY_API_KEY'))

          route = (((settings.get('llm-pi-ai') or {}).get('providers') or {}).get('vercel-ai-gateway') or {})
          assert route.get('apiKeyEnv') == 'AI_GATEWAY_API_KEY'
          assert route.get('api') == 'openai-completions'
          assert route.get('baseURL') == 'https://ai-gateway.vercel.sh/v1'
          assert any(isinstance(m, dict) and m.get('id') == 'stealth/pixel-canary' for m in (route.get('models') or []))
          assert settings.get('agent-default-model') == {'provider': 'openai', 'model': 'gpt-6-luna'}

          print('pixel_canary_credential_ref=present')
          print('pixel_canary_provider=vercel-ai-gateway')
          print('pixel_canary_model=stealth/pixel-canary')
          print('default_preserved=openai/gpt-6-luna')
          PY

          test ! -e "$HANDOFF_DIR/ephemeral-rsa.pem"
          test ! -e "$HANDOFF_DIR/ephemeral-rsa.pub.pem"
          test ! -e "$HANDOFF_DIR/pixel-canary.cipher"
          test ! -e "$HANDOFF_DIR/pixel-canary.key"

          systemctl is-active --quiet deepseek-harness.service
          systemctl is-active --quiet deepseek-harness-proxy.service

          CODE="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 20 https://harness.flyaicrm.com/ || true)"
          echo "harness_public_http=$CODE"
          case "$CODE" in
            200|302|401|403) ;;
            *) echo "Unexpected Harness public HTTP status: $CODE" >&2; exit 68 ;;
          esac

          echo "PIXEL_CANARY_CONFIG_INSTALLED_PENDING_VERCEL_PAYMENT_METHOD"
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/pixel_canary_cleanup_key
