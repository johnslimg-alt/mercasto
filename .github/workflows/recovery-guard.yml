name: Recovery Guard

on:
  pull_request:
    branches:
      - main
    paths:
      # The guard asserts source text in these trees. Keep them whole-tree and
      # coarse: a file-scoped list is how backend/app/Http/Controllers/Api/AdController.php
      # ended up asserted by a guard that never ran when that controller changed,
      # letting the 2026-08 catalog P0 sit undetected. `backend/**` (not
      # `backend/app/**`) because the guard also asserts backend tests and can
      # grow new backend subjects at any time -- PR #1131 added an assertion on
      # backend/tests/Feature/CatalogRealInventoryRankingTest.php, which a
      # narrower list silently failed to trigger on.
      #
      # `scripts/**` for the same reason in the other direction: check:gate-integrity
      # audits every gate script, so a change to ANY gate (for example
      # scripts/location-search-gate.sh) must re-run the integrity checker.
      # Listing gate scripts one by one is how a gate-only PR could reintroduce a
      # dead-code assertion with CI still green.
      #
      # scripts/gate-integrity-check.mjs fails CI if this list stops covering
      # everything the guard reads.
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'scripts/**'
      - 'tests/gate-integrity-contract.test.mjs'
      - '.github/workflows/emergency-container-frontend-patch.yml'
      - '.github/workflows/emergency-ssh-frontend-deploy.yml'
      - '.github/workflows/recovery-guard.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run recovery guard checks
        run: npm run check:recovery
      - name: Run gate integrity checks
        run: npm run check:gate-integrity
      # The negative controls prove the checker can actually fail. Running the
      # checker alone against a healthy repository cannot catch a change that
      # makes one of its checks always pass, so the contract tests must run
      # wherever the checker itself is in scope.
      - name: Run gate integrity contract tests
        run: node --test tests/gate-integrity-contract.test.mjs
