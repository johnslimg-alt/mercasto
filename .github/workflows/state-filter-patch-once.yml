name: Patch state filter compatibility once

on:
  push:
    branches:
      - fix/state-filter-location-fallback
    paths:
      - .github/workflows/state-filter-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'ops: patch state filter compatibility once')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/state-filter-location-fallback
          fetch-depth: 0
      - name: Patch legacy state filtering and regression test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/app/Http/Controllers/Api/AdController.php')
          s=p.read_text()
          old="""        if ($request->filled('state')) {
              $state = trim((string) $request->state);

              if ($state !== '') {
                  $query->whereRaw('state ILIKE ?', [$state]);
              }
          }
          """
          new="""        if ($request->filled('state')) {
              $state = trim((string) $request->state);

              if ($state !== '') {
                  $locationLike = '%' . $state . '%';
                  $query->where(function ($q) use ($state, $locationLike) {
                      $q->whereRaw('state ILIKE ?', [$state])
                          ->orWhereRaw('location ILIKE ?', [$locationLike]);
                  });
              }
          }
          """
          if old not in s:
              raise SystemExit('target state filter block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('backend/tests/Feature/AdIndexSearchTest.php')
          s=p.read_text()
          needle="""    public function test_similar_ads_falls_back_to_category_without_a_canonical_vector(): void
          """
          test="""    public function test_state_filter_falls_back_to_legacy_combined_location(): void
              {
                  Http::preventStrayRequests();

                  $legacy = $this->activeAd('Bicicleta en Boca del Río', 'Referencia editorial con ubicación heredada.');
                  $legacy->forceFill(['location' => 'Boca del Río, Veracruz', 'state' => null, 'city' => null])->saveQuietly();

                  $other = $this->activeAd('Bicicleta en Guadalajara', 'Referencia editorial en otro estado.');
                  $other->forceFill(['location' => 'Guadalajara, Jalisco', 'state' => null, 'city' => null])->saveQuietly();

                  $response = $this->getJson('/api/ads?state=Veracruz');

                  $response->assertOk()
                      ->assertJsonPath('total', 1)
                      ->assertJsonPath('data.0.id', $legacy->id);
              }

          """
          if needle not in s:
              raise SystemExit('test insertion point not found')
          p.write_text(s.replace(needle,test+needle,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/Http/Controllers/Api/AdController.php backend/tests/Feature/AdIndexSearchTest.php
          git commit -m 'fix: keep state filter compatible with legacy locations'
          git push origin HEAD:fix/state-filter-location-fallback
