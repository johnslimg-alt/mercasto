name: Patch 873 deploy main branch

on:
  push:
    branches: [fix/873-deploy-main-branch]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: restore production checkout branch to main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/873-deploy-main-branch
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/patch-873-deploy-main-branch.py
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/server-operator.sh
          node --test scripts/server-operator-deploy-cache.test.mjs
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/server-operator-deploy-cache.test.mjs scripts/server-operator.sh "
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/server-operator.sh scripts/server-operator-deploy-cache.test.mjs
          git commit -m 'fix: restore production checkout branch to main'
          git push origin HEAD:fix/873-deploy-main-branch
