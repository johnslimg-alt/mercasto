name: Post-merge production verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Mercasto"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: post-merge-production-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live production after merge
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[llamacpp-benchmark]') && !contains(github.event.workflow_run.head_commit.message, '[lmstudio-benchmark]')) }}
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Find project directory
        run: |
          set -euo pipefail

          candidates=(
            "$HOME/mercasto"
            "/root/mercasto"
            "/var/www/mercasto"
            "/opt/mercasto"
            "/srv/mercasto"
          )

          project_dir=""
          for dir in "${candidates[@]}"; do
            if [ -f "$dir/docker-compose.yml" ] && [ -d "$dir/.git" ]; then
              project_dir="$dir"
              break
            fi
          done

          if [ -z "$project_dir" ]; then
            found=$(find /root /home /var/www /opt /srv "$HOME" -maxdepth 4 -name docker-compose.yml -print 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then
              project_dir=$(dirname "$found")
            fi
          fi

          if [ -z "$project_dir" ] || [ ! -d "$project_dir/.git" ]; then
            echo "Mercasto project directory was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using project directory: $project_dir"

      - name: Verify deployed main
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          fi

      - name: Verify compose and containers
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          docker compose -f docker-compose.yml -f docker-compose.override.yml config >/tmp/mercasto_post_merge_compose.yml
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps

      - name: Preload local AI model without user data
        run: |
          set -euo pipefail
          docker exec mercasto_backend_container php artisan ai:runtime-preload --timeout=90

      - name: Run quick production smoke suite
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run verify:quick

      - name: Verify local AI transport and configured model
        run: |
          set -euo pipefail
          docker exec mercasto_backend_container php artisan ai:runtime-readiness

      - name: Verify local AI inference without user data
        run: |
          set -euo pipefail
          docker exec mercasto_backend_container php artisan ai:runtime-check --timeout=45

      - name: Prime local AI vision path without user data
        continue-on-error: true
        run: |
          set -euo pipefail
          docker exec mercasto_backend_container php artisan ai:vision-runtime-check --timeout=120

      - name: Verify warmed local AI vision path without user data
        run: |
          set -euo pipefail
          docker exec mercasto_backend_container php artisan ai:vision-runtime-check --timeout=60

      - name: Dry-run catalog coverage maintenance
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          docker exec mercasto_backend_container php artisan ads:ensure-catalog-coverage --minimum=4 --dry-run

      - name: Audit catalog coverage
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          docker exec mercasto_backend_container php artisan ads:audit-catalog-coverage --minimum=4

      - name: Audit active content quality
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          docker exec mercasto_backend_container php artisan ads:audit-active-content-quality --limit-groups=12

      - name: Probe critical public endpoints
        run: |
          set -euo pipefail
          for url in \
            "https://mercasto.com/" \
            "https://mercasto.com/up" \
            "https://mercasto.com/api/categories" \
            "https://mercasto.com/api/ads?page=1" \
            "https://mercasto.com/horizon" \
            "https://mercasto.com/vendor/horizon"; do
            echo "== $url =="
            curl -fsSIL --max-time 30 "$url" || true
          done
