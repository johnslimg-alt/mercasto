name: Reef courier GPS recover temporary

on:
  push:
    branches: [ops/reef-n8n-admin]

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Publish validated courier GPS changes from current GitHub main
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=/root/reef-crm
          SNAP=/tmp/reef-courier-gps-snapshot
          CLONE=/tmp/reef-courier-gps-clone
          BR=fix/courier-native-gps-20260829
          test -f "$SNAP/src/components/courier-app.tsx"
          sudo -n rm -rf "$CLONE"
          REMOTE=$(sudo -n git -C "$REPO" remote get-url origin)
          sudo -n git clone "$REMOTE" "$CLONE" >/dev/null 2>&1
          sudo -n git -C "$CLONE" checkout -B "$BR" origin/main >/dev/null
          sudo -n cp "$SNAP/package.json" "$CLONE/package.json"
          sudo -n cp "$SNAP/package-lock.json" "$CLONE/package-lock.json"
          sudo -n cp "$SNAP/src/components/courier-app.tsx" "$CLONE/src/components/courier-app.tsx"
          sudo -n cp "$SNAP/scripts/courier-gps-pin-source-smoke.sh" "$CLONE/scripts/courier-gps-pin-source-smoke.sh"
          sudo -n rsync -a --delete "$SNAP/apps/courier-native/" "$CLONE/apps/courier-native/"
          sudo -n chown -R "$(id -u):$(id -g)" "$CLONE"
          cd "$CLONE"
          npm ci
          npm audit --omit=dev --audit-level=high
          (cd apps/courier-native && npm ci && npm audit --omit=dev --audit-level=high)
          npm run lint
          npm run build
          bash scripts/courier-gps-pin-source-smoke.sh
          bash scripts/mobile-apps-source-smoke.sh
          echo '--- CHANGED ---'
          git status --short
          git add package.json package-lock.json src/components/courier-app.tsx scripts/courier-gps-pin-source-smoke.sh apps/courier-native
          git -c user.name='Reef Ops' -c user.email='ops@reefmotors.com' commit -m 'Fix native courier GPS permissions and tracking'
          git push -u origin "$BR" --force >/dev/null
          git show --stat --oneline -1
