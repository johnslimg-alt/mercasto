name: DSH GLM Hosted Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsh-glm-hosted-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'ops/dsh-openrouter-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          for n in 1 2 3 4 5; do
            ssh-keyscan -T 5 -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke GLM Free through DSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key "root@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          S=/root/.dsh/settings.yaml
          SAVE=/tmp/dsh-settings-before-glm-smoke.yaml
          cp -a "$S" "$SAVE"

          cat >/tmp/glm-smoke.patch.yml <<'YAML'
          - id: llm-pi-ai
            config:
              providers:
                openrouter:
                  displayName: OpenRouter
                  apiKeyEnv: OPENROUTER_API_KEY
                  api: openai-completions
                  baseURL: https://openrouter.ai/api/v1
                  models:
                    - id: z-ai/glm-5.3-flash:free
                      name: GLM 5.3 Flash Free
                      contextWindow: 1048576
                      maxTokens: 131072
                      input: [text, image]
          YAML

          restore() {
            cp -a "$SAVE" "$S"
            rm -f "$SAVE" /tmp/glm-smoke.patch.yml /tmp/glm-smoke.out
          }
          trap restore EXIT

          python3 - "$S" <<'PY'
          import os,re,sys,tempfile
          from pathlib import Path
          p=Path(sys.argv[1]); text=p.read_text()
          block="agent-default-model:\n  provider: openrouter\n  model: z-ai/glm-5.3-flash:free\n"
          lines=text.splitlines(True); start=None
          for i,line in enumerate(lines):
              if re.match(r"^agent-default-model:\s*(?:#.*)?$",line.rstrip("\n")):
                  start=i; break
          if start is None:
              new=text.rstrip()+"\n\n"+block
          else:
              end=len(lines)
              for i in range(start+1,len(lines)):
                  if re.match(r"^[A-Za-z0-9_.-]+:\s*",lines[i]):
                      end=i; break
              new="".join(lines[:start])+block+"".join(lines[end:])
          fd,tmp=tempfile.mkstemp(dir=str(p.parent),prefix=".smoke.",text=True)
          with os.fdopen(fd,"w") as h:
              h.write(new); h.flush(); os.fsync(h.fileno())
          os.chmod(tmp,p.stat().st_mode & 0o777); os.replace(tmp,p)
          PY

          python3 - <<'PY'
          import yaml
          d=yaml.safe_load(open("/root/.dsh/.credentials.yaml")) or {}
          print("OPENROUTER_REF=" + ("YES" if "OPENROUTER_API_KEY" in (d.get("refs") or {}) else "NO"))
          PY

          set +e
          timeout 120s npx --yes @deepseek-ai/dsh@0.1.5-rc.1 --profile headless --patch /tmp/glm-smoke.patch.yml 'Reply with exactly: GLM_FREE_DSH_OK' >/tmp/glm-smoke.out 2>&1
          rc=$?
          set -e
          sed -E 's/(sk-[A-Za-z0-9_-]+|sk-or-v1-[A-Za-z0-9_-]+)/<redacted>/g' /tmp/glm-smoke.out | tail -100
          test "$rc" -eq 0
          grep -q GLM_FREE_DSH_OK /tmp/glm-smoke.out
          echo GLM_FREE_DSH_SMOKE_OK
          restore
          trap - EXIT
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
