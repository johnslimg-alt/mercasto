name: Temporary Harness MCP recovery

on:
  push:
    branches:
      - ops-harness-workspace-recover
    paths:
      - .github/workflows/harness-workspace-recover.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale self-hosted recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/36036826777/cancel || true

      - name: Probe Mercasto MCP tools
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          URL="https://mcp.mercasto.com/mcp"

          def parse_body(body):
              body=body.strip()
              if not body:
                  return None
              if body.startswith("{") or body.startswith("["):
                  return json.loads(body)
              events=[]
              for line in body.splitlines():
                  if line.startswith("data:"):
                      raw=line[5:].strip()
                      if raw and raw != "[DONE]":
                          try:
                              events.append(json.loads(raw))
                          except Exception:
                              pass
              return events[-1] if events else {"raw": body[:2000]}

          def post(payload, session=None, expect_response=True):
              data=json.dumps(payload).encode()
              headers={
                  "Content-Type":"application/json",
                  "Accept":"application/json, text/event-stream",
                  "User-Agent":"harness-recovery-probe/1.0",
              }
              if session:
                  headers["Mcp-Session-Id"]=session
              req=urllib.request.Request(URL,data=data,headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode("utf-8","replace")
                      sid=r.headers.get("Mcp-Session-Id") or session
                      print("HTTP",r.status,"SESSION",bool(sid),"TYPE",r.headers.get("Content-Type"))
                      return sid, parse_body(body)
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  print("HTTP_ERROR",e.code,body[:3000])
                  raise

          init={
              "jsonrpc":"2.0","id":1,"method":"initialize",
              "params":{
                  "protocolVersion":"2025-03-26",
                  "capabilities":{},
                  "clientInfo":{"name":"harness-recovery","version":"1.0"}
              }
          }
          sid,res=post(init)
          print("INIT",json.dumps(res,ensure_ascii=False)[:4000])
          if not sid:
              raise SystemExit("No MCP session id returned")

          post({"jsonrpc":"2.0","method":"notifications/initialized","params":{}},sid,False)
          sid,res=post({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},sid)
          print("TOOLS_JSON",json.dumps(res,ensure_ascii=False)[:30000])
          PY
