name: Manual server gate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only gate to run'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - verify_quick
          - security_smoke
          - seo_aeo_smoke
  workflow_run:
    workflows:
      - Production checks
    types:
      - completed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: manual-server-gate
  cancel-in-progress: false

jobs:
  server-gate:
    name: Manual server gate
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 45
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - name: Verify trusted production checkout
        shell: bash
        run: |
          set -euo pipefail
          test -d /var/www/mercasto/.git
          test -f /var/www/mercasto/scripts/server-operator.sh
          cd /var/www/mercasto
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          test -z "$(git status --short)"

      - name: Resolve read-only operation
        id: operation
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ github.event.inputs.operation || 'verify_quick' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_OPERATION}" in
            status|verify_quick|security_smoke|seo_aeo_smoke) ;;
            *) echo "Unsupported operation: ${REQUESTED_OPERATION}" >&2; exit 64 ;;
          esac
          echo "value=${REQUESTED_OPERATION}" >> "${GITHUB_OUTPUT}"

      - name: Run trusted server-resident gate
        shell: bash
        env:
          OPERATION: ${{ steps.operation.outputs.value }}
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          compose_env_file="$(mktemp)"
          trap 'rm -f "$compose_env_file"' EXIT
          DB_PASSWORD=ci \
          REDIS_PASSWORD=ci \
          GRAFANA_PASSWORD=ci \
          COMPOSE_ENV_FILE="$compose_env_file" \
            bash scripts/server-operator.sh "${OPERATION}"

      - name: Capture runner health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/server-operator.sh runner_health
