name: Production live gates

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-gates-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Runner policy for this workflow (measured 2026-09-13, Eng-36):
  #
  #   * A job belongs on the self-hosted runner only when it must read
  #     srv1526037-v2 itself: /var/www/mercasto, the live container via
  #     `docker exec`, or `sudo scripts/server-operator.sh`.
  #   * A job that only curls the public https://mercasto.com surface belongs on
  #     ubuntu-latest. This repository is public, so hosted minutes are free,
  #     while the single self-hosted runner is the merge queue's bottleneck: on
  #     2026-09-13 it accepted no job between 11:51Z and 15:54Z while required
  #     smokes sat queued (run 34756898405 was superseded after 2h35m queued
  #     without ever starting).
  #   * The original reason for pinning the SEO smoke on the runner (PR #399,
  #     2026-08-04) was that GitHub-hosted Azure runners timed out and never
  #     reached nginx while mercasto.com was a direct-origin A record. That
  #     condition no longer exists now that the Cloudflare edge is authoritative
  #     (docs/security/EDGE_WAF_DDOS_DECISION.md, 2026-08-07), so do not re-pin
  #     it without re-measuring.
  seo-aeo-smoke:
    name: SEO/AEO production smoke
    # Hosted on purpose: this job only curls the public Cloudflare edge and
    # reads nothing from srv1526037-v2. Executed from ubuntu-24.04 (egress
    # 132.196.7.16, cf-ray a3a828487ae61969-ORD) every assertion below passed
    # and the homepage returned HTTP/2 200 with the full security-header set.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout live SEO audit
        uses: actions/checkout@v7

      - name: Check public search signals
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "retrying SEO smoke command in 8s ($attempt/6): $*" >&2
              sleep 8
            done
            "$@"
          }
          tmp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/mercasto-seo-aeo.XXXXXX")"
          trap 'rm -rf "$tmp_dir"' EXIT
          retry curl -fsS --max-time 30 https://mercasto.com/ -o "$tmp_dir/home.html"
          retry curl -fsS --max-time 30 https://mercasto.com/sitemap.xml -o "$tmp_dir/sitemap.xml"
          retry curl -fsS --max-time 30 https://mercasto.com/robots.txt -o "$tmp_dir/robots.txt"
          grep -Eiq '<title[^>]*>[^<]{10,160}</title>' "$tmp_dir/home.html"
          grep -Eiq 'name="description"|property="og:description"' "$tmp_dir/home.html"
          grep -Eiq 'application/ld\+json|schema.org' "$tmp_dir/home.html"
          grep -Eiq '<urlset|<sitemapindex|<url>' "$tmp_dir/sitemap.xml"
          grep -Eiq 'Sitemap:|User-agent:' "$tmp_dir/robots.txt"

      - name: Audit route-specific live SEO
        env:
          BASE_URL: https://mercasto.com
          SEO_AUDIT_ATTEMPTS: "3"
        run: node scripts/seo-public-audit.mjs

  production-error-mode:
    name: Production error mode and leak smoke
    # Stays self-hosted: scripts/production-error-mode-smoke.sh reads the
    # production checkout (/var/www/mercasto) and `docker exec`s the live
    # mercasto_backend_container to assert env=production and debug=false.
    # Replayed verbatim on ubuntu-latest on 2026-09-13 it failed with
    # "/var/www/mercasto: MISSING" and
    # "backend container is not running: mercasto_backend_container" (exit 1).
    # Its HTTP probes are hosted-satisfiable; the runtime half is not.
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Verify production checkout exists
        run: |
          set -euo pipefail
          test -f /var/www/mercasto/scripts/production-error-mode-smoke.sh

      - name: Verify production runtime and safe public errors
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/production-error-mode-smoke.sh

  production-session-security:
    name: Production bearer and session security smoke
    # Stays self-hosted: scripts/production-session-security-smoke.sh reads the
    # live container's bootstrap config (session.secure, http_only, same_site,
    # cors.allowed_origins). Replayed verbatim on ubuntu-latest on 2026-09-13 it
    # died at that `docker exec` with
    # "Error response from daemon: No such container: mercasto_backend_container"
    # (exit 1) before reaching any assertion. Its curl/CORS probes passed hosted.
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Verify production checkout exists
        run: |
          set -euo pipefail
          test -f /var/www/mercasto/scripts/production-session-security-smoke.sh

      - name: Verify bearer-only auth, hardened cookies, and CORS
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/production-session-security-smoke.sh

  live-server-gate:
    name: Live server gate verify_quick
    # Stays self-hosted and cannot be hosted: it runs
    # `sudo -n bash scripts/server-operator.sh verify_quick` from the production
    # checkout, which drives docker compose, `npm run verify:quick` and the
    # server-resident smoke scripts. On ubuntu-latest the first assertion
    # already fails because /var/www/mercasto does not exist.
    runs-on: [self-hosted, linux]
    needs:
      - seo-aeo-smoke
      - production-error-mode
      - production-session-security
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Restore clean production checkout
        run: |
          set -euo pipefail
          test -d /var/www/mercasto
          cd /var/www/mercasto

          dirty="$(sudo -n git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::Production checkout is dirty; refusing to overwrite local changes."
            printf '%s\n' "$dirty" | sed -n '1,80p'
            exit 2
          fi

          sudo -n git fetch origin main --prune
          sudo -n git checkout -B main origin/main
          sudo -n git reset --hard origin/main

          test "$(sudo -n git branch --show-current)" = main
          test "$(sudo -n git rev-parse HEAD)" = "$(sudo -n git rev-parse origin/main)"
          test -f scripts/server-operator.sh

      - name: Run read-only verify_quick gate
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          sudo -n bash scripts/server-operator.sh verify_quick
