name: Production live gates

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-gates-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  seo-aeo-smoke:
    name: SEO/AEO production smoke
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check public search signals
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "retrying SEO smoke command in 8s ($attempt/6): $*" >&2
              sleep 8
            done
            "$@"
          }
          retry curl -fsS --max-time 30 https://mercasto.com/ -o /tmp/home.html
          retry curl -fsS --max-time 30 https://mercasto.com/sitemap.xml -o /tmp/sitemap.xml
          retry curl -fsS --max-time 30 https://mercasto.com/robots.txt -o /tmp/robots.txt
          grep -Eiq '<title[^>]*>[^<]{10,160}</title>' /tmp/home.html
          grep -Eiq 'name="description"|property="og:description"' /tmp/home.html
          grep -Eiq 'application/ld\+json|schema.org' /tmp/home.html
          grep -Eiq '<urlset|<sitemapindex|<url>' /tmp/sitemap.xml
          grep -Eiq 'Sitemap:|User-agent:' /tmp/robots.txt

  production-error-mode:
    name: Production error mode and leak smoke
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Verify production checkout exists
        run: |
          set -euo pipefail
          test -f /var/www/mercasto/scripts/production-error-mode-smoke.sh

      - name: Verify production runtime and safe public errors
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/production-error-mode-smoke.sh

  production-session-security:
    name: Production bearer and session security smoke
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Verify production checkout exists
        run: |
          set -euo pipefail
          test -f /var/www/mercasto/scripts/production-session-security-smoke.sh

      - name: Verify bearer-only auth, hardened cookies, and CORS
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash scripts/production-session-security-smoke.sh

  live-server-gate:
    name: Live server gate verify_quick
    runs-on: [self-hosted, linux]
    needs:
      - seo-aeo-smoke
      - production-error-mode
      - production-session-security
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Verify production checkout exists
        run: |
          set -euo pipefail
          test -d /var/www/mercasto
          test -f /var/www/mercasto/scripts/server-operator.sh

      - name: Run read-only verify_quick gate
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          sudo -n bash scripts/server-operator.sh verify_quick
