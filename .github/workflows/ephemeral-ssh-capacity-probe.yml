name: Ephemeral SSH Capacity Probe

on:
  push:
    branches:
      - ops/probe-vps-capacity-rdc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install SSH key
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/mercasto_probe_key
          chmod 600 ~/.ssh/mercasto_probe_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Read-only VPS capacity and agent probe
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mercasto_probe_key root@"$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname=$(hostname)"
          echo "nproc=$(nproc)"
          echo "cpu_online=$(cat /sys/devices/system/cpu/online)"
          echo "loadavg=$(cat /proc/loadavg)"
          lscpu | grep -E '^(CPU\(s\)|Model name|Thread|Core|Socket|Virtualization|Hypervisor vendor):' || true
          free -h
          echo '--- vmstat ---'
          vmstat 1 2 || true
          echo '--- possible agent services ---'
          systemctl list-units --type=service --all --no-legend 2>/dev/null | grep -Ei 'desktop|commander|remote|github|runner|actions' || true
          echo '--- possible agent unit files ---'
          systemctl list-unit-files --type=service --no-legend 2>/dev/null | grep -Ei 'desktop|commander|remote|github|runner|actions' || true
          echo '--- possible agent processes ---'
          ps -ef | grep -Ei '[d]esktop.*commander|[r]emote.*desktop|[g]ithub.*runner|[r]un\.sh|[r]unsvc\.sh|[a]ctions\.runner' || true
          echo '--- docker status ---'
          docker ps --format '{{.Names}}|{{.Status}}' || true
          REMOTE
