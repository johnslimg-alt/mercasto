name: SMS Launch Mode Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sms-readiness.yml'
      - 'scripts/sms-readiness-smoke.sh'
      - 'scripts/sms-launch-mode-smoke.sh'
      - 'backend/config/**'
      - 'backend/app/Http/Controllers/Api/AuthController.php'
      - 'backend/app/Http/Controllers/Api/PhoneVerificationController.php'
      - 'src/App.jsx'
      - 'src/components/OnboardingModal.jsx'
      - 'src/components/screens/ProfileEditScreen.jsx'
      - 'src/components/screens/AyudaScreen.jsx'
      - 'src/utils/helpCenterCopy.js'
      - 'docs/**'

permissions:
  contents: read

jobs:
  sms-launch-mode:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Verify SMS remains safely disabled
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          # /var/www/mercasto is intentionally root-owned; the self-hosted runner uses passwordless sudo for git refreshes.
          sudo -n git fetch origin main --prune
          sudo -n git reset --hard origin/main
          SMS_LAUNCH_MODE=disabled bash scripts/sms-launch-mode-smoke.sh
