name: MCP Bridge Status

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-bridge-status
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 832 &&
      github.actor == 'johnslimg-alt' &&
      github.event.comment.body == 'RUN:mcp_bridge_status'
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 10
    steps:
      - name: Read-only MCP bridge diagnostics
        shell: bash
        run: |
          set -u
          echo '=== HOST ==='
          hostname
          id
          echo '=== DNS ==='
          getent ahostsv4 mercasto.com || true
          getent ahostsv4 mcp.mercasto.com || true
          command -v dig >/dev/null 2>&1 && { dig +short NS mercasto.com; dig +short A mcp.mercasto.com; } || true
          echo '=== MCP UNITS ==='
          for u in mercasto-ssh-mcp.service mercasto-ssh-mcp-stdio.service desktop-commander.service remote-desktop-commander.service; do
            echo "-- $u --"
            systemctl show "$u" --no-pager -p LoadState -p ActiveState -p SubState -p UnitFileState -p ExecMainStatus -p FragmentPath 2>/dev/null || true
          done
          echo '=== LISTENERS ==='
          ss -lntp 2>/dev/null | grep -E '(:80 |:443 |:8001 |:8765 |:8080 )' || true
          echo '=== DOCKER EDGE ==='
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null | head -40 || true
          echo '=== NGINX MCP ROUTES ==='
          nginx -T 2>/dev/null | grep -n -E 'server_name mcp\.mercasto\.com|proxy_pass http://127\.0\.0\.1:(8001|8765)' || true
          echo '=== LOCAL BACKENDS ==='
          for p in 8001 8765; do
            echo "-- 127.0.0.1:$p --"
            curl -sS -o /dev/null -w '%{http_code}\n' --connect-timeout 2 --max-time 4 "http://127.0.0.1:$p/" || true
          done
          echo '=== FILE METADATA ==='
          stat -c '%n %s bytes %y' /etc/systemd/system/mercasto-ssh-mcp.service /etc/systemd/system/mercasto-ssh-mcp-stdio.service 2>/dev/null || true
          ls -ld /root/retired-mcp /root/mercasto-pr806-hotfix 2>/dev/null || true
          echo '=== DONE ==='
      - name: Report result
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 832,
              body: `MCP_BRIDGE_STATUS_RESULT\nstatus=${status}\nrun_id=${context.runId}\nrun=${runUrl}`
            });
