name: Self-hosted runner diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/self-hosted-runner-diagnostic.yml
      - infra/github-runners/docker-compose.runners.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/self-hosted-runner-diagnostic.yml
      - infra/github-runners/docker-compose.runners.yml

permissions:
  contents: read

jobs:
  runner-diagnostic:
    name: Verify self-hosted runner mount
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic ref
        uses: actions/checkout@v7

      - name: Check runner temp and workspace are writable
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -n "${GITHUB_WORKSPACE:-}"
          test -d "$GITHUB_WORKSPACE"
          test -w "$GITHUB_WORKSPACE"

          probe="$RUNNER_TEMP/mercasto-runner-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'runner-temp-ok\n' > "$probe"
          test -s "$probe"
          rm -f "$probe"

      - name: Check runner compose workdir isolation
        run: |
          set -euo pipefail
          test "$(grep -c 'RUNNER_WORKDIR: /tmp/runner' infra/github-runners/docker-compose.runners.yml)" -eq 3
          grep -Fq -- './runner1:/tmp/runner' infra/github-runners/docker-compose.runners.yml
          grep -Fq -- './runner2:/tmp/runner' infra/github-runners/docker-compose.runners.yml
          grep -Fq -- './runner3:/tmp/runner' infra/github-runners/docker-compose.runners.yml

      - name: Check production checkout mount
        run: |
          set -euo pipefail
          test -d /var/www/mercasto
          test -f /var/www/mercasto/docker-compose.yml
          test -d /var/www/mercasto/.git

      - name: Check Mercasto wrapper syntax
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          bash -n scripts/server-gate.sh

      - name: Check Docker command availability
        run: |
          set -euo pipefail
          docker version >/dev/null
