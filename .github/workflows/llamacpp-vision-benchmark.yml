name: Direct llama.cpp Qwen3-VL 2B vision benchmark

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Mercasto"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: llamacpp-qwen3-vl-2b-benchmark
  cancel-in-progress: true

jobs:
  announce:
    name: Announce direct llama.cpp benchmark
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[llamacpp-benchmark]')) }}
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve deployed commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deployed_sha="$GITHUB_SHA"
          else
            deployed_sha="${{ github.event.workflow_run.head_sha }}"
          fi
          test -n "$deployed_sha"
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha"

      - name: Publish queued benchmark status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          payload="$(python3 - "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
import json, sys
repo, run_id = sys.argv[1:]
print(json.dumps({
    "state": "pending",
    "context": "benchmark/llamacpp-latency",
    "description": "direct llama.cpp schema benchmark queued",
    "target_url": f"https://github.com/{repo}/actions/runs/{run_id}",
}))
PY
)"
          curl -fsS --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
            -d "$payload"

  benchmark:
    name: Benchmark direct llama.cpp vision path
    needs: announce
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Verify deployed main
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.announce.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "deployed_sha=$EXPECTED_SHA"

      - name: Run isolated direct llama.cpp benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          output="$RUNNER_TEMP/llamacpp-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

          set +e
          bash scripts/llamacpp-vision-benchmark-json-schema.sh 2>&1 | tee "$output"
          rc=${PIPESTATUS[0]}
          set -e

          read_value() {
            local key="$1"
            grep -E "^${key}=" "$output" | tail -n 1 | cut -d= -f2- || true
          }

          read_finish_reason() {
            local label="$1"
            sed -n "s/^${label}_response_meta=finish_reason=\\([^ ]*\\).*/\\1/p" "$output" | tail -n 1
          }

          first_elapsed="$(read_value vision_first_elapsed_ms)"
          warm_elapsed="$(read_value vision_warm_elapsed_ms)"
          first_json="$(read_value vision_first_moderation_json_valid)"
          warm_json="$(read_value vision_warm_moderation_json_valid)"
          first_finish="$(read_finish_reason vision_first)"
          warm_finish="$(read_finish_reason vision_warm)"

          {
            echo "exit_code=$rc"
            echo "first_elapsed_ms=${first_elapsed:-unknown}"
            echo "warm_elapsed_ms=${warm_elapsed:-unknown}"
            echo "first_json_valid=${first_json:-unknown}"
            echo "warm_json_valid=${warm_json:-unknown}"
            echo "first_finish_reason=${first_finish:-unknown}"
            echo "warm_finish_reason=${warm_finish:-unknown}"
          } >> "$GITHUB_OUTPUT"

          exit "$rc"

      - name: Publish benchmark commit status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_SHA: ${{ needs.announce.outputs.deployed_sha }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          FIRST_MS: ${{ steps.benchmark.outputs.first_elapsed_ms }}
          WARM_MS: ${{ steps.benchmark.outputs.warm_elapsed_ms }}
          FIRST_JSON: ${{ steps.benchmark.outputs.first_json_valid }}
          WARM_JSON: ${{ steps.benchmark.outputs.warm_json_valid }}
          FIRST_FINISH: ${{ steps.benchmark.outputs.first_finish_reason }}
          WARM_FINISH: ${{ steps.benchmark.outputs.warm_finish_reason }}
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            description="$(printf '%s' "$description" | tr -cd '[:alnum:] .,:_()/-' | cut -c1-140)"
            payload="$(python3 - "$state" "$context" "$description" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
import json, sys
state, context, description, repo, run_id = sys.argv[1:]
print(json.dumps({
    "state": state,
    "context": context,
    "description": description,
    "target_url": f"https://github.com/{repo}/actions/runs/{run_id}",
}))
PY
)"
            curl -fsS --retry 3 --retry-all-errors \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
              -d "$payload"
          }

          latency_state=success
          if [ "$BENCHMARK_OUTCOME" != "success" ] || [ -z "${FIRST_MS:-}" ] || [ -z "${WARM_MS:-}" ] || [ "$FIRST_MS" = "unknown" ] || [ "$WARM_MS" = "unknown" ]; then
            latency_state=failure
          fi
          post_status "$latency_state" "benchmark/llamacpp-latency" \
            "cold=${FIRST_MS:-unknown}ms warm=${WARM_MS:-unknown}ms outcome=${BENCHMARK_OUTCOME:-unknown}"

          json_state=success
          if [ "$FIRST_JSON" != "true" ] || [ "$WARM_JSON" != "true" ]; then
            json_state=failure
          fi
          post_status "$json_state" "benchmark/llamacpp-json" \
            "json cold=${FIRST_JSON:-unknown} warm=${WARM_JSON:-unknown} finish=${FIRST_FINISH:-unknown}/${WARM_FINISH:-unknown}"

      - name: Require benchmark success
        shell: bash
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          test "$BENCHMARK_OUTCOME" = "success"
