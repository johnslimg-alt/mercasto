name: Temporary 827 Home price patch

on:
  push:
    branches:
      - fix/827-home-price-locale-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/827-home-price-locale-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply exact HomeScreen replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/screens/HomeScreen.jsx')
          s = p.read_text()
          replacements = [
              ("import { formatNumber } from '../../utils/localeFormat';", "import { formatMXN, formatNumber } from '../../utils/localeFormat';"),
              ("const price = Number(ad.price || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });", "const price = formatMXN(ad.price || 0, lang, { minimumFractionDigits: 0, maximumFractionDigits: 0 });"),
              ("${Number(job.price || 0).toLocaleString()} MXN", "${formatNumber(job.price || 0, lang)} MXN"),
              ("${Number(srv.price || 0).toLocaleString()} MXN", "${formatNumber(srv.price || 0, lang)} MXN"),
              ("${Number(car.price || 0).toLocaleString()} MXN", "${formatNumber(car.price || 0, lang)} MXN"),
              ("${Number(ad.price || 0).toLocaleString()} <span", "${formatNumber(ad.price || 0, lang)} <span"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run targeted regression
        run: node --test tests/home-screen-price-localization.test.mjs
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/screens/HomeScreen.jsx
          git diff --cached --check
          git commit -m 'fix: localize HomeScreen price formatting'
          git push origin HEAD:fix/827-home-price-locale-v2
