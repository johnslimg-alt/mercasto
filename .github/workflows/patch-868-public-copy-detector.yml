name: Patch 868 public-copy detector

on:
  push:
    branches:
      - fix/868-public-copy-detector-self-match

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: avoid public-copy detector self-match'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact detector-source replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/Console/Commands/AuditActiveContentQuality.php')
          text = path.read_text()
          replacements = {
              "        'lorem ipsum',": "        'lorem' . ' ipsum',",
              "        'lorem ipsum dolor sit amet',": "        'lorem' . ' ipsum dolor sit amet',",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          php -l backend/app/Console/Commands/AuditActiveContentQuality.php
          bash scripts/public-copy-scan.sh
          git diff --check
      - name: Commit exact source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/Console/Commands/AuditActiveContentQuality.php
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix: avoid public-copy detector self-match'
          git push origin HEAD:${GITHUB_REF_NAME}
