name: Frontend build

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tests/design-token-contract.test.mjs'
      - 'scripts/design-token-contract-gate.sh'
      - 'docs/design/token-contract.md'
      - '.github/workflows/frontend-build.yml'
      - 'scripts/pr-status-comment.sh'

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: read

concurrency:
  group: frontend-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check design tokens
        run: bash scripts/design-token-contract-gate.sh

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Comment PR status
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/pr-status-comment.sh
