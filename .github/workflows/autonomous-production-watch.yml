name: Autonomous Production Watch

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Mercasto
    types:
      - completed
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: autonomous-production-watch
  cancel-in-progress: false

jobs:
  public-watch:
    name: Public production watch
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 12
    outputs:
      fallback_required: ${{ steps.watch.outputs.fallback_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check production from external runner
        id: watch
        shell: bash
        run: |
          set +e
          bash scripts/public-production-watch.sh external
          watch_exit=$?
          set -e

          case "$watch_exit" in
            0)
              echo 'fallback_required=false' >> "$GITHUB_OUTPUT"
              ;;
            75)
              echo 'fallback_required=true' >> "$GITHUB_OUTPUT"
              echo '::warning::GitHub-hosted runner has no TCP route to Mercasto; requesting the read-only self-hosted fallback.'
              ;;
            *)
              echo 'fallback_required=false' >> "$GITHUB_OUTPUT"
              exit "$watch_exit"
              ;;
          esac

  fallback-watch:
    name: Self-hosted production fallback
    needs: public-watch
    if: >-
      always() &&
      needs.public-watch.result == 'success' &&
      needs.public-watch.outputs.fallback_required == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm production from srv1
        shell: bash
        run: bash scripts/public-production-watch.sh fallback

  repository-watch:
    name: Repository static watch
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check scripts
        run: npm run check:scripts

      - name: Run static safety scans
        run: npm run check:static-safety

      - name: Validate compose config
        run: |
          DB_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_PASSWORD=ci docker compose config >/tmp/mercasto-compose-base.yml
          DB_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.override.yml config >/tmp/mercasto-compose-prod.yml

  report-failure:
    name: Report watch failure
    runs-on: ubuntu-latest
    needs:
      - public-watch
      - fallback-watch
      - repository-watch
    if: >-
      always() &&
      (needs.public-watch.result == 'failure' ||
       needs.fallback-watch.result == 'failure' ||
       needs.repository-watch.result == 'failure')
    timeout-minutes: 5
    steps:
      - name: Create or update production watch issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = 'AUTONOMOUS_PRODUCTION_WATCH_INCIDENT';
            const title = 'Autonomous production watch failing';
            const body = [
              marker,
              '',
              'Autonomous Production Watch failed.',
              '',
              `Latest failed run: ${runUrl}`,
              '',
              'Required action:',
              '- inspect the failed job log;',
              '- fix the smallest reproducible cause;',
              '- rerun the failed workflow or run `npm run verify:quick` from production checkout;',
              '- do not close this issue until the watch is green again.',
              '',
              'Safety boundary: this workflow is read-only. It does not deploy, migrate, restart services, or mutate production data.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'autonomous-watch,incident',
              per_page: 20
            });
            const existing = issues.find(issue => issue.title === title || (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. Latest run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['production', 'autonomous-watch', 'incident']
              });
            }
