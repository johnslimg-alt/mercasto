name: Env Readiness Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/env-readiness-smoke.sh'
      - 'scripts/production-env-readiness-smoke.sh'
      - 'backend/config/**'
      - 'docs/**'
      - '.github/workflows/env-readiness.yml'

permissions:
  contents: read

jobs:
  env-readiness:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Refresh production checkout
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          sudo -n git fetch origin main --prune
          sudo -n git reset --hard origin/main

      - name: Run runtime launch readiness smoke
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          ENV_READINESS_CONTAINER=mercasto_backend_container \
            REQUIRE_ENV_READY=1 \
            bash scripts/env-readiness-smoke.sh

      - name: Run production env readiness smoke
        run: |
          set -euo pipefail
          cd /var/www/mercasto
          ENV_READINESS_CONTAINER=mercasto_backend_container \
            bash scripts/production-env-readiness-smoke.sh
