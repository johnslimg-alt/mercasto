services:
  mercasto-frontend:
    volumes:
      # Reef CRM shares the edge container but owns its hostname configuration
      # outside the Mercasto checkout so git reset/deploy cannot silently delete it.
      # Never auto-create a missing source path: deployment must fail visibly instead.
      - type: bind
        source: /etc/mercasto-edge/reef-crm.conf
        target: /etc/nginx/conf.d/reef-crm.conf
        read_only: true
        bind:
          create_host_path: false
      # Passport Mexico owns its vhost outside the Mercasto checkout for the
      # same reason: another app must never make Mercasto source dirty.
      - type: bind
        source: /etc/mercasto-edge/passport.conf
        target: /etc/nginx/conf.d/passport.conf
        read_only: true
        bind:
          create_host_path: false
      # DeepSeek Harness owns harness.flyaicrm.com on the same edge container.
      # Its vhost lives outside the checkout for the same reason as above:
      # appending it to the tracked default.conf used to make the production
      # checkout dirty and broke the post-deploy main checkout guard.
      - type: bind
        source: /etc/mercasto-edge/harness.conf
        target: /etc/nginx/conf.d/harness.conf
        read_only: true
        bind:
          create_host_path: false

  mercasto-scheduler:
    depends_on:
      redis:
        condition: service_healthy

  mercasto-reverb:
    depends_on:
      redis:
        condition: service_healthy
